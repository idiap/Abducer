version: 1
title: Cumulative result and subgoal atlas
created_at: "2026-07-11"
status: resolved
completed_at: "2026-07-11"
implementation_status: >
  Implemented schemas, builders, validators, workflow hooks, report rendering,
  documentation, skill registry integration, and agentic-check enforcement for
  the cumulative result/subgoal atlas, problem-space map, derivation vault, and
  subgoal state transitions.
source_artifacts:
  scientific_contribution_monitor: agentic/reports/scientific_contribution_monitor/latest.json
  discovery_marathon_report: agentic/reports/discovery_marathon/latest.json
  full_timeline_report: agentic/reports/discovery_marathon/full_timeline.html
  formal_derivation_report: agentic/reports/timeline_formal_derivation/latest.json
  pvsnp_pressure_bridges: agentic/reports/pvsnp_pressure_bridges/latest.json
  pvsnp_negative_tactics: agentic/reports/pvsnp_negative_tactics/latest.json
  big_deal_goal_archive: agentic/reports/big_deal_goal_archive/latest.json
  target_profiles: agentic/scripts/target_profiles.py
reflection:
  current_state: >
    Abducer already persists rich cumulative reports: discovery timelines,
    contribution candidates, pressure bridges, negative tactics, derivation
    packets, big-deal goal summaries, and target-specific profiles. This is
    enough for human inspection, but it is not yet a fully durable result
    memory. The strongest artifacts are still organized by report type and
    latest run state rather than by stable subgoal identity.
  gap: >
    The workflow needs a target-scoped result atlas where every important
    result, derivation, obstruction, falsifier, bridge, and publishable
    stepping-stone candidate is stored as a stable object with subgoal links,
    proof dependencies, validation status, source-cycle evidence, open
    obligations, and problem-space coordinates. Without this, future cycles can
    rediscover or restate results instead of building cumulatively.
  design_principle: >
    Results should be persisted at the level at which future reasoning needs
    to reuse them: not merely as prose in a timeline, and not only as ranked
    queue items, but as typed subgoal-state objects. Each object should say:
    what was achieved, what remains to be achieved, what it depends on, why it
    matters for the global problem, which target commitments it touches, and
    what would promote or demote it.
  target_scope: >
    The atlas must preserve target separation. P vs NP and Yang-Mills can share
    infrastructure, schemas, validators, and report widgets, but their result
    types, achievement criteria, barrier language, proof obligations, and
    problem-space maps must remain target-specific.
todos:
  - id: CRSA-001
    type: planning_todo
    phase: result-atlas-schema
    owner: agentic/spec/result_subgoal_atlas.schema.json
    priority: critical
    risk_class: cumulative_memory_gap
    title: Define a typed schema for cumulative result and subgoal atlas entries.
    intent: >
      Create a schema for durable result objects that future cycles can query.
      Each entry must represent a subgoal-level scientific object rather than a
      transient report paragraph.
    use_skills:
      - scientific-contribution-detector
      - contribution-oriented-subgoal-manager
      - main-problem-alignment-auditor
      - paper-contribution-readiness-judge
    required_artifact:
      - agentic/spec/result_subgoal_atlas.schema.json
      - agentic/spec/result_subgoal_entry.schema.json
    acceptance_criteria:
      - Entry schema includes stable `result_id`, `target_id`, `subgoal_id`, `result_kind`, `claim`, `achievement_status`, `problem_space_coordinates`, `dependencies`, `derivations`, `evidence_sources`, `validation_state`, `open_obligations`, `promotion_criteria`, `demotion_criteria`, `paper_relevance`, and `non_claims`.
      - Schema distinguishes achieved, partially achieved, blocked, falsified, quarantined, and handoff-ready states.
      - Schema supports target-specific extension fields for P vs NP and Yang-Mills without cross-target vocabulary leakage.
      - Schema can reference existing artifacts by path, cycle id, branch id, theorem/proposition id, and validator output.
    blocked_by: []
    evidence:
      - agentic/reports/scientific_contribution_monitor/latest.json
      - agentic/reports/timeline_formal_derivation/latest.json
      - agentic/reports/pvsnp_negative_tactics/latest.json
    review_date: "2026-07-11"
    failure_modes:
      - Result entries duplicate timeline prose without stable subgoal identity.
      - Schema cannot express dependencies, validation state, or open proof obligations.
      - Target-specific fields allow P vs NP and Yang-Mills concepts to bleed into each other.
    status: resolved

  - id: CRSA-002
    type: workflow_todo
    phase: result-atlas-builder
    owner: agentic/scripts/build_result_subgoal_atlas.py
    priority: critical
    risk_class: report_type_fragmentation
    title: Build a cumulative result atlas from existing reports.
    intent: >
      Aggregate durable result candidates from contribution monitor, pressure
      bridges, negative tactics, formal derivations, big-deal archive, and
      discovery cycles into a single target-scoped atlas.
    use_skills:
      - scientific-contribution-detector
      - pvsnp-negative-tactic-selector
      - pvsnp-pressure-bridge-forger
      - finite-theorem-section-packager
      - main-problem-alignment-auditor
    required_artifact:
      - agentic/scripts/build_result_subgoal_atlas.py
      - agentic/reports/result_subgoal_atlas/latest.json
      - agentic/reports/result_subgoal_atlas/latest.md
    acceptance_criteria:
      - Builder reads current active target and refuses to merge target artifacts with mismatched `target_id`.
      - Builder extracts entries from at least contribution candidates, P vs NP pressure bridges, P vs NP negative tactics, formal derivation propositions, and big-deal archive milestones when available.
      - Builder de-duplicates objects by claim, target, branch, route family, and source evidence rather than by text string alone.
      - Builder emits both machine-readable JSON and human-readable Markdown organized by subgoal.
    blocked_by:
      - CRSA-001
    evidence:
      - agentic/reports/scientific_contribution_monitor/latest.json
      - agentic/reports/pvsnp_pressure_bridges/latest.json
      - agentic/reports/timeline_formal_derivation/latest.json
    review_date: "2026-07-11"
    failure_modes:
      - Builder merely concatenates reports without normalizing claims into result objects.
      - Duplicate variants of the same obstruction appear as separate achievements.
      - Builder silently uses stale artifacts from another target.
    status: resolved

  - id: CRSA-003
    type: workflow_todo
    phase: problem-space-map
    owner: agentic/scripts/build_problem_space_map.py
    priority: critical
    risk_class: global_problem_map_missing
    title: Build a target-specific map of the overall problem space and subgoal status.
    intent: >
      Represent the global problem as a structured map: major route families,
      essential commitments, subgoals, achieved results, remaining obligations,
      blocked zones, quarantined routes, and high-reward next moves.
    use_skills:
      - main-problem-alignment-auditor
      - progression-payoff-judge
      - next-experiment-queue-ranker
      - pvsnp-conceptual-pressure-localizer
      - physics-regime-map-builder
    required_artifact:
      - agentic/scripts/build_problem_space_map.py
      - agentic/reports/problem_space_map/latest.json
      - agentic/reports/problem_space_map/latest.md
    acceptance_criteria:
      - P vs NP map includes route families such as hardness magnification, natural-property/barrier analysis, MCSP/MKtP carriers, proof-complexity transfer, padding/projection, and all-exponent uniformity lifting.
      - Yang-Mills map includes route families such as finite OS obstruction, Wilson collar calculation, same-theory transfer, constructive continuum control, spectral reconstruction, and nontriviality witness.
      - Each map node states `achieved`, `partially_achieved`, `open`, `blocked`, `quarantined`, or `not_started`.
      - Each node links to atlas result IDs and states what would count as the next achievement.
    blocked_by:
      - CRSA-001
      - CRSA-002
    evidence:
      - agentic/scripts/target_profiles.py
      - agentic/reports/macro_strategy/latest.json
      - agentic/reports/target_literature_evolution/latest.json
    review_date: "2026-07-11"
    failure_modes:
      - Problem map becomes a static taxonomy rather than a live achievement/open-obligation ledger.
      - Map does not distinguish achieved scientific content from queued intentions.
      - Map uses generic labels that are not meaningful inside the target problem.
    status: resolved

  - id: CRSA-004
    type: workflow_todo
    phase: derivation-vault
    owner: agentic/scripts/build_derivation_vault.py
    priority: high
    risk_class: derivation_persistence_gap
    title: Persist derivations as reusable theorem/proof objects linked to subgoals.
    intent: >
      Move important derivations out of transient timeline cards into a
      derivation vault where definitions, assumptions, equations, proof steps,
      failure points, validation status, and result links are stable.
    use_skills:
      - kb-deduce
      - kb-proof-sketcher
      - pvsnp-symbolic-complexity-auditor
      - finite-theorem-section-packager
      - endpoint-worked-calculation-packager
    required_artifact:
      - agentic/scripts/build_derivation_vault.py
      - agentic/reports/derivation_vault/latest.json
      - agentic/reports/derivation_vault/latest.md
    acceptance_criteria:
      - Vault ingests `timeline_formal_derivation`, branch-output candidate lemmas, equations, and validated paper-derivation fragments.
      - Each derivation links to at least one atlas result or explicitly records why it is orphaned.
      - Each derivation states definitions, assumptions, validity regime, proof status, unresolved obligations, and non-claims.
      - Vault separates exact derivations from sketches, heuristic arguments, symbolic audits, and falsifier calculations.
    blocked_by:
      - CRSA-001
      - CRSA-002
    evidence:
      - agentic/reports/timeline_formal_derivation/latest.json
      - agentic/reports/timeline_latex_sections/latest.json
      - agentic/reports/discovery_marathon/latest.json
    review_date: "2026-07-11"
    failure_modes:
      - Derivations cannot be reused because assumptions and validity regimes are not self-contained.
      - Sketches are promoted as proofs.
      - Orphan derivations accumulate without subgoal or result links.
    status: resolved

  - id: CRSA-005
    type: hook_todo
    phase: discovery-loop-integration
    owner: agentic/scripts/run_discovery_marathon.py
    priority: high
    risk_class: future_cycle_forgets_results
    title: Inject atlas and problem-space state into future branch prompts and queue ranking.
    intent: >
      Make future cycles aware of what has already been achieved and what
      remains open per subgoal, preventing rediscovery and low-value repetition.
    use_skills:
      - long-horizon-route-portfolio-manager
      - next-experiment-queue-ranker
      - contribution-oriented-subgoal-manager
      - main-problem-alignment-auditor
    required_artifact:
      - agentic/scripts/run_discovery_marathon.py
      - agentic/scripts/discovery_marathon_scheduler.py
      - agentic/registries/discovery_marathon_skill_dispatch.yaml
    acceptance_criteria:
      - Branch prompt includes a compact target-scoped summary of achieved results, live subgoals, blocked obligations, and no-repeat constraints from the atlas.
      - Scheduler gives priority to branches that close open problem-map nodes or validate near-stepping-stone atlas entries.
      - Scheduler demotes branches whose next action only restates an already archived result without improving validation, proof status, or obligation closure.
      - Dispatch trace records use of the atlas in branch selection and obligation gating phases.
    blocked_by:
      - CRSA-002
      - CRSA-003
    evidence:
      - agentic/scripts/run_discovery_marathon.py
      - agentic/scripts/discovery_marathon_scheduler.py
      - agentic/registries/discovery_marathon_skill_dispatch.yaml
    review_date: "2026-07-11"
    failure_modes:
      - Future cycles keep rediscovering known results.
      - Queue ranking ignores achieved/open status by subgoal.
      - Atlas guidance is injected as prose but not enforced by validators.
    status: resolved

