schema: abducer.ym_representational_dynamics_integration_todos.v1
created_at: "2026-07-21"
purpose: >
  Integrate the Yang-Mills representational-dynamics research package and
  17-skill workflow bundle into Abducer's target-scoped Yang-Mills discovery
  marathon workflow without overclaiming Clay-level status or overwriting
  artifacts from other mathematical themes.
source_artifacts:
  research_package_zip: "/Users/afreitas/Downloads/yang_mills_representational_dynamics_package_2026-07-20 (12).zip"
  vscode_codex_skill_bundle_zip: "/Users/afreitas/Downloads/yang_mills_vscode_codex_skills_2026-07-20 (1).zip"
  integration_plan: docs/case-studies/yang-mills/ym-representational-dynamics-integration-todos.md
implementation_status:
  status: completed
  completed_at: "2026-07-21"
  validator: agentic/scripts/validate_ym_workflow_integration.py
  summary: >
    Imported the source archives, generated source/proof/test/report artifacts,
    adapted the 17 YM skills into the repo-visible skill tree, wired the
    target-scoped dispatch overlay, added deterministic validation, and updated
    the KB/runbooks.
global_controls:
  target_scope: yang-mills-existence-and-mass-gap-target
  epistemic_status: >
    Treat the source package as a research programme and restricted theorem
    suite. It does not construct four-dimensional continuum Yang-Mills theory
    and does not prove the Clay mass-gap problem.
  report_collision_policy: >
    Every generated YM artifact must be target-scoped or integration-scoped and
    must not update P-vs-NP latest pointers, HTML timelines, LaTeX files, or PDF
    outputs.
  publication_consolidation_limit: >
    A subgoal consolidation may run at most four completion cycles with
    recursion depth one before it must publish, demote, block, or return to
    conceptual exploration.
todos:
  - id: YMINT-001
    type: planning_todo
    phase: provenance-and-integrity
    owner: agentic/external
    priority: critical
    risk_class: provenance-loss
    title: Import the YM source archives into a versioned repo-local evidence area
    intent: >
      Preserve the research package and the skill bundle as auditable external
      source material before adapting any code, report, proof object, or skill.
    use_skills:
      - skill-creator
      - proof-depth-pressure-formalizer
      - ym-audit-frontier
    required_artifact:
      - agentic/external/yang_mills_representational_dynamics/2026-07-20/README.md
      - agentic/external/yang_mills_representational_dynamics/2026-07-20/source_manifest.json
      - agentic/external/yang_mills_representational_dynamics/2026-07-20/checksum_report.json
    acceptance_criteria:
      - Both source zips are copied or extracted under a versioned YM-specific repo path.
      - The original archive paths, archive sizes, extraction roots, and checksums are recorded.
      - The package `CHECKSUMS.sha256` validation is rerun after import and captured.
      - `unzip -tq` validation for both source archives is captured.
      - The imported bundle remains intact as source material before any Abducer-specific adaptation.
      - The import excludes credentials, `.git` internals, caches, and unrelated generated reports.
    blocked_by: []
    evidence:
      - docs/case-studies/yang-mills/ym-representational-dynamics-integration-todos.md
      - "/Users/afreitas/Downloads/yang_mills_representational_dynamics_package_2026-07-20 (12).zip"
      - "/Users/afreitas/Downloads/yang_mills_vscode_codex_skills_2026-07-20 (1).zip"
    review_date: "2026-07-21"
    failure_modes:
      - The source package is cherry-picked in a way that loses internal validators or provenance.
      - Imported files are mixed into P-vs-NP or generic latest-report paths.
      - Credential files or local cache artifacts are copied into the integration area.
      - The adapted skill layer is treated as source of truth before the original bundle is preserved.
    status: resolved

  - id: YMINT-002
    type: workflow_todo
    phase: evidence-indexing
    owner: agentic/reports/ym_representational_dynamics_integration
    priority: critical
    risk_class: shallow-literature-accounting
    title: Build a source index that maps package artifacts to YM proof roles
    intent: >
      Convert the package contents into an inspectable evidence map so later
      cycles can cite documents, theorem graphs, ledgers, tests, and calibration
      data without hand-wavy accounting.
    use_skills:
      - ym-mechanize-proof-core
      - ym-audit-frontier
      - target-literature-source-curator
      - proof-nontriviality-auditor
    required_artifact:
      - agentic/reports/ym_representational_dynamics_integration/source_index.json
      - agentic/reports/ym_representational_dynamics_integration/source_index.md
    acceptance_criteria:
      - The index lists every PDF, TeX source, Python module, test, theorem dependency graph, calibration dataset, and ledger from the package manifest.
      - Each indexed item has a workflow role, claim level, source path, imported path, and target relevance note.
      - Each item is marked as conceptual foundation, representation calculus, restricted theorem, computational calibration, theorem dependency graph, frontier ledger, or reproduction support.
      - The index explicitly distinguishes proved finite/restricted contributions from conditional continuum or spectral-transfer hypotheses.
      - The index provides the recommended reading order and notes how each document changes or fails to change the main YM proof state.
    blocked_by:
      - YMINT-001
    evidence:
      - docs/case-studies/yang-mills/ym-representational-dynamics-integration-todos.md
      - agentic/todos/ym_representational_dynamics_integration_todos.yaml
    review_date: "2026-07-21"
    failure_modes:
      - The index becomes a file list without proof-role semantics.
      - Conditional results are recorded as proved Clay-level objects.
      - Literature or prior-art relevance is represented only as vague narrative.
      - The index cannot be consumed by report generation or marathon prompts.
    status: resolved

  - id: YMINT-003
    type: test_todo
    phase: restricted-model-reproduction
    owner: agentic/tests
    priority: critical
    risk_class: unverified-imported-results
    title: Run and capture the package's restricted-model tests inside Abducer
    intent: >
      Reproduce the finite and restricted computational claims from the package
      before using them as calibration evidence in discovery cycles.
    use_skills:
      - ym-calibrate-restricted-models
      - ym-mechanize-proof-core
      - prism-generative-validation-runner
    required_artifact:
      - agentic/reports/ym_representational_dynamics_integration/test_report.json
      - agentic/reports/ym_representational_dynamics_integration/test_report.md
    acceptance_criteria:
      - The finite spectral core tests are run from the imported relational-rigidity module.
      - The heat-kernel influence and advanced regulator calibration tests are run from the imported heat-kernel module.
      - The two-plaquette bridge tests are run from the imported fibered block RG module.
      - The expected 31 tests either pass or failures are captured with exact command, exit code, and traceback path.
      - The test report states that these tests validate restricted models only and cannot certify the Clay target.
    blocked_by:
      - YMINT-001
      - YMINT-002
    evidence:
      - docs/case-studies/yang-mills/ym-representational-dynamics-integration-todos.md
      - agentic/external/yang_mills_representational_dynamics/2026-07-20/research_package/README.md
      - agentic/reports/ym_representational_dynamics_integration/test_report.json
    review_date: "2026-07-21"
    failure_modes:
      - Tests are skipped but the package is treated as reproduced.
      - Passing finite-model tests are promoted to continuum evidence without a transfer certificate.
      - The test harness mutates imported source files instead of running them as external evidence.
      - Failures are hidden inside marathon logs and never summarized.
    status: resolved

  - id: YMINT-004
    type: workflow_todo
    phase: proof-object-ingestion
    owner: agentic/proof_objects
    priority: critical
    risk_class: proof-object-overclaim
    title: Ingest package results as claim-leveled YM proof objects
    intent: >
      Turn each theorem dependency graph, proof ledger entry, and restricted
      theorem into a typed proof object that can be routed, audited, promoted,
      demoted, or used as calibration evidence.
    use_skills:
      - ym-mechanize-proof-core
      - ym-audit-frontier
      - proof-nontriviality-auditor
      - proof-hard-gate-selector
    required_artifact:
      - agentic/reports/discovery_marathon/targets/yang-mills-existence-and-mass-gap-target/proof_objects/ym_representational_dynamics_objects.json
      - agentic/reports/discovery_marathon/targets/yang-mills-existence-and-mass-gap-target/proof_objects/ym_representational_dynamics_objects.md
    acceptance_criteria:
      - Every imported proof object has a claim level, hypotheses, dependencies, source artifact, proof status, non-claims, and demotion trigger.
      - The finite spectral lemmas, representation-error composition, heat-kernel translation obstruction, two-plaquette `U(1)` bridge, covariance decomposition, defect cluster bound, and finite product total-variation comparison are represented separately.
      - Continuum clustering and spectral transfer are represented only as conditional frontier hypotheses unless independently discharged.
      - Each proof object names the hard gate it could affect or is marked support-only.
      - No imported object is allowed to claim solved, Clay-complete, or continuum construction status.
    blocked_by:
      - YMINT-002
      - YMINT-003
    evidence:
      - docs/case-studies/yang-mills/ym-representational-dynamics-integration-todos.md
      - agentic/todos/proof_depth_control_stack_todos.yaml
    review_date: "2026-07-21"
    failure_modes:
      - Restricted results are merged into one vague breakthrough claim.
      - Proof objects have no falsifier, hypothesis, or demotion condition.
      - The result atlas cannot distinguish support-only objects from load-bearing frontier gates.
      - Imported theorem dependencies are not traceable back to source artifacts.
    status: resolved

