  gaps:
  - No workflow-skill/v1 host adapter is supplied. Native skill/hook/CLI interfaces exist, but payload
    materialization, guard evidence, execution effects and receipt translation are not qualified for this
    format.
  - Native control flow remains opaque; coverage is interface_only, not source-equivalence certification.
  - Named payload schemas validate the common envelope only; nominal artifact payloads and artifact_type
    discriminators are not refined by that schema.
  - Conditional/advisory skips, repeated ReviewFindingSet aggregation, exit obligations and handoff adapters
    are preserved verbatim, not executable v1 dataflow.
extensions:
  abducer.owner:
    path: skills/orchestration/conceptual-frontier-deepening/SKILL.md
  abducer.native_identity:
    id: conceptual_frontier_deepening
  abducer.native_contract:
    id: conceptual_frontier_deepening
    version: 1.0.0
    visible_name: Conceptual Frontier Deepening
    aliases:
    - conceptual-frontier-deepening
    - deep-conceptual-search
    activation: opt_in
    owner_skill: conceptual-frontier-deepening
    target_scope:
    - mathematical
    - scientific
    trigger:
      all_of:
      - frozen_target_theory_literature_context
      - approved_budget
      any_of:
      - repeated_blocker
      - representation_failure
      - aggressive_conceptual_search_requested
      none_of:
      - unfrozen_context
    input_artifact:
      type: FrozenDiscoveryContext
      schema: agentic/spec/named_workflow_artifacts.schema.json
    steps:
    - id: plan_deepening
      order: 5
      skill: conceptual-frontier-deepening
      mode: required
      when: null
      consumes:
      - FrozenDiscoveryContext
      produces:
      - ConceptualDeepeningPlan
      on_failure: stop
    - id: assimilate_literature
      order: 10
      skill: frontier-literature-assimilator
      mode: required
      when: null
      consumes:
      - FrozenDiscoveryContext
      produces:
      - LiteratureFrontierMap
      on_failure: stop
    - id: forge_invention
      order: 20
      skill: literature-conditioned-invention-forger
      mode: required
      when: null
      consumes:
      - LiteratureFrontierMap
      produces:
      - InventionCandidates
      on_failure: stop
    - id: portfolio
      order: 30
      skill: parallel-hypothesis-portfolio
      mode: required
      when: null
      consumes:
      - InventionCandidates
      produces:
      - HypothesisPortfolio
      on_failure: stop
    - id: reflect_discovery
      order: 40
      skill: reflective-conceptual-discovery
      mode: required
      when: null
      consumes:
      - HypothesisPortfolio
      produces:
      - ConceptualReflection
      on_failure: quarantine
    - id: synthesize
      order: 50
      skill: reflective-theory-synthesizer
      mode: required
      when: null
      consumes:
      - ConceptualReflection
      produces:
      - TheoryCandidates
      on_failure: stop
    - id: blind_adjudicate
      order: 60
      skill: blind-conceptual-preference-adjudicator
      mode: required
      when: null
      consumes:
      - TheoryCandidates
      produces:
      - BlindAdjudication
      on_failure: stop
    - id: compile_atlas_defects
      order: 70
      skill: theory-atlas-defect-compiler
      mode: conditional
      when: category_or_hott_pressure
      consumes:
      - TheoryCandidates
      produces:
      - TheoryAtlasDefects
      on_failure: quarantine
    - id: derive_central_routes
      order: 80
      skill: central-formal-conceptual-routes
      mode: required
      when: null
      consumes:
      - BlindAdjudication
      produces:
      - CentralConceptualRoutes
      on_failure: stop
    - id: check_bridge_equivalence
      order: 90
      skill: bridge-object-equivalence-checker
      mode: conditional
      when: multiple_carriers_compete
      consumes:
      - CentralConceptualRoutes
      produces:
      - BridgeEquivalenceDecision
      on_failure: quarantine
    - id: produce_formal_claim
      order: 100
      skill: formal-claim-producer
      mode: required
      when: null
      consumes:
      - CentralConceptualRoutes
      - BlindAdjudication
      produces:
      - FormalClaimProducerOutputV2
      on_failure: stop
    hooks:
    - hook_id: named-workflow-router
      event: UserPromptSubmit
      phase: activation
      condition: trigger matches and budget approved
      required_inputs:
      - prompt
      - target
      - budget
      decision: recommend
      emitted_artifact: WorkflowRecommendation
    - hook_id: workflow-membership-policy
      event: PreSkillUse
      phase: steps
      condition: active workflow and step membership validate
      required_inputs:
      - workflow_id
      - workflow_version
      - target
      - step_id
      - skill
      - conditional_evidence
      decision: block
      emitted_artifact: SkillAuthorization
    - hook_id: typed-output-policy
      event: PostSkillUse
      phase: steps
      condition: declared output and receipt validate
      required_inputs:
      - workflow_id
      - step_id
      - artifact_type
      - epistemic_status
      - receipt
      decision: block
      emitted_artifact: SkillReceipt
    - hook_id: workflow-tool-policy
      event: PreToolUse
      phase: steps
      condition: path safety mutation and budget validate
      required_inputs:
      - workflow_id
      - step_id
      - tool
      - target_path
      - mutation_class
      decision: block
      emitted_artifact: ToolAuthorization
    - hook_id: workflow-exit-policy
      event: Stop
      phase: exit
      condition: exit artifacts and obligations validate
      required_inputs:
      - workflow_id
      - exit_artifacts
      - open_obligations
      decision: block
      emitted_artifact: WorkflowExitReceipt
    exit_gate:
      validator: agentic/scripts/validate_workflow_contracts.py
      consumes: FormalClaimProducerOutputV2
      allowed:
      - validated
      - quarantined
      - rejected
      required_artifacts:
      - FormalClaimProducerOutputV2
      - BlindAdjudication
      open_obligations_policy: allow_declared
    handoffs:
    - when: formal_claim_ready
      workflow: theorem_proof_delivery
      artifact_type: ProofQueueItem
      adapter: formal_claim_to_proof_queue
    - when: candidate_not_ready_or_non_dominated
      workflow: conceptual_hypothesis_exploration_loop
      artifact_type: ConceptualLearningDelta
      adapter: formal_claim_disposition_to_learning_delta
    prohibitions:
    - No theory selection by experiment
    - No non-blind route adjudication
    - No execution without approved budget
    cost_profile: expensive
  abducer.environment:
    python: pyproject.toml
    lock: uv.lock
    native_controls: .codex/config.toml
    native_controls_optional: true
    control_policy: prism_me/shared/references/codex-control-stack.md
  abducer.execution_boundary:
    status: specification_only
    notes: Source inspection only. Effects above deny native execution until a separately reviewed adapter
      exists.
  abducer.step_interfaces:
    plan_deepening: step_plan_deepening
    assimilate_literature: step_assimilate_literature
    forge_invention: step_forge_invention
    portfolio: step_portfolio
    reflect_discovery: step_reflect_discovery
    synthesize: step_synthesize
    blind_adjudicate: step_blind_adjudicate
    compile_atlas_defects: step_compile_atlas_defects
    derive_central_routes: step_derive_central_routes
    check_bridge_equivalence: step_check_bridge_equivalence
    produce_formal_claim: step_produce_formal_claim
