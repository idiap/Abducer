interface:
  display_name: "Contribution-Oriented Subgoal Manager"
  short_description: "Keep the loop aimed at independently valuable scientific subgoals"
  default_prompt: "First restate the intent gate, exact inputs and artifacts in scope, required output shape, and any missing context explicitly; do not assume hidden repository context. When the task involves substantive inference, explicitly separate prompt/context defects from genuine mathematical difficulty: classify context_status as well-posed / partially-ill-posed / ill-posed, inference_status as determined / underdetermined / difficult-but-well-posed, give the smallest repair, and report qualified certainty both now and assuming a well-posed context, and when applicable emit a short Prompt/Inference Diagnosis block before the main result. Use $contribution-oriented-subgoal-manager to ensure the active workflow is always aiming at at least one standalone contribution candidate. Report contribution metrics, active candidates, routing decision, validation gap, staleness, and the next contribution-oriented objective."
