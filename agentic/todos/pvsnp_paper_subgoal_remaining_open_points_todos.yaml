status: open
source_artifacts:
  latest_strategy_judge: agentic/reports/strategy_progression_judge/latest.md
  latest_contribution_monitor: agentic/reports/scientific_contribution_monitor/latest.md
  latest_inference_quality: agentic/reports/pvsnp_inference_quality/latest.md
