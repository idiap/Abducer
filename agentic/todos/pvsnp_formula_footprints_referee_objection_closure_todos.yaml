reflection:
  purpose: >
    Convert the Formula Footprints and Full Rows acceptance critique into a
    referee-objection closure loop. The queue exists to stop the current
    P vs NP paper branch from advancing by producing more nearby abstractions
    while the existing draft still has unresolved technical, literature,
    nonvacuity, sharpness, and proof-system objections.
  loop_failure_mode: >
    The previous loop generated abstract theorem-shaped objects, promoted them
    as contributions, then discovered they were too internally defined,
    literature-underanchored, or dependent on predicates whose nonvacuity and
    sharpness had not been established. This creates motion without closure:
    each new abstraction postpones the same referee objections.
  closure_rule: >
    Do not promote more open-ended P vs NP marathon output for this draft unless
    it closes an item in this objection ledger. Every theorem-level claim must
    pass the external-anchor, nonvacuity, sharpness, demotion, and paper-claim
    gates, or else be explicitly demoted to a lemma, example, conjecture, or
    future-work note.
  smallest_honest_claim: >
    The draft can currently be defended only as a structured certificate lower
    bound program for label-induced hardness predicates, not as a broad
    completion barrier, not as evidence for P != NP, and not as a proof-system
    lower bound unless a named proof/certificate system is instantiated and an
    extraction theorem is proved.
