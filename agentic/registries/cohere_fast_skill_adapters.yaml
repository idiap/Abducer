schema_version: '1.0'
policy: explicit-authority-compatible-reuse-only
adapters:
  - id: cohere_fast_literature_locator
    existing_skill: literature-evidence-reviewer
    allowed_stage: scope_and_ground
    authority_compatibility: locator resolution only; cannot validate a scientific claim
    input_type: DomainEvidencePacket
    output_type: DomainEvidencePacket
  - id: cohere_fast_independent_audit
    existing_skill: review-reasoner-epistemologist
    allowed_stage: independent_audit
    authority_compatibility: may demote or reject; cannot certify a theorem without resolved proof evidence
    input_type: DomainEvidencePacket
    output_type: DomainClosureDecision
