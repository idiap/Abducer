[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "to-prism"
version = "0.1.0"
description = "Read-only conversion toolkit for external agent projects"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
to-prism = "to_prism.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/to-prism" = ["VERSION"]
"share/to-prism/profiles" = ["profiles/*.yaml"]
"share/to-prism/schemas" = ["schemas/*.json"]
"share/to-prism/references" = ["references/*.md", "references/*.json"]
"share/to-prism/examples" = ["examples/README.md"]
"share/to-prism/examples/epistemic_incident_diagnosis" = ["examples/epistemic_incident_diagnosis/*.md", "examples/epistemic_incident_diagnosis/*.json"]
"share/to-prism/examples/type_gallery" = ["examples/type_gallery/*.md", "examples/type_gallery/*.prism"]
"share/to-prism/examples/layered_release_review" = ["examples/layered_release_review/*.md", "examples/layered_release_review/*.prism"]
"share/to-prism/examples/conversion_input" = ["examples/conversion_input/*.md", "examples/conversion_input/*.json"]
"share/to-prism/examples/conversion_input/source" = ["examples/conversion_input/source/AGENTS.md"]
"share/to-prism/examples/conversion_input/source/.agents/skills/release-review" = ["examples/conversion_input/source/.agents/skills/release-review/SKILL.md"]
"share/to-prism/integration-hooks" = ["integration-hooks/README.md"]
"share/to-prism/integration-hooks/codex" = ["integration-hooks/codex/*.json"]
"share/to-prism/integration-hooks/claude" = ["integration-hooks/claude/*.json"]
"share/to-prism/integration-hooks/opencode" = ["integration-hooks/opencode/*.ts"]
"share/to-prism/skills/to-prism" = ["skills/to-prism/SKILL.md"]
"share/to-prism/skills/to-prism/agents" = ["skills/to-prism/agents/*.yaml"]
"share/to-prism/skills/to-prism-baseline" = ["skills/to-prism-baseline/SKILL.md"]
"share/to-prism/skills/to-prism-baseline/agents" = ["skills/to-prism-baseline/agents/*.yaml"]
"share/to-prism/skills/to-prism-derive-types" = ["skills/to-prism-derive-types/SKILL.md"]
"share/to-prism/skills/to-prism-derive-types/agents" = ["skills/to-prism-derive-types/agents/*.yaml"]
"share/to-prism/skills/to-prism-design-parallel-tests" = ["skills/to-prism-design-parallel-tests/SKILL.md"]
"share/to-prism/skills/to-prism-design-parallel-tests/agents" = ["skills/to-prism-design-parallel-tests/agents/*.yaml"]
"share/to-prism/skills/to-prism-document-workflows" = ["skills/to-prism-document-workflows/SKILL.md"]
"share/to-prism/skills/to-prism-document-workflows/agents" = ["skills/to-prism-document-workflows/agents/*.yaml"]
"share/to-prism/skills/to-prism-model-workflows" = ["skills/to-prism-model-workflows/SKILL.md"]
"share/to-prism/skills/to-prism-model-workflows/agents" = ["skills/to-prism-model-workflows/agents/*.yaml"]
"share/to-prism/skills/to-prism-map-reasoning" = ["skills/to-prism-map-reasoning/SKILL.md"]
"share/to-prism/skills/to-prism-map-reasoning/agents" = ["skills/to-prism-map-reasoning/agents/*.yaml"]
"share/to-prism/skills/to-prism-review-preservation" = ["skills/to-prism-review-preservation/SKILL.md"]
"share/to-prism/skills/to-prism-review-preservation/agents" = ["skills/to-prism-review-preservation/agents/*.yaml"]
"share/to-prism/skills/to-prism-run-parallel-tests" = ["skills/to-prism-run-parallel-tests/SKILL.md"]
"share/to-prism/skills/to-prism-run-parallel-tests/agents" = ["skills/to-prism-run-parallel-tests/agents/*.yaml"]
"share/to-prism/skills/to-prism-update" = ["skills/to-prism-update/SKILL.md"]
"share/to-prism/skills/to-prism-update/agents" = ["skills/to-prism-update/agents/*.yaml"]
"share/to-prism/templates/tests" = ["templates/tests/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]
