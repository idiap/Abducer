        v1 adapter. Source guards, role and failure remain in native_contract.
  step_reflect_discovery:
    inputs:
      HypothesisPortfolio:
        type: HypothesisPortfolio
    outputs:
      ConceptualReflection:
        type: ConceptualReflection
    execution:
      mode: specification_only
      reason: Native skill exists at skills/orchestration/reflective-conceptual-discovery/SKILL.md; no
        typed v1 adapter. Source guards, role and failure remain in native_contract.
  step_synthesize:
    inputs:
      ConceptualReflection:
        type: ConceptualReflection
    outputs:
      TheoryCandidates:
        type: TheoryCandidates
    execution:
      mode: specification_only
      reason: Native skill exists at skills/reasoning/reflective-theory-synthesizer/SKILL.md; no typed
        v1 adapter. Source guards, role and failure remain in native_contract.
  step_blind_adjudicate:
    inputs:
      TheoryCandidates:
        type: TheoryCandidates
    outputs:
      BlindAdjudication:
        type: BlindAdjudication
    execution:
      mode: specification_only
      reason: Native skill exists at skills/evaluation/blind-conceptual-preference-adjudicator/SKILL.md;
        no typed v1 adapter. Source guards, role and failure remain in native_contract.
  step_compile_atlas_defects:
    inputs:
      TheoryCandidates:
        type: TheoryCandidates
    outputs:
      TheoryAtlasDefects:
        type: TheoryAtlasDefects
    execution:
