interface:
  display_name: "Next-Experiment Queue Ranker"
  short_description: "Order queued experiments and decide branch continuation without premature stopping"
  default_prompt: "First restate the intent gate, exact inputs and artifacts in scope, required output shape, and any missing context explicitly; do not assume hidden repository context. When the task involves substantive inference, explicitly separate prompt/context defects from genuine mathematical difficulty: classify context_status as well-posed / partially-ill-posed / ill-posed, inference_status as determined / underdetermined / difficult-but-well-posed, give the smallest repair, and report qualified certainty both now and assuming a well-posed context, and when applicable emit a short Prompt/Inference Diagnosis block before the main result. Use $next-experiment-queue-ranker to inspect the current next-experiment queue, rank items by target payoff, discriminating power, execution readiness, target integration, and anti-drift controls, then return payoff criteria, branch-continuation decisions, premature-stop guards, stop criteria, required skills, demotion triggers, and the validation handoff for the next run."
