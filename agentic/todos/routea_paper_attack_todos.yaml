schema: abducer.routea_paper_attack_todos.v2
source_paper: agentic/reports/results_ellaboration/a-finite-schur-feshbach-test-for-reflected-wilson-blocks-an-explicit-four-dimens/finite_wilson_os_routeA_SU2_narrative_enriched.tex
claim_boundary: >
  The current paper proves an exact finite-cutoff SU(2) heat-kernel
  source-collision Schur-Feshbach Wilson-block result. The next work must
  address the open modules as mathematical objects and integrate only validated
  results into the paper narrative.
global_controls:
  dependency_policy: >
    Downstream endpoint, continuum, or spectral claims cannot be promoted until
    the upstream geometric-collar dependency has either been proved or demoted
    with a precise obstruction.
  paper_integration_policy: >
    Every promoted or demoted module must pass through routea-paper-result-integrator.
    The manuscript may receive definitions, lemmas, propositions, theorems,
    certificates, remarks, or bounded open-module text, but never process
    management prose.
  forbidden_paper_language:
    - pipeline
    - workflow
    - TODO
    - todo
    - result-elaboration
    - implementation packet
    - agent
    - skill
    - queue
implementation_status:
  status: completed
  completed_at: "2026-07-10"
  completion_artifacts:
    tex: agentic/reports/results_ellaboration/a-finite-schur-feshbach-test-for-reflected-wilson-blocks-an-explicit-four-dimens/finite_wilson_os_routeA_SU2_attack_integrated.tex
    pdf: agentic/reports/results_ellaboration/a-finite-schur-feshbach-test-for-reflected-wilson-blocks-an-explicit-four-dimens/attack_integrated_compile/finite_wilson_os_routeA_SU2_attack_integrated.pdf
    json: agentic/reports/results_ellaboration/a-finite-schur-feshbach-test-for-reflected-wilson-blocks-an-explicit-four-dimens/routea_paper_attack_completion.json
    md: agentic/reports/results_ellaboration/a-finite-schur-feshbach-test-for-reflected-wilson-blocks-an-explicit-four-dimens/routea_paper_attack_completion.md
  summary: >
    All ten Route A paper-attack TODOs have been implemented as paper-native
    results, gates, or explicit demotions. The finite source-collision theorem is
    preserved as the current claim. The present three-hairpin collar upgrade is
    demoted by a geometric obstruction, while normalization, coefficient,
    endpoint, continuum, and spectral consequences are expressed with precise
    mathematical gate conditions.
strategy:
  thesis: >
    The decisive next contribution is either a genuine geometric-collar Route A
    theorem or a rigorous demotion showing precisely why the finite
    source-collision model cannot yet be upgraded.
  priority_order:
    - G1 geometric collar construction
    - G2 same-theory normalization
    - G3 geometric coefficient extraction
    - G4 strict margin certification
    - E1/E2 endpoint derivation and two-sided error
    - M1/M2 continuum and spectral handoff guardrails
todos:
  - id: routea-attack-000
    title: Lock paper claim boundary and integration rules before attacking modules
    module: paper-control
    priority: 105
    skill: routea-paper-result-integrator
    dependencies: []
    mathematical_object: finite source-collision Route A claim boundary and paper-native result forms
    deterministic_regime:
      - Locate all openmodule environments and the current theorem/corollary spine.
      - Record which sections may change after each module succeeds or fails.
      - Create a forbidden-language scan over the paper body for process terms.
    generative_regime:
      - Decide the smallest honest paper result form for each possible module outcome.
      - Preserve the difference between source-collision, geometric collar, endpoint, continuum, and spectral claims.
    result_artifact: paper integration contract for the Route A attack sequence
    result_integration:
      allowed_forms:
        - definition
        - lemma
        - proposition
        - theorem
        - certificate paragraph
        - remark
        - bounded open-module demotion
      target_sections:
        - Scope, novelty, and claim boundary
        - Open modules toward a geometric collar and a mass-gap programme
        - Conclusion
      update_rule: >
        Update abstract, introduction, status table, or conclusion only when a
        validated result changes the paper's smallest honest claim.
      forbidden_language_audit: required before every TeX/PDF export
    promotion_criterion: >
      All later module TODOs have an explicit paper-native integration target and
      a forbidden-language audit.
    demotion_criterion: >
      Any later manuscript patch describes the research process rather than the
      mathematical result.
    validation:
      - Structural scan confirms every module has result_integration fields.
      - TeX scan confirms no forbidden paper language appears in exported paper text.

  - id: routea-attack-001
    title: Construct or refute the explicit geometric collar path family
    module: G1
    priority: 100
    skill: routea-geometric-collar-builder
    dependencies:
      - routea-attack-000
    mathematical_object: cutoff-indexed paths gamma_{+,k}(delta), gamma_{-,k}(delta), gamma_{0,k}(delta)
    deterministic_regime:
      - Extract the paper's lattice coordinates, time-reflection convention, and existing hairpin paths.
      - Represent candidate paths as vertex and directed-edge lists.
      - Mechanically check edge time coordinates for positive-algebra support.
      - Compute reflected images of edges and compare with the paired channel.
      - Compute the reflection-plane footprint and compare across collar signs.
    generative_regime:
      - Design a collar geometry that separates channels transversely while preserving a locked boundary footprint.
      - Choose a joint scaling rule for \(a_k\) and \(\delta\) that avoids hidden order-of-limits assumptions.
      - If the geometry fails, identify the minimal obstruction and a revised geometry class.
    result_artifact: edge-list construction with support, reflection, footprint, and scaling proof, or obstruction certificate
    result_integration:
      success_form: lemma plus definitions
      success_target: Cutoff trajectory and geometric collision
      success_claim: >
        A concrete geometric-collar family exists inside the positive-time Wilson algebra.
      demotion_form: remark or retained open module with obstruction
      demotion_target: G1 open module
      demotion_claim: >
        The present hairpin geometry cannot yet be upgraded without changing the
        footprint, support, or scaling assumptions.
      forbidden_language_audit: required
    promotion_criterion: >
      Edge lists, support proof, footprint proof, reflection proof, and scaling rule
      all exist and can replace G1 with a lemma.
    demotion_criterion: >
      The construction cannot keep positive-time support, locked footprint, and
      reflection pairing simultaneously.
    validation:
      - TeX patch compiles if a lemma is inserted.
      - Claim-boundary audit confirms no source-collision result is relabeled as geometric.

  - id: routea-attack-002
    title: Certify geometric-collar normalization as same-theory
    module: G2
    priority: 95
    skill: routea-same-theory-normalization-certifier
    dependencies:
      - routea-attack-001
    mathematical_object: normalized geometric reflected Gram block q_{k,delta}
    deterministic_regime:
      - Inventory perimeter, cusp, endpoint, boundary, overlap, diagonal, and source factors.
      - Classify factors as one-body, block congruence, pair-dependent, or positive-kernel candidate.
      - Write exact diagonal or block congruence matrices where applicable.
      - Check each normalized entry is still a reflected expectation of same-theory observables.
    generative_regime:
      - Seek a positive-kernel or reflected-Gram realization for any pair-dependent factor.
      - Decide whether the collar block can be normalized without changing theory.
      - If not, identify which geometric or renormalization choice must change.
    result_artifact: same-theory normalization certificate or inadmissible-factor obstruction
    result_integration:
      success_form: proposition
      success_target: after the G1 geometric construction
      success_claim: >
        The geometric-collar normalization preserves reflected-Gram positivity in
        the same regulated theory.
      demotion_form: proposition-level counterexample or warning remark
      demotion_target: G2 open module and normalization appendix
      demotion_claim: >
        A required pair-dependent quotient is not certified as positivity preserving.
      forbidden_language_audit: required
    promotion_criterion: >
      Every normalization step is realized by observable rescaling, congruence,
      or a proved positive-kernel reflected Gram factor.
    demotion_criterion: >
      An essential pair-dependent quotient remains without a positivity certificate.
    validation:
      - Matrix positivity logic is checked against the normalization appendix.
      - No entrywise division is described as harmless unless certified.

  - id: routea-attack-003
    title: Derive H_k, K_k, and the geometric-collar remainder from q_{k,delta}
    module: G3
    priority: 92
    skill: routea-geometric-coefficient-extractor
    dependencies:
      - routea-attack-001
      - routea-attack-002
    mathematical_object: operator-norm expansion q_{k,delta}=11^T+delta H_k+delta^2K_k+R_{k,delta}
    deterministic_regime:
      - Define each entry \(q_{k,\delta}(i,j)\) as a same-regulator Wilson expectation.
      - Check algebraic conversion from entry or log expansion into \(H_k,K_k\).
      - Verify the reduced forms \(A_k=PH_kP\) and \(C_k=P(K_k-n^{-1}H_kee^*H_k)P\).
      - Run symbolic checks for any finite matrices introduced.
    generative_regime:
      - Derive first and second geometric variations from the actual collar geometry.
      - Separate one-body variations, genuine pair variations, and the Schur correction.
      - Prove or demote the cutoff-uniform operator-norm remainder.
    result_artifact: geometric coefficient theorem, conditional theorem, or coefficient-extraction obstruction
    result_integration:
      success_form: theorem with proof and optional appendix algebra
      success_target: replace G3 and update Route A status table
      success_claim: >
        The geometric-collar block has a controlled rank-one Schur-Feshbach expansion.
      demotion_form: retained open module with exact missing estimate
      demotion_target: G3 open module
      demotion_claim: >
        Only the source-amplitude coefficient theorem is presently established.
      forbidden_language_audit: required
    promotion_criterion: >
      \(H_k,K_k\), and \(\sup_k\|R_{k,\delta}\|/\delta^2\to0\), are proved from the
      same normalized collar block.
    demotion_criterion: >
      The calculation reuses source-amplitude \(H,K\) or leaves the remainder formal.
    validation:
      - Exact symbolic checks for introduced finite matrices.
      - TeX compile and Schur correction audit.

  - id: routea-attack-004
    title: Establish or demote strict reduced-margin lower bounds
    module: G4
    priority: 88
    skill: routea-margin-endpoint-certifier
    dependencies:
      - routea-attack-003
    mathematical_object: cutoff-dependent margins sigma_k and tau_k
    deterministic_regime:
      - Define \(\sigma_k,\tau_k\) after G2 normalization and G3 coefficient extraction.
      - Check whether available estimates prove lower bounds or only nonnegativity.
      - Verify any certified numerical interval has stated lattice, regulator, and error model.
    generative_regime:
      - Choose a lower-bound route: character expansion, transfer matrix, symmetry exclusion, or certified finite computation.
      - Analyze whether renormalized Wilson correlations can vanish along the cutoff trajectory.
      - Decide the strongest honest finite or cutoff-family claim.
    result_artifact: strict-margin theorem, certified interval protocol, or lower-bound demotion
    result_integration:
      success_form: theorem or certified finite-evaluation proposition
      success_target: after geometric coefficient theorem and status table
      success_claim: >
        The reduced geometric-collar margins remain strictly positive in the stated regime.
      demotion_form: remark preserving conditional finite strictness
      demotion_target: G4 open module and conclusion
      demotion_claim: >
        Reflection positivity gives nonnegativity, but not the needed lower bound.
      forbidden_language_audit: required
    promotion_criterion: >
      A nonvanishing lower bound or certified positive interval survives the declared cutoff trajectory.
    demotion_criterion: >
      Only \(\sigma_k,\tau_k\ge0\) or finite-parameter evidence is available.
    validation:
      - Lower-bound proof does not use mass-gap or clustering assumptions.
      - Paper abstract is updated only after a genuine lower-bound theorem.

  - id: routea-attack-005
    title: Derive the endpoint estimator from the same regulator
    module: E1
    priority: 80
    skill: routea-margin-endpoint-certifier
    dependencies:
      - routea-attack-001
      - routea-attack-002
      - routea-attack-003
    mathematical_object: endpoint boxes, source variables, color factor, and incidence tensor
    deterministic_regime:
      - Define endpoint boxes from the actual collar paths.
      - Check zero-diagonal assumptions needed for the null-channel incidence identity.
      - Verify all color and trace normalization conventions are stated.
    generative_regime:
      - Derive local source variables and singlet projections from the heat-kernel regulator.
      - Derive \(C_{\mathrm{col}}\) and incidence weights from the path geometry.
      - Separate derived endpoint terms from tail terms requiring E2.
    result_artifact: same-regulator endpoint estimator or incidence-ansatz demotion
    result_integration:
      success_form: proposition with derivation
      success_target: Correct endpoint/null-channel bookkeeping
      success_claim: >
        The endpoint estimator follows from the geometric Wilson family and the \(SU(2)\) regulator.
      demotion_form: warning remark
      demotion_target: E1 open module
      demotion_claim: >
        The displayed incidence expression remains schematic until derived from the regulator.
      forbidden_language_audit: required
    promotion_criterion: >
      Endpoint formula is derived from the same geometric Wilson family and regulator.
    demotion_criterion: >
      Incidence weights are inferred from a template rather than derived.
    validation:
      - Formula respects zero-diagonal/null-channel conditions.
      - No endpoint sign claim is made without derivation.

  - id: routea-attack-006
    title: Prove two-sided cumulant and tail error bounds
    module: E2
    priority: 78
    skill: routea-margin-endpoint-certifier
    dependencies:
      - routea-attack-005
    mathematical_object: two-sided endpoint error Delta_end
    deterministic_regime:
      - State the source domain for every endpoint logarithm.
      - Check the finite-difference stencil hypotheses and constants.
      - Verify the final certificate uses both sides of the error interval.
    generative_regime:
      - Bound sixth derivatives needed for the fourth-derivative stencil.
      - Bound endpoint, corner, inter-box, and tail terms on both sides.
      - Classify the result as positive, negative, or inconclusive.
    result_artifact: two-sided endpoint error theorem or one-sided-bound demotion
    result_integration:
      success_form: theorem or proposition
      success_target: after endpoint estimator
      success_claim: >
        Endpoint corrections can be certified with a regulator-specific two-sided error.
      demotion_form: retained open module with certificate limitation
      demotion_target: E2 open module and endpoint certificate lemma
      demotion_claim: >
        One-sided bounds can support positivity in favorable cases but cannot certify a negative obstruction.
      forbidden_language_audit: required
    promotion_criterion: >
      The paper obtains \(|R_{\mathrm{end}}-\widehat R_{\mathrm{end}}|\le\Delta_{\mathrm{end}}\) in the same regulator.
    demotion_criterion: >
      Only one-sided bounds or heuristic tail estimates are available.
    validation:
      - Negative obstruction requires an upper side of the error interval.
      - Positive certificate uses \(M_G+\widehat R_{\mathrm{end}}-\Delta_{\mathrm{end}}>0\).

  - id: routea-attack-007
    title: Gate any continuum reconstruction consequence
    module: M1
    priority: 60
    skill: routea-continuum-gap-gatekeeper
    dependencies:
      - routea-attack-004
    mathematical_object: continuum Schwinger functions and OS reconstruction handoff
    deterministic_regime:
      - List OS axioms supplied and not supplied by finite block positivity.
      - Check all finite-to-continuum wording in abstract, conclusion, and open modules.
      - Verify citations or theorem handoffs if any reconstruction result is invoked.
    generative_regime:
      - Decide whether the geometric result supplies any new continuum input.
      - Identify the exact same-theory transfer theorem needed.
      - State whether M1 remains future work or becomes a bounded theorem handoff.
    result_artifact: OS reconstruction transfer audit or theorem handoff
    result_integration:
      success_form: theorem handoff or carefully cited proposition
      success_target: From OS positivity to a spectral gap
      success_claim: >
        A named same-theory result supplies continuum Schwinger functions satisfying the needed OS conditions.
      demotion_form: bounded open-module text
      demotion_target: M1 open module and claim-boundary paragraph
      demotion_claim: >
        Finite reflected Gram positivity remains a necessary finite condition, not OS reconstruction.
      forbidden_language_audit: required
    promotion_criterion: >
      A same-theory continuum construction or precise theorem handoff is supplied.
    demotion_criterion: >
      The available result is only finite reflection positivity.
    validation:
      - No finite block statement is phrased as OS reconstruction.

  - id: routea-attack-008
    title: Gate any spectral-gap consequence
    module: M2
    priority: 55
    skill: routea-continuum-gap-gatekeeper
    dependencies:
      - routea-attack-007
    mathematical_object: Hamiltonian spectral estimate in reconstructed theory
    deterministic_regime:
      - Check that \(H_{\mathrm{YM}}\), \(\Omega\), excitation sector, and \(\Delta\) are defined only after M1.
      - Scan for circular use of exponential decay, clustering, or mass gap.
      - Verify spectral notation and same-theory assumptions.
    generative_regime:
      - State the decay, transfer-matrix, or Hamiltonian lower-bound estimate that would imply a gap.
      - Decide whether any finite or endpoint result can legitimately contribute to that estimate.
      - Keep the spectral claim as future work unless a non-circular same-theory estimate exists.
    result_artifact: spectral-gap transfer audit or non-circular spectral estimate
    result_integration:
      success_form: theorem handoff only after M1
      success_target: From OS positivity to a spectral gap
      success_claim: >
        A same-theory estimate excludes spectrum in \((0,\Delta)\) for the reconstructed Hamiltonian.
      demotion_form: bounded open-module text
      demotion_target: M2 open module and conclusion
      demotion_claim: >
        Endpoint or finite-block results do not by themselves prove a Hamiltonian mass gap.
      forbidden_language_audit: required
    promotion_criterion: >
      A non-circular same-theory estimate implies \(\operatorname{Spec}(H_{\mathrm{YM}})\cap(0,\Delta)=\varnothing\).
    demotion_criterion: >
      Endpoint or finite-block results are being treated as mass-gap evidence.
    validation:
      - The gap claim is absent unless reconstruction and spectral estimate are both present.

  - id: routea-attack-009
    title: Integrate validated module results into the paper and export clean TeX/PDF
    module: paper-integration
    priority: 50
    skill: routea-paper-result-integrator
    dependencies:
      - routea-attack-001
    mathematical_object: paper-native result narrative for validated Route A artifacts
    deterministic_regime:
      - Apply only validated theorem/proposition/lemma/demotion patches.
      - Compile TeX with repeated pdflatex passes.
      - Scan exported TeX for forbidden paper language.
      - Check unresolved references, citations, and claim-boundary warnings.
    generative_regime:
      - Rewrite successful artifacts as results rather than task descriptions.
      - Update abstract/introduction/table/conclusion only when the honest claim changes.
      - Preserve non-claims and unresolved proof obligations in mathematical language.
    result_artifact: clean enriched Route A TeX and PDF
    result_integration:
      success_form: final paper export
      success_target: whole paper
      success_claim: >
        The paper narrative reflects exactly the validated module state.
      demotion_form: compile/audit failure report
      demotion_target: affected manuscript section
      demotion_claim: >
        The patch is not paper-ready until mathematical and language audits pass.
      forbidden_language_audit: required
    promotion_criterion: >
      The paper compiles, contains no forbidden process language, and all changed claims
      are supported by validated module artifacts.
    demotion_criterion: >
      Any paper section contains process jargon, unsupported upgraded claims, or unresolved TeX errors.
    validation:
      - pdflatex succeeds.
      - forbidden-language scan returns no hits in paper body.
      - result-to-claim map is complete.
