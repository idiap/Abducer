    kind: call
    operation: native_workflow
    description: Opaque native workflow boundary; internal ordering, guards and handoffs are retained
      in abducer.native_contract.
    arguments:
      request:
        ref: inputs.request
    on_failure: blocked
policy:
  effects:
    filesystem:
      read:
      - native_sources
      - inputs
      write: []
    network: []
    external_write: []
  authority:
    allowed:
    - describe_native_interface
    forbidden:
    - execute_scientific_workflow
    - approve
    - prove
    - publish
    - promote
  limits:
    wall_time_seconds: 1800
    max_operation_calls: 1
  failure:
    default: blocked
    retry:
      max_attempts: 1
      retryable_codes: []
  resume:
    mode: none
    require_matching_definition_and_inputs: true
  claim_ceiling: Interface description only; no proof, scientific validity, runtime qualification, promotion
    or approval.
observability:
  receipts: required
  artifact_digests: sha256
  provenance: required
