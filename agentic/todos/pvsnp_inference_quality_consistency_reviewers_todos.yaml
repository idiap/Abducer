      - skills/evaluation/pvsnp-meta-complexity-carrier-reviewer/SKILL.md
      - skills/evaluation/pvsnp-meta-complexity-carrier-reviewer/agents/openai.yaml
    acceptance_criteria:
      - Reviewer names carrier object, table length, row/instance selection rule, verifier overhead, density regime, and advice-free status.
      - Reviewer distinguishes direct language lower bound, average-case witness, compression obstruction, and nonuniform row selection.
