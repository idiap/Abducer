      - "Exploration payoff can be high when a branch is worth testing."
      - "Publishable subgoal score becomes high only when claim, evidence, novelty, validation, and packaging gates are nearing completion."
      - "Report disagreements explicitly, e.g. high exploration value but low publishable readiness."
