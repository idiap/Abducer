    blocked_by:
      - pvsnp-iq-003
      - pvsnp-iq-004
    evidence:
      - Current P vs NP exploration uses meta-complexity carriers and needs carrier-specific correctness criteria.
    review_date: "2026-07-11"
    failure_modes:
