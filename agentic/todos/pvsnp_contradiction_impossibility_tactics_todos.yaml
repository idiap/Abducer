tactical_policy:
  purpose: >
    Make negative proof tactics first-class in the P vs NP discovery loop
    without letting them become generic pessimism. The workflow must decide
    when a branch should pursue a proof by contradiction, when it should
    formulate an impossibility theorem about a route family, and when it should
    stay in constructive bridge-building mode.
  distinction:
    proof_by_contradiction: >
      Use when the negation of a target or subclaim has mathematical structure
      and may force a conflict with a named theorem, invariant, transfer
      inequality, or complexity-class assumption. In P vs NP this is usually
      not "assume P=NP and derive absurdity" globally; it is more often
      "assume the branch transfer succeeds with beta>0", "assume a natural
      property is useful against P/poly", or "assume a proof-system lower bound
      transfers to language hardness" and derive the exact contradiction.
    impossibility_theorem: >
      Use when the object of study is a method family rather than the main
      conjecture. The aim is a theorem-shaped statement such as "no
      black-box-substitution interface with positive target-query exponent can
      yield all-exponent NP not subset P/poly", or "no projection-padding
      carrier of this form can magnify without importing sparse-valid-length
      lower bounds equivalent to the target." This can be a publishable
      stepping-stone even when the main conjecture remains untouched.
    falsifier_or_counterexample: >
      Use when a proposed bridge has a concrete finite or symbolic failure
      mode: advice leakage, easy restricted-model witness, low-degree
      invariant accepting sparse tables, Gaussian-elimination shortcut, or
      bounded exponent window. This should feed either repair or no-go
      theorem formation, not just branch demotion.
    constructive_bridge: >
      Keep constructive bridge-building when the route still has a plausible
      subpolynomial-query, nonblackbox, non-natural, advice-free, or
      target-preserving escape condition that has not yet been computed.
  tactical_triggers:
    go_for_reductio_when:
      - The branch has a precise subclaim whose negation preserves the same P vs NP target, source class, target class, and quantifier order.
      - Assuming the subclaim false generates a structured object: small SAT circuits, low-support sketches, short proofs, easy MCSP witnesses, oracle-respecting simulations, or advice-dependent selectors.
      - There is a named conflict target such as a transfer inequality, barrier theorem, counting bound, diagonalization premise, or validated branch invariant.
      - The contradiction would decide a live branch: promote, repair, quarantine, or convert to no-go theorem.
    go_for_impossibility_when:
      - Multiple cycles keep repairing the same route without changing the obstruction family.
      - The route's assumptions can be abstracted into a method class with parameters such as beta, q, padding exponent, largeness, constructivity, advice, oracle access, or algebraic extension access.
      - A negative theorem would be more valuable than another positive attempt because it would delimit a family of hardness-magnification, MCSP, proof-complexity, natural-property, or padding/projection strategies.
      - The candidate can state escape conditions precisely, so it does not overrule genuinely nonblackbox or subpolynomial-interface variants.
    stay_constructive_when:
      - A route still has an untested target-preserving escape condition: beta=0, q below threshold, nonblackbox SAT-circuit use, advice-free row-hard certificate, non-large/nonconstructive property, or explicit restricted-model-to-unrestricted compiler.
      - The current failure only shows a calculational gap, not a route-family obstruction.
      - The branch has not yet run the symbolic transfer audit or qualitative exponent map needed to decide whether the failure is structural.
    backtrack_or_quarantine_when:
      - The contradiction target is not accepted, or the proof switches source/target model, quantifier order, oracle status, or advice regime.
      - The proposed no-go is just a known barrier label without a route-specific hypothesis and conclusion.
      - The branch cannot name what escapes the theorem, making the impossibility claim too broad.
      - Two sharpened attempts fail to produce a source object, target class, transfer inequality, barrier status, and falsifiable next theorem.
  epistemic_discipline:
    - Negative results are scientific content only when theorem-shaped, scoped, and useful for branch control.
    - A contradiction route must never hide the hard global negation of P vs NP behind a local branch contradiction.
    - A route impossibility theorem must preserve the target boundary and list escape conditions.
    - Every negative tactic must report whether it contributes to a paper-level stepping stone: conceptual novelty, explanatory power, implications, applicability, and unblocking value.
  decision_order:
    - >
      First localize the mathematical pressure: is the live difficulty a
      transfer loss, quantifier mismatch, advice leak, barrier-family signature,
      restricted-model gap, or missing source lower bound?
    - >
      Then ask whether the pressure has a computable parameter or finite
      witness. If yes, run symbolic or qualitative audit before any broad
      impossibility claim.
    - >
      If a precise subclaim has a structured negation and a named conflict
      target, choose proof by contradiction.
    - >
      If repeated audits identify a stable method class with parameters and
      escape conditions, choose impossibility/no-go theorem formation.
    - >
      If a genuine escape condition remains untested, keep constructive
      exploration alive and protect the branch from premature quarantine.
    - >
      If none of source object, target class, transfer inequality, conflict
      target, or escape condition can be named after sharpening, backtrack or
      quarantine.
  route_family_matrix:
    - route_family: black_box_substitution_or_hardness_magnification
      central_question: >
        Does the interface use target SAT circuits only through black-box
        queries of length n^beta and overhead N^q?
      prefer_contradiction_when: >
        A branch asserts all-exponent transfer despite beta>0; assume the
        transfer succeeds and derive the upper bound N^{q+beta c+o(1)} from
        SAT in SIZE(n^c), contradicting the claimed all-exponent conclusion.
      prefer_impossibility_when: >
        Several carriers share the same positive-beta interface. State a no-go
        theorem for every black-box interface with beta>0 and specified q,
        while preserving escape conditions beta=0, subpolynomial queries, or
        nonblackbox use.
      stay_constructive_when: >
        A candidate has beta=0, subpolynomial target queries, or a concrete
        nonblackbox circuit-use mechanism not yet audited.
    - route_family: padding_projection_or_sparse_valid_length
      central_question: >
        Is the source lower bound merely a padded or projected restatement of
        SAT hardness at a different length?
      prefer_contradiction_when: >
        A branch claims weak source lower bounds imply NP not subset P/poly;
        assume SAT has SIZE(n^c) circuits and compute whether the padded source
        circuit still lies below N^{1+epsilon}.
      prefer_impossibility_when: >
        The route repeatedly collapses to a bounded exponent window or to
        sparse-valid-length lower bounds equivalent to the target.
      stay_constructive_when: >
        A nonprojection carrier with target-preserving compression and no
        uncharged advice remains available.
    - route_family: natural_property_or_combinatorial_lower_bound
      central_question: >
        Is the proposed hard-function property large, constructive, and useful
        against a class containing plausible pseudorandom functions?
      prefer_contradiction_when: >
        The branch simultaneously asserts constructivity, largeness,
        usefulness, and cryptographic hardness; derive the natural-proofs
        tension for the exact circuit class.
      prefer_impossibility_when: >
        A route family systematically depends on large constructive useful
        properties without a non-natural escape condition.
      stay_constructive_when: >
        The property is plausibly non-large, nonconstructive, semantic,
        proof-system-specific, or otherwise outside the natural-proofs template.
    - route_family: mcsp_mktp_or_meta_complexity_carrier
      central_question: >
        Does the carrier produce direct language hardness, or only aggregate,
        ranked, or advice-selected hard rows?
      prefer_contradiction_when: >
        A branch claims row hardness but the certificate selects rows
        nonuniformly; assume the transfer and derive the advice or ranked
        decoder leakage.
      prefer_impossibility_when: >
        Repeated carrier variants require advice-free row selection that the
        route cannot provide, or all accepted witnesses include easy sparse
        tables.
      stay_constructive_when: >
        A candidate gives an explicit advice-free row-hard certificate,
        non-natural density control, or verifier-overhead bound not yet tested.
    - route_family: proof_complexity_transfer
      central_question: >
        Does proof-system hardness transfer to language hardness, or only to a
        fixed-family proof lower bound?
      prefer_contradiction_when: >
        A branch asserts language hardness while the proof family admits a
        shortcut such as Gaussian elimination, recognition, or semantic
        bypass; assume transfer and expose the shortcut conflict.
      prefer_impossibility_when: >
        A route family cannot connect proof length lower bounds to SAT circuit
        lower bounds without adding an unproved semantic bridge.
      stay_constructive_when: >
        The proof system, semantic target, and shortcut model are explicitly
        typed and a transfer theorem remains open rather than refuted.
todos:
  - id: pvsnp-neg-tactics-001
    type: workflow_todo
    phase: pvsnp-negative-tactic-selection
    owner: skills/orchestration/pvsnp-negative-tactic-selector
    priority: critical
    risk_class: tactic_selection_gap
    title: Create a P vs NP negative-tactic selector skill.
    intent: >
      Add a generative orchestration skill that reads the current P vs NP branch,
      pressure packet, symbolic transfer audit, qualitative relation map, and
      latest marathon story, then decides whether the next move should be
      constructive bridge-building, proof by contradiction, impossibility/no-go
      theorem formation, counterexample/falsifier search, backtrack, or
      quarantine.
    use_skills:
      - pvsnp-negative-tactic-selector
      - pvsnp-conceptual-pressure-localizer
      - pvsnp-impossibility-theorem-forger
      - kb-contradiction-strategist
      - contradiction-route-auditor
    required_artifact:
      - skills/orchestration/pvsnp-negative-tactic-selector/SKILL.md
      - skills/orchestration/pvsnp-negative-tactic-selector/agents/openai.yaml
    acceptance_criteria:
      - The selector distinguishes contradiction, impossibility theorem, falsifier, and constructive bridge tactics in P vs NP terms.
      - It requires source object, target class, method family, transfer parameters, barrier status, and escape conditions before recommending a no-go theorem.
      - It refuses global "assume P=NP" rhetoric unless the exact negation has a concrete local carrier and conflict target.
      - It emits a branch-control decision with persist/adapt/backtrack/pivot/quarantine/stop and a next validation handoff.
    blocked_by: []
    evidence:
      - skills/orchestration/pvsnp-negative-tactic-selector/SKILL.md
      - skills/orchestration/pvsnp-negative-tactic-selector/agents/openai.yaml
    review_date: "2026-07-11"
    failure_modes:
      - The selector only repeats known barriers without choosing a tactic.
      - The selector recommends impossibility too early, before symbolic or qualitative audits.
      - The selector keeps branches constructive after the obstruction family is stable and theorem-shaped.
    status: resolved
  - id: pvsnp-neg-tactics-002
    type: workflow_todo
    phase: pvsnp-negative-tactic-selection
    owner: skills/orchestration/pvsnp-negative-tactic-selector/SKILL.md
    priority: critical
    risk_class: conceptually_shallow_negative_reasoning
    title: Encode the tactical decision calculus for contradiction versus impossibility.
    intent: >
      Make the selector reason from mathematical structure rather than from
      generic failure labels. It should know that reductio is appropriate when
      a negated branch subclaim produces a contradiction carrier, while
      impossibility is appropriate when repeated failures define a method class
      with stable parameters and escape conditions.
    use_skills:
      - pvsnp-negative-tactic-selector
      - pvsnp-qualitative-complexity-reasoner
      - pvsnp-symbolic-complexity-auditor
      - pvsnp-impossibility-theorem-forger
    required_artifact:
      - skills/orchestration/pvsnp-negative-tactic-selector/SKILL.md
    acceptance_criteria:
      - The skill states triggers for reductio, no-go theorem, falsifier search, constructive persistence, and quarantine.
      - The triggers mention P vs NP-specific objects: beta, q, padding exponent, naturalness, constructivity, largeness, advice, oracle/algebraic access, source lower bound, and target class.
      - It requires the selector to ask whether the negative route can become a scoped scientific contribution.
      - It requires escape-condition preservation so nonblackbox, subpolynomial-query, non-natural, or advice-free variants are not overruled.
    blocked_by:
      - pvsnp-neg-tactics-001
    evidence:
      - skills/orchestration/pvsnp-negative-tactic-selector/SKILL.md
    review_date: "2026-07-11"
    failure_modes:
      - Contradiction is treated as a stylistic proof choice rather than a carrier-based tactic.
      - No-go theorem formation becomes a premature stopping excuse.
      - Escape conditions are omitted, making impossibility claims too broad.
    status: resolved
  - id: pvsnp-neg-tactics-003
