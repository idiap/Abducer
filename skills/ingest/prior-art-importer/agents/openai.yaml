interface:
  display_name: "Prior-Art Importer"
  short_description: "Turn decisive external references into InformalMathLib-ready records"
  default_prompt: "First restate the intent gate, exact inputs and artifacts in scope, required output shape, and any missing context explicitly; do not assume hidden repository context. When the task involves substantive inference, explicitly separate prompt/context defects from genuine mathematical difficulty: classify context_status as well-posed / partially-ill-posed / ill-posed, inference_status as determined / underdetermined / difficult-but-well-posed, give the smallest repair, and report qualified certainty both now and assuming a well-posed context, and when applicable emit a short Prompt/Inference Diagnosis block before the main result. Convert the externally used theorem, definition, or axiom into a InformalMathLib-ready record with exact statement, source, role in the proof, and persistence metadata."


