        type: CentralConceptualRoutes
    execution:
      mode: specification_only
      reason: Native skill exists at skills/orchestration/central-formal-conceptual-routes/SKILL.md; no
        typed v1 adapter. Source guards, role and failure remain in native_contract.
  step_check_bridge_equivalence:
    inputs:
      CentralConceptualRoutes:
        type: CentralConceptualRoutes
    outputs:
      BridgeEquivalenceDecision:
        type: BridgeEquivalenceDecision
    execution:
      mode: specification_only
      reason: Native skill exists at skills/evaluation/bridge-object-equivalence-checker/SKILL.md; no
        typed v1 adapter. Source guards, role and failure remain in native_contract.
  step_produce_formal_claim:
    inputs:
      CentralConceptualRoutes:
        type: CentralConceptualRoutes
      BlindAdjudication:
        type: BlindAdjudication
    outputs:
      FormalClaimProducerOutputV2:
        type: FormalClaimProducerOutputV2
    execution:
      mode: specification_only
      reason: Native skill exists at skills/reasoning/formal-claim-producer/SKILL.md; no typed v1 adapter.
        Source guards, role and failure remain in native_contract.
flow:
  kind: sequence
  steps:
  - id: native
    kind: call
    operation: native_workflow
    description: Opaque native workflow boundary; internal ordering, guards and handoffs are retained
      in abducer.native_contract.
    arguments:
      request:
        ref: inputs.request
    on_failure: blocked
policy:
  effects:
    filesystem:
      read:
      - native_sources
      - inputs
      write: []
    network: []
    external_write: []
  authority:
    allowed:
    - describe_native_interface
    forbidden:
    - execute_scientific_workflow
    - approve
    - prove
    - publish
    - promote
  limits:
    wall_time_seconds: 1800
    max_operation_calls: 1
  failure:
    default: blocked
    retry:
      max_attempts: 1
      retryable_codes: []
  resume:
    mode: none
    require_matching_definition_and_inputs: true
  claim_ceiling: Interface description only; no proof, scientific validity, runtime qualification, promotion
    or approval.
observability:
  receipts: required
  artifact_digests: sha256
  provenance: required
  events:
  - workflow_started
  - step_failed
  - workflow_completed
