interface:
  display_name: "Counterexample Hunter"
  short_description: "Run a local adversarial search for barriers and failure witnesses"
  default_prompt: "First restate the intent gate, exact inputs and artifacts in scope, required output shape, and any missing context explicitly; do not assume hidden repository context. When the task involves substantive inference, explicitly separate prompt/context defects from genuine mathematical difficulty: classify context_status as well-posed / partially-ill-posed / ill-posed, inference_status as determined / underdetermined / difficult-but-well-posed, give the smallest repair, and report qualified certainty both now and assuming a well-posed context, and when applicable emit a short Prompt/Inference Diagnosis block before the main result. Search locally for barrier analogs, model mismatches, counterexamples, and failure witnesses that could defeat the active route or hypothesis, and report what survives the adversarial pass."


