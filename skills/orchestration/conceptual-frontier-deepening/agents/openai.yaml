interface:
  display_name: "Conceptual Frontier Deepening"
  short_description: "Run theory-first high-risk conceptual discovery"
  default_prompt: "First restate the intent gate, exact inputs and artifacts in scope, required output shape, and any missing context explicitly; do not assume hidden repository context. When the task involves substantive inference, explicitly separate prompt/context defects from genuine mathematical difficulty: classify context_status as well-posed / partially-ill-posed / ill-posed, inference_status as determined / underdetermined / difficult-but-well-posed, give the smallest repair, and report qualified certainty both now and assuming a well-posed context, and when applicable emit a short Prompt/Inference Diagnosis block before the main result. Use $conceptual-frontier-deepening to condition aggressive parallel invention on exact current literature, deepen plural hypotheses through reflective and optional Category/HoTT reasoning, evaluate complete content route-neutrally, and return exact physics actions while keeping proof and symbolic/simulation experiments subordinate."
