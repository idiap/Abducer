  - id: CRSA-007
    type: test_todo
    phase: atlas-validation
    owner: agentic/scripts/validate_result_subgoal_atlas.py
    priority: high
    risk_class: no_deterministic_guardrails
    title: Add validators for atlas, problem map, derivation vault, and report integration.
    intent: >
      Make cumulative result organization enforceable rather than aspirational.
      Validators should fail when durable results are missing subgoal links,
      stale target data, validation state, or open obligations.
    use_skills:
      - progression-payoff-judge
      - main-problem-alignment-auditor
      - paper-contribution-readiness-judge
      - pvsnp-symbolic-complexity-auditor
    required_artifact:
      - agentic/scripts/validate_result_subgoal_atlas.py
      - agentic/scripts/validate_problem_space_map.py
      - agentic/scripts/validate_derivation_vault.py
      - tests/fixtures/result_subgoal_atlas/valid_pvsnp_atlas.json
      - tests/fixtures/result_subgoal_atlas/invalid_cross_target_atlas.json
    acceptance_criteria:
      - Validators require every result to link to a target, subgoal, evidence source, validation state, and open/closed obligation list.
      - Validators reject cross-target vocabulary leakage.
      - Validators reject handoff-ready or achieved status without evidence and validation state.
      - Validators are added to `agentic/scripts/agentic_check.py`.
    blocked_by:
      - CRSA-001
      - CRSA-002
      - CRSA-003
      - CRSA-004
    evidence:
      - agentic/scripts/validate_discovery_marathon_report.py
      - agentic/scripts/validate_scientific_contribution_monitor.py
      - agentic/scripts/agentic_check.py
    review_date: "2026-07-11"
    failure_modes:
      - Atlas can silently mark claims as achieved without derivation or validation.
      - Validator checks shape but not target-specific conceptual content.
      - Cross-target result leakage is not caught.
    status: resolved

  - id: CRSA-008
    type: workflow_todo
    phase: subgoal-state-transition
    owner: agentic/scripts/update_subgoal_state_from_cycle.py
    priority: medium
    risk_class: achievement_state_not_updated
    title: Add deterministic state transitions from cycle outputs to subgoal achievement states.
    intent: >
      Convert validated cycle outputs and contribution-monitor decisions into
      explicit subgoal-state transitions: open to partial, partial to achieved,
      achieved to handoff-ready, blocked to backtrack, or active to quarantined.
    use_skills:
      - abducer-obligation-gatekeeper
      - entailment-gap-auditor
      - contribution-oriented-subgoal-manager
      - progression-payoff-judge
    required_artifact:
      - agentic/scripts/update_subgoal_state_from_cycle.py
      - agentic/state/subgoals/
    acceptance_criteria:
      - State transition records cite the cycle id, result id, validator output, and rationale.
      - Promotions require evidence and demotions require failure learning.
      - State update refuses to overwrite achieved results without recording a supersession relation.
      - State update can be run after a marathon cycle and before report generation.
    blocked_by:
      - CRSA-002
      - CRSA-003
      - CRSA-007
    evidence:
      - agentic/reports/scientific_contribution_monitor/latest.json
      - agentic/scripts/validate_discovery_marathon_cycle.py
    review_date: "2026-07-11"
    failure_modes:
      - Subgoal status is inferred informally from prose rather than persisted.
      - Later cycles overwrite or obscure earlier achievements.
      - Demotions lose the learning that justified the pivot.
    status: resolved

