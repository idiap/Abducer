    source_skill: skills/discovery/kb-discovery-cycle/SKILL.md
    source_text: "---\nname: kb-discovery-cycle\ndescription: Run the discovery cycle that turns completed\
      \ reasoning artifacts into a persistent proof queue of concrete prove-or-disprove targets. Use when\
      \ the user wants to queue the next informal proof tasks, prioritize discovery outputs into a file-backed\
      \ queue, or prepare theorem-pair-specific claims for later proof work.\n---\n\n# KB Discovery Cycle\n\
      \n## Conceptual Role\n\nThis skill converts the output of discovery-stage artifacts into a persistent\
      \ queue of concrete proof targets.\nEach queued item should read as a self-contained conjecture,\
      \ with the route lemma recorded as the specific step to test.\n\n## When To Use It\n\nUse it after\
      \ a KB run already produced route-level artifacts such as:\n\n1. `expert-hypothesis-paper.json`\n\
      2. `search-space-tree.json`\n\nUse it when the user asks to:\n\n1. create or refresh a queue of\
      \ proof targets;\n2. turn promising directions into explicit prove-or-disprove tasks;\n3. avoid\
      \ rediscovering the same next-step proof agenda repeatedly.\n\n## Workflow\n\n1. Read the final\
      \ bridge-first artifacts.\n2. Keep only theorem-pair-specific targets with a clear claim under test.\n\
      3. State each queued item as a self-contained conjecture rather than an internal route fragment.\n\
      4. If the bridge object is still only a placeholder, escalate back to non-immediate bridge search\
      \ before promoting the route.\n5. If the route is shallow, definition-built, fragmented, or representation-limited,\
      \ run\n   `mathematical-concept-gap-revisitor`, `abstraction-fit-gap-auditor`, and\n   `efficient-representation-requirements-elicitor`\
      \ before a proof-queue item is promoted.\n6. Preserve the missing route lemma, declared conceptual\
      \ tension, abstraction-fit verdict,\n   efficient-representation requirements, and supporting obligations\
      \ as proof context beneath the conjecture.\n7. Materialize the queue in `artifacts/<kb-ref>/proof-queue.json`\
      \ and `proof-queue.md`.\n8. Preserve prior queue state so completed or blocked items are not recreated\
      \ as fresh work.\n9. When the queue is locally exhausted, emit `discovery-breakthrough-profile.*`,\
      \ `discovery-family-prompts.*`,\n   `discovery-pattern-routing.*`, and `discovery-branch-queue.*`\
      \ so the next discovery pass is routed by breakthrough family and epistemic pattern.\n10. Materialize\
      \ one dossier per routed discovery branch in `artifacts/<kb-ref>/discovery-branches/` so the search\
      \ frontier becomes a persistent set of separate discovery briefs rather than only a static routing\
      \ report.\n11. Execute active routed branches as separate search runs when the user wants discovery\
      \ to continue beyond routing; persist the resulting execution briefs in `artifacts/<kb-ref>/discovery-branch-executions/`.\n\
      \nRead [references/queue-policy.md](references/queue-policy.md) for prioritization rules.\nRead\
      \ [references/prompt-template.md](references/prompt-template.md) when a prompt-led discovery pass\
      \ is needed before writing queue items.\nUse [../kb-concept-bridge-planner/references/non-immediate-bridge-search.md](../kb-concept-bridge-planner/references/non-immediate-bridge-search.md)\
      \ when the discovery pass cannot yet name a typed bridge object.\nUse [../kb-discovery-governor/SKILL.md](../kb-discovery-governor/SKILL.md)\
      \ when the question is no longer \"what is the next route?\" but \"which routes still deserve depth\
      \ at all?\".\nUse [../kb-discovery-breakthrough-profiler/SKILL.md](../kb-discovery-breakthrough-profiler/SKILL.md)\
      \ when the frontier is blocked and discovery must first classify the kind of conceptual breakthrough\
      \ or abstraction required.\nUse [../../evaluation/mathematical-concept-gap-revisitor/SKILL.md](../../evaluation/mathematical-concept-gap-revisitor/SKILL.md),\
      \ [../../evaluation/abstraction-fit-gap-auditor/SKILL.md](../../evaluation/abstraction-fit-gap-auditor/SKILL.md),\
      \ and [../../reasoning/efficient-representation-requirements-elicitor/SKILL.md](../../reasoning/efficient-representation-requirements-elicitor/SKILL.md)\
      \ when a candidate needs conceptual-abstraction revision before queue promotion.\n\n## Guardrails\n\
      \n- Do not enqueue items that are only topical labels.\n- Do not enqueue routes marked `re-encode-before-retrying`\
      \ unless the user explicitly asks for them.\n- Prefer claims that can end in either a positive or\
      \ negative mathematical result.\n- Keep queue items grounded in statement IDs, bridge IDs, invariants,\
      \ and missing lemmas.\n- Treat under-typed bridge objects as unresolved discovery work, not as mature\
      \ proof tasks.\n- Do not enqueue representation-limited routes unless the declarative tension,\n\
      \  abstraction-fit verdict, and efficient-representation requirements are\n  included as visible\
      \ queue context.\n\n## Deterministic Path\n\nUse `scripts/enqueue_proof_candidates.py`.\nUse `scripts/execute_discovery_branches.py`\
      \ to consume the currently active discovery branches.\n\nExample:\n\n```text\npython skills/discovery/kb-discovery-cycle/scripts/enqueue_proof_candidates.py\
      \ --artifacts-dir artifacts/p-vs-np\npython skills/discovery/kb-discovery-cycle/scripts/execute_discovery_branches.py\
      \ --artifacts-dir artifacts/p-vs-np --limit 4\n```\n\n<!-- ABducer skill-depth contract v1 -->\n\
      \n## Guardrails\n\n- Novelty is not value; generated hypotheses must carry status labels and disconfirming\
      \ observations before receiving active attention.\n- Cite KB IDs, dependency node IDs, target packet\
      \ IDs, artifact paths, validator output, or explicit unknowns for every substantive claim.\n- Keep\
      \ workflow validity, artifact existence, and mathematical progress as separate statuses.\n\n## Mathematical\
      \ Invariants\n\n- Mathematical object: candidate bridge, conjecture, entrypoint, proof sketch, route\
      \ family, or conceptual transformation.\n- Preserved invariants: target commitments, source-grounded\
      \ definitions, bridge compatibility, and explicit proof obligations.\n- Name broken invariants,\
      \ edge cases, counterexample classes, or boundary regimes whenever a route changes representation\
      \ or scope.\n\n## Epistemic Discipline\n\n- Label claims as conjectural, evidence-backed, proof-obligation,\
      \ blocked, refuted, promoted, quarantined, or watch/archive.\n- Record uncertainty, source limits,\
      \ disconfirming observations, and demotion triggers before recommending continuation.\n- Treat explicit\
      \ unknowns as first-class outputs rather than smoothing them into prose.\n\n## Codex Exec Protocol\n\
      \nFollow `docs/reference/codex-exec-skill-protocol.md` when execution can ground the answer. Run\
      \ the relevant local script(s), especially `enqueue_discovery_programmes.py, enqueue_proof_candidates.py,\
      \ execute_discovery_branches.py`; inspect the produced artifacts before interpreting them. After\
      \ execution, state the mathematical consequence, epistemic status, unresolved obligations, and next\
      \ action.\n\n## Output Contract\n\nReturn: candidate route, mathematical object, cited source artifacts\
      \ or unknowns, epistemic status, disconfirming observations, validation requirements, and next action.\
      \ Include executed commands and produced artifacts when a deterministic run occurs; otherwise state\
      \ why execution was not appropriate.\n\n## Failure/Demotion\n\nDemote to watch/archive, revision,\
      \ quarantine, or reject when relevance is low, assumptions shift, source grounding disappears, or\
      \ a counterexample/boundary regime breaks the route.\n\n## Validation Handoff\n\nEnd by naming the\
      \ validator, artifact, TODO, proof obligation, or stop condition that should control the next loop.\
      \ Do not leave shallow deterministic output uninterpreted when generative mathematical or epistemic\
      \ interpretation is needed.\n"
