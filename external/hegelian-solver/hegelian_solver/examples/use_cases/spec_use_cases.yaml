    signature: {sorts: [Number], operations: {add: "N x N -> N", sub: "N x N -> N?", div: "Z x Z -> Z?", limit: "Cauchy(Q) -> Q?"}}
    tasks: [{name: total_arithmetic, kind: construct, goal: "make subtraction, division, limits, and algebraic roots explicit where required"}]
    examples: ["N under addition", "Z under subtraction", "Q under division", "R as completion"]
    reported_failures:
      - {label: NonClosure, failed_obligation: "3 - 5 not in Nat", witness: {value: "3 - 5"}, repair_target: [GroupCompletion], severity: high}
