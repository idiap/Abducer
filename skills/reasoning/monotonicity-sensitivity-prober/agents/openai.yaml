interface:
  display_name: "Monotonicity Sensitivity Prober"
  short_description: "Reason about direction of change under held-fixed assumptions and regimes"
  default_prompt: "First restate the intent gate, exact inputs and artifacts in scope, required output shape, and any missing context explicitly; do not assume hidden repository context. When the task involves substantive inference, explicitly separate prompt/context defects from genuine mathematical difficulty: classify context_status as well-posed / partially-ill-posed / ill-posed, inference_status as determined / underdetermined / difficult-but-well-posed, give the smallest repair, and report qualified certainty both now and assuming a well-posed context, and when applicable emit a short Prompt/Inference Diagnosis block before the main result. Use $monotonicity-sensitivity-prober to analyze a controlled driver-response variation, including sign, rate class, sensitivity mechanism, disconfirming observations, graph edge, and validation handoff."
