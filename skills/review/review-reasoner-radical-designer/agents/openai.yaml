interface:
  display_name: "Reasoner Review: Radical Designer"
  short_description: "Critique the reasoner as a systems designer and propose bold redesigns"
  default_prompt: "First restate the intent gate, exact inputs and artifacts in scope, required output shape, and any missing context explicitly; do not assume hidden repository context. When the task involves substantive inference, explicitly separate prompt/context defects from genuine mathematical difficulty: classify context_status as well-posed / partially-ill-posed / ill-posed, inference_status as determined / underdetermined / difficult-but-well-posed, give the smallest repair, and report qualified certainty both now and assuming a well-posed context, and when applicable emit a short Prompt/Inference Diagnosis block before the main result. Review the actual reasoner code as a radically out-of-the-box systems designer. Inspect how agents communicate, how queues and persistent memory structure the work, how diagrams and surfaces expose state, where the architecture is hiding debt or overfitting to its own abstractions, and what bold but testable redesigns would make the system see new kinds of mathematical structure."



