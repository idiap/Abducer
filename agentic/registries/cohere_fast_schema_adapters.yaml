schema_version: '1.0'
policy: deny-unknown-versions
adapters:
  - source: discover/claim-record/v1
    destination: DomainEvidencePacket@1.0
    provenance: preserve-archive-and-member-digests
    claim_policy: never-raise-ceiling
    unknown_fields: quarantine
  - source: discover/stage-result/v1
    destination: CohereFastStagePacket@1.0
    provenance: preserve-archive-and-member-digests
    claim_policy: integrity-is-not-scientific-support
    unknown_fields: quarantine
