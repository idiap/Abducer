interface:
  display_name: "Prove Cycle"
  short_description: "Consume one queued claim, prove or disprove it, critique it, and update InformalMathLib"
  default_prompt: "First restate the intent gate, exact inputs and artifacts in scope, required output shape, and any missing context explicitly; do not assume hidden repository context. When the task involves substantive inference, explicitly separate prompt/context defects from genuine mathematical difficulty: classify context_status as well-posed / partially-ill-posed / ill-posed, inference_status as determined / underdetermined / difficult-but-well-posed, give the smallest repair, and report qualified certainty both now and assuming a well-posed context, and when applicable emit a short Prompt/Inference Diagnosis block before the main result. Consume the next item from the proof queue, work locally first, record local-search failures and a local counterexample/barrier pass before any browsing, invoke web search only if the explicit gate is triggered, apply the negative-route heuristic before using contradiction or impossibility reasoning, make negated claims, contradiction targets, and impossibility claims explicit when a negative branch is justified, run all critique judges including citation fidelity, proof granularity, tactic goal-control, tactic-trace discipline, tactic subgoal exposure, and contradiction/impossibility discipline, and persist terminal results into InformalMathLib plus the proof-cycle summary. Treat mathematical_layers and any upstream Lean/Lake bounded-search diagnostics as typed scaffolds and obligation hints, not as proof objects; a successful build or symbolic theorem candidate is not a discharged proof."

