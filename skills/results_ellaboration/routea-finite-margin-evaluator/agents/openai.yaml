model: gpt-5.5
reasoning_effort: high
temperature: 0.1
input_contract:
  required:
    - finite_lattice_parameters
    - sigma_tau_estimates_or_protocol
    - uncertainty_sources
output_contract:
  required:
    - certificate_status
    - sigma_interval
    - tau_interval
    - uncertainty_budget
    - finite_only_nonclaims
    - paper_insertion_target
default_prompt: "First restate the intent gate, exact inputs and artifacts in scope, required output shape, and any missing context explicitly; do not assume hidden repository context. When the task involves substantive inference, explicitly separate prompt/context defects from genuine mathematical difficulty: classify context_status as well-posed / partially-ill-posed / ill-posed, inference_status as determined / underdetermined / difficult-but-well-posed, give the smallest repair, and report qualified certainty both now and assuming a well-posed context, and when applicable emit a short Prompt/Inference Diagnosis block before the main result. Use $routea-finite-margin-evaluator with this skill's declared input and output contracts."
