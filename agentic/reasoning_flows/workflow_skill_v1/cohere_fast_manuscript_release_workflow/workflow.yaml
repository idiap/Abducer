  - path: skills/cohere_fast/cohere-fast-orchestrator/SKILL.md
    digest: sha256:d238bdfea6c7e0638395f2737ce3c5950c9c305f8c4bd46145cf5c5526ebc51b
  - path: agentic/orchestration/cohere_fast_runner.py
    digest: sha256:1034aae90b56a538f691115099549ebcbb199df75107ddd69d694b838b08377a
  - path: agentic/spec/cohere_fast_isolation_contract.yaml
    digest: sha256:68314d67d4b75f82925091b16e300fd50ab621e482a5233f6767d9bc2eef21bd
  - path: agentic/registries/skill_registry.yaml
    digest: sha256:15076ed8d1bd4c10895060ab485353fe520421c44e1fc6f506508d2d566eacf0
  - path: pyproject.toml
    digest: sha256:69325c4805f66033ce7f7e0e68f4a0996913728c6041bb3cee656571693b2f1e
  - path: uv.lock
    digest: sha256:a6c77e5d86a93915eeb0f129f80bc8c45d572be387872e3ace7460a3d6ada9ae
  - path: prism_me/shared/references/codex-control-stack.md
    digest: sha256:4e8e7a5cdbc0572cf9b0d4ffc4a41c8f4f9c9a304fae3bcee99d8af3553be30e
  gaps:
  - No workflow-skill/v1 host adapter is supplied. Native skill/hook/CLI interfaces exist, but payload
    materialization, guard evidence, execution effects and receipt translation are not qualified for this
    format.
  - Native control flow remains opaque; coverage is interface_only, not source-equivalence certification.
  - One or more native payloads have no exact JSON Schema; object-only types remain explicitly underspecified.
extensions:
  abducer.owner:
    path: skills/cohere_fast/cohere-fast-orchestrator/SKILL.md
  abducer.native_identity:
    id: cohere_fast/manuscript-release
  abducer.native_contract:
    id: manuscript-release
    order: 5
    input_type: AuditPacket
    return_type: ReleasePacket
    budget:
      max_attempts: 1
    when: audit_status == accepted
    on_failure: stop
  abducer.environment:
    python: pyproject.toml
    lock: uv.lock
    native_controls: .codex/config.toml
    native_controls_optional: true
    control_policy: prism_me/shared/references/codex-control-stack.md
  abducer.execution_boundary:
