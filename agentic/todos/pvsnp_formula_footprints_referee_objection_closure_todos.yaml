      - agentic/reports/pvsnp_formula_footprints_referee_closure/objection_ledger.json
    acceptance_criteria:
      - Lists every substantive criticism as a blocker with severity, affected theorem or section, and explicit close condition.
      - Distinguishes technical errors, missing literature, nonvacuity gaps, sharpness gaps, proof-system scope gaps, and venue-framing gaps.
      - Includes a demotion outcome for each theorem if the blocker cannot be closed without adding a new theorem.
      - Names the current promotion status of the dictionary lemma, formula-footprint theorem, row-forcing theorem, quotient theorem, and SAT application.
    blocked_by: []
    evidence:
