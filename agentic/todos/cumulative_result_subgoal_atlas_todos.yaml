      - kb-explain
      - scientific-contribution-paper-handoff
      - target-literature-evolution-narrator
    required_artifact:
      - agentic/scripts/generate_discovery_marathon_html.py
      - agentic/reports/discovery_marathon/latest.html
      - agentic/reports/discovery_marathon/full_timeline.html
    acceptance_criteria:
      - Report has an expert-readable Result Atlas panel or tab with grouped subgoals and durable result entries.
      - Report has a Problem Space Map panel showing achieved/open/blocked/quarantined status by route family.
      - Panel avoids JSON-pointer clutter and explains why each result matters in target-specific language.
      - Mathematical expressions in result claims, derivations, and obligations render correctly in the HTML.
    blocked_by:
      - CRSA-002
      - CRSA-003
      - CRSA-004
    evidence:
      - agentic/reports/discovery_marathon/latest.html
      - agentic/reports/discovery_marathon/full_timeline.html
    review_date: "2026-07-11"
