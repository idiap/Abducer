interface:
  display_name: "Reasoner Review: Concept Logician"
  short_description: "Critique the reasoner's concept discovery and abstraction control"
  default_prompt: "First restate the intent gate, exact inputs and artifacts in scope, required output shape, and any missing context explicitly; do not assume hidden repository context. When the task involves substantive inference, explicitly separate prompt/context defects from genuine mathematical difficulty: classify context_status as well-posed / partially-ill-posed / ill-posed, inference_status as determined / underdetermined / difficult-but-well-posed, give the smallest repair, and report qualified certainty both now and assuming a well-posed context, and when applicable emit a short Prompt/Inference Diagnosis block before the main result. Review the actual reasoner code as an epistemology and logic expert in concept discovery. Inspect how theorem bodies are typed, how bridge objects and abstractions are formed, when concepts are marked underspecified, how equivalence and representation shifts are handled, and where the current concept language still blocks discovery."



