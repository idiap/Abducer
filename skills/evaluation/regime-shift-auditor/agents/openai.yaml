interface:
  display_name: "Regime Shift Auditor"
  short_description: "Check whether a claimed inference survives model, regime, and threshold shifts"
  default_prompt: "First restate the intent gate, exact inputs and artifacts in scope, required output shape, and any missing context explicitly; do not assume hidden repository context. When the task involves substantive inference, explicitly separate prompt/context defects from genuine mathematical difficulty: classify context_status as well-posed / partially-ill-posed / ill-posed, inference_status as determined / underdetermined / difficult-but-well-posed, give the smallest repair, and report qualified certainty both now and assuming a well-posed context, and when applicable emit a short Prompt/Inference Diagnosis block before the main result. Audit the claimed source-to-target move for quantifier, regime, model, threshold, and representation preservation, and name the exact transport lemma if the move is not yet justified."
