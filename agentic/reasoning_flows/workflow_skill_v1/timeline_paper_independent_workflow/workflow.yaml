extensions:
  abducer.owner:
    path: skills/reporting/timeline-paper-workflow-orchestrator/SKILL.md
  abducer.native_identity:
    id: timeline-paper-independent-workflow
  abducer.native_contract:
    source: agentic/scripts/run_timeline_paper_workflow.py
    source_text: "#!/usr/bin/env python3\n# SPDX-FileCopyrightText: © 2026 Idiap Research Institute <contact@idiap.ch>\n\
      #\n# SPDX-FileContributor: Andre Freitas <andre.freitas@idiap.ch>\n# Neuro-symbolic AI Group\n#\n\
      # SPDX-FileContributor: Danilo Gusicuma <danilo.gusicuma@idiap.ch>\n# Neuro-symbolic AI Group\n\
      #\n# SPDX-License-Identifier: MIT\n\"\"\"Run the independent interpretive timeline-paper workflow.\"\
      \"\"\n\nfrom __future__ import annotations\n\nimport argparse\nimport subprocess\nimport sys\nfrom\
      \ pathlib import Path\n\nfrom agentic_common import ROOT, rel\n\n\nBUILD_VALIDATE_STAGES = [\n \
      \   (\"agentic/scripts/build_timeline_paper_interpretation.py\", \"agentic/scripts/validate_timeline_paper_interpretation.py\"\
      ),\n    (\"agentic/scripts/build_timeline_paper_blueprint.py\", \"agentic/scripts/validate_timeline_paper_blueprint.py\"\
      ),\n    (\"agentic/scripts/build_timeline_formal_derivation.py\", \"agentic/scripts/validate_timeline_formal_derivation.py\"\
      ),\n    (\"agentic/scripts/build_timeline_paper_diagrams.py\", \"agentic/scripts/validate_timeline_paper_diagrams.py\"\
      ),\n    (\"agentic/scripts/build_timeline_paper_sections.py\", \"agentic/scripts/validate_timeline_paper_sections.py\"\
      ),\n    (\"agentic/scripts/build_timeline_latex_sections.py\", \"agentic/scripts/validate_timeline_latex_sections.py\"\
      ),\n    (\"agentic/scripts/build_timeline_paper.py\", \"agentic/scripts/validate_timeline_paper.py\"\
      ),\n    (\"agentic/scripts/archive_timeline_paper_project.py\", \"agentic/scripts/validate_paper_project_archive.py\"\
      ),\n]\n\n\ndef run(cmd: list[str]) -> None:\n    print(\"==>\", \" \".join(cmd))\n    result = subprocess.run(cmd,\
      \ cwd=ROOT)\n    if result.returncode != 0:\n        raise SystemExit(result.returncode)\n\n\ndef\
      \ main() -> int:\n    parser = argparse.ArgumentParser()\n    parser.add_argument(\"--source\",\
      \ default=\"agentic/reports/discovery_marathon/full_timeline.html\", help=\"Timeline HTML source\
      \ report.\")\n    parser.add_argument(\"--target-id\", default=\"\", help=\"Optional target id;\
      \ currently recorded by source artifacts.\")\n    parser.add_argument(\"--output-dir\", default=\"\
      agentic/reports/timeline_paper\", help=\"Paper output directory; current builder writes the standard\
      \ latest artifacts.\")\n    parser.add_argument(\"--strict\", action=\"store_true\", help=\"Run\
      \ the forward-eval check after paper validation.\")\n    args = parser.parse_args()\n    source\
      \ = str(Path(args.source))\n    for build, validate in BUILD_VALIDATE_STAGES:\n        if build.endswith(\"\
      build_timeline_paper_interpretation.py\"):\n            run([sys.executable, build, \"--source\"\
      , source])\n        else:\n            run([sys.executable, build])\n        run([sys.executable,\
      \ validate])\n    if args.strict:\n        run([sys.executable, \"agentic/scripts/validate_timeline_paper_forward_eval.py\"\
      ])\n    print(f\"timeline paper workflow complete from {source}; paper at {rel(ROOT / args.output_dir\
      \ / 'latest.pdf')}\")\n    return 0\n\n\nif __name__ == \"__main__\":\n    raise SystemExit(main())\n"
    owner_relation: native owning skill; source implementation or reasoning lane defines execution
  abducer.environment:
    python: pyproject.toml
    lock: uv.lock
    native_controls: .codex/config.toml
    native_controls_optional: true
    control_policy: prism_me/shared/references/codex-control-stack.md
  abducer.execution_boundary:
    status: specification_only
    notes: Source inspection only. Effects above deny native execution until a separately reviewed adapter
      exists.
