    "intent": "Make every formula, lemma, route subclaim, or proof obligation carry an explicit decision about whether to persist, adapt, backtrack, pivot, quarantine, or stop.",
    "conceptual_model": "A formal subgoal is worth continuing only while it remains attached to the essential target object and failed attempts keep producing mathematically informative structure. The control contract should separate hard proof debt from low-value drift: hard proof debt can justify adaptation, but repeated identical blockers without new information must force backtracking, pivoting, quarantine, or stop.",
    "use_skills": [
      "long-horizon-route-portfolio-manager",
      "abducer-refinement-route-ranker",
      "abducer-obligation-gatekeeper",
      "epistemic-status-ledger"
    ],
    "implementation_steps": [
      "Create a reusable subgoal_control object shape with decision, target_object_link, essential_commitments_preserved, current_blocker, adaptation_history, learning_from_failure, next_action, pivot_trigger, quarantine_trigger, and stop_condition.",
      "Define the allowed decisions as persist_adapt, backtrack, pivot, quarantine, and stop.",
      "State the universal criteria for each decision in documentation and schema-facing validation text.",
      "Ensure the contract is domain-agnostic: target commitments are supplied by the active target packet rather than hard-coded to any one mathematics or physics problem."
    ],
    "validation_commands": [
      "python agentic/scripts/validate_todos.py"
