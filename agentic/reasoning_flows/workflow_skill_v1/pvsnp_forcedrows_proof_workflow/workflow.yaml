      name: pvsnp-forcedrows-proof-workflow

      description: Deliver the P vs NP EF+SAT_U occurrence-row ForcedRows proof packet. Use when the highest-priority
      P vs NP queue item asks to formalize Psys=EF+SAT_U^{occ}, extract Q_pi from a proof transcript,
      define ForcedRows(Q_pi), prove acceptance transcript invariance under private occurrence-label perturbations
      A_Q, and decide whether the beta-zero XOR row-forcing obstruction becomes a scoped no-go theorem
      or a blocked extraction obligation for full EF+SAT_U.

      ---


      # P vs NP ForcedRows Proof Workflow


      ## Role


      Use this domain-specific proof workflow for the current P vs NP decisive subgoal. It consumes the
      proof-delivery queue item, not a broad discovery branch.


      ## Mathematical Invariants


      Preserve the P vs NP mathematical object throughout the proof: EF+\(SAT_U^{occ}\), beta-zero XOR
      carrier, occurrence labels, proof transcript \(\pi\), parser/extractor \(Q_\pi\), `ForcedRows(Q_pi)`,
      private perturbation \(A_Q\), sparse-row patch circuit, and threshold \(N^{1+\epsilon-o(1)}\). The
      invariant is occurrence-locality: no step may silently replace occurrence labels with full SAT semantics
      or use full EF+\(SAT_U\) power without an explicit extraction lemma.


      Every edge case and counterexample must be checked against the same asymptotic and nonuniformity
      regime. Advice leakage, hidden semantic support, parser nonuniformity, row-completion failure, or
      sparse-patch parameter loss blocks promotion.


      ## Epistemic Discipline


      Classify the theorem packet with an epistemic status: `scoped_no_go_ready`, `blocked_at_extraction`,
      `countermodel_found`, or `quarantine`. Cite evidence source artifacts, KB IDs, proof-delivery queue
      entries, prior cycle IDs, and validator outputs; if the full EF+\(SAT_U\) escape boundary lacks
      evidence, record it as an explicit unknown.


      The validation handoff must include the P vs NP inference-quality, reduction-consistency, quantifier-uniformity,
      barrier-specificity, proof-complexity-transfer, and proof-quality reviewers. Demote if disconfirming
      evidence shows the result is definitional, target-equivalent, prior-art-colliding, or advertised
      as progress on \(P \ne NP\) rather than a route-specific no-go/extraction theorem.


      ## Target Theorem Shape


      Work toward this scoped statement:


      For the beta-zero XOR carrier


      \[

      H_N^{SAT}(x)=\bigoplus_{j\le M_N} SAT(G_N(x,j)),

      \]


      an occurrence-local EF+SAT_U certificate that treats generated SAT instances as independent occurrence
      labels cannot certify a source lower bound \(N^{1+\epsilon-o(1)}\) unless the extracted query/row
      object \(Q_\pi\) forces at least \(N^{\epsilon-o(1)}\) complete rows. Otherwise a private occurrence-label
      perturbation \(A_Q\) preserves the accepted transcript while giving a sparse-row patch circuit below
      the claimed threshold.


      ## Required Definitions


      Define:


      - \(Psys=EF+SAT_U^{occ}\)

      - beta-zero XOR carrier \(H_N^{SAT}\)

      - generator \(G_N\), row universe, occurrence labels, and complete row

      - proof transcript \(\pi\)

      - parser/extractor \(Q_\pi\)

      - `ForcedRows(Q_pi)`

      - private perturbation \(A_Q\)

      - sparse-row patch circuit and threshold \(N^{1+\epsilon-o(1)}\)


      ## Lemma Chain


      1. **Parser Lemma.** From an accepted occurrence-local proof transcript \(\pi\), extract \(Q_\pi\),
      touched occurrences, and candidate forced rows.

      2. **Transcript Invariance Lemma.** If a row is not forced by \(Q_\pi\), perturbing its private
      occurrence labels by \(A_Q\) preserves the verifier transcript.

      3. **Sparse Patch Lemma.** If \(|ForcedRows(Q_\pi)|<N^{\epsilon-o(1)}\), build a circuit for \(H_N^{A_Q}\)
      or the spoofed carrier below \(N^{1+\epsilon-o(1)}\).

      4. **Row-Forcing Obstruction Theorem.** Any occurrence-local certificate sound for the claimed source
      lower bound must force at least \(N^{\epsilon-o(1)}\) complete rows.

      5. **Full EF+SAT_U Boundary Lemma.** State exactly why full EF+SAT_U may escape: real formula syntax
      may constrain unmentioned generated instances. This becomes an extraction theorem obligation, not
      a proved no-go.


      ## Mandatory Reviewers


      After the lemma chain, invoke or emulate the criteria of:


      - `pvsnp-inference-quality-controller`

      - `pvsnp-reduction-consistency-reviewer`

      - `pvsnp-quantifier-uniformity-reviewer`

      - `pvsnp-barrier-specificity-reviewer`

      - `pvsnp-proof-complexity-transfer-reviewer`

      - `proof-quality-gatekeeper`


      ## Output Contract


      Return:


      1. `ForcedRows Theorem Statement`

      2. `Definition Ledger`

      3. `Lemma Chain`

      4. `Proof Attempt`

      5. `Full EF+SAT_U Escape Boundary`

      6. `Inference-Quality Packet`

      7. `Paper Insertion Target`

      8. `Disposition`: `scoped_no_go_ready`, `blocked_at_extraction`, `countermodel_found`, or `quarantine`.


      ## Failure/Demotion


      Demote if the proof treats occurrence labels as real SAT semantics without proving extraction, if
      it ignores advice/nonuniformity, if `ForcedRows` is undefined, if the sparse patch bound is not
      compared to \(N^{1+\epsilon-o(1)}\), or if the result is advertised as progress on P != NP rather
      than a route-specific no-go/extraction theorem.

      '
