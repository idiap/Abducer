name: MetricSpace
domain: mathematical_concept
role: Spaces with distance used to define continuity and convergence.
signature:
  sorts: [X]
  operations:
    d: X x X -> Real
axioms_or_constraints:
  - nonnegative_distance
  - symmetry
  - triangle_inequality
tasks:
  - name: continuity_transfer
    kind: abstract
    goal: define continuity in a representation-independent way
examples:
  - "Euclidean metric topology"
  - "Discrete metric topology"
  - "Metric-induced open balls"
invariants:
  - open_set_structure
representation_maps:
  - "metric induces topology by epsilon balls"
preservation:
  - continuous_maps_defined_by_opens
allowed_operators:
  - AbstractInterface
  - Invariantize
