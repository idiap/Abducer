  step_paper_handoff:
    inputs:
      ContributionValueAssessment:
        type: ContributionValueAssessment
      MainProblemAlignmentAudit:
        type: MainProblemAlignmentAudit
    outputs:
      PaperArgumentHandoff:
        type: PaperArgumentHandoff
