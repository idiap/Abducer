    type: ProofGateDecision
    value:
      ref: steps.native.outputs.result
operations:
  native_workflow:
    inputs:
      request:
        type: ProofQueueItem
    outputs:
      result:
        type: ProofGateDecision
    execution:
      mode: specification_only
      reason: No workflow-skill/v1 host adapter is supplied. Native skill/hook/CLI interfaces exist, but
        payload materialization, guard evidence, execution effects and receipt translation are not qualified
        for this format.
  step_orchestrate_delivery:
    inputs:
      ProofQueueItem:
        type: ProofQueueItem
    outputs:
      ProofDeliveryPlan:
        type: ProofDeliveryPlan
    execution:
      mode: specification_only
      reason: Native skill exists at skills/proof_delivery/proof-delivery-workflow-orchestrator/SKILL.md;
        no typed v1 adapter. Source guards, role and failure remain in native_contract.
  step_formalize_obligations:
    inputs:
      ProofDeliveryPlan:
        type: ProofDeliveryPlan
    outputs:
      FormalProofObligations:
        type: FormalProofObligations
    execution:
      mode: specification_only
      reason: Native skill exists at skills/proof_delivery/proof-obligation-formalizer/SKILL.md; no typed
        v1 adapter. Source guards, role and failure remain in native_contract.
  step_build_lemma_chain:
    inputs:
      FormalProofObligations:
        type: FormalProofObligations
    outputs:
      LemmaChain:
        type: LemmaChain
    execution:
      mode: specification_only
      reason: Native skill exists at skills/proof_delivery/lemma-chain-proof-builder/SKILL.md; no typed
        v1 adapter. Source guards, role and failure remain in native_contract.
  step_split_gap_or_countermodel:
    inputs:
      LemmaChain:
        type: LemmaChain
    outputs:
      ProofGapDecision:
        type: ProofGapDecision
    execution:
      mode: specification_only
      reason: Native skill exists at skills/proof_delivery/proof-gap-countermodel-splitter/SKILL.md; no
        typed v1 adapter. Source guards, role and failure remain in native_contract.
  step_control_pvsnp_inference:
    inputs:
      LemmaChain:
        type: LemmaChain
    outputs:
      InferenceQualityDecision:
        type: InferenceQualityDecision
    execution:
      mode: specification_only
      reason: Native skill exists at skills/orchestration/pvsnp-inference-quality-controller/SKILL.md;
        no typed v1 adapter. Source guards, role and failure remain in native_contract.
  step_gate_proof:
    inputs:
      LemmaChain:
        type: LemmaChain
    outputs:
      ProofGateDecision:
        type: ProofGateDecision
    execution:
      mode: specification_only
      reason: Native skill exists at skills/proof_delivery/proof-quality-gatekeeper/SKILL.md; no typed
        v1 adapter. Source guards, role and failure remain in native_contract.
flow:
  kind: sequence
  steps:
  - id: native
    kind: call
    operation: native_workflow
    description: Opaque native workflow boundary; internal ordering, guards and handoffs are retained
      in abducer.native_contract.
    arguments:
      request:
        ref: inputs.request
    on_failure: blocked
policy:
  effects:
    filesystem:
      read:
      - native_sources
      - inputs
      write: []
    network: []
    external_write: []
  authority:
    allowed:
    - describe_native_interface
    forbidden:
    - execute_scientific_workflow
    - approve
    - prove
    - publish
    - promote
  limits:
    wall_time_seconds: 1800
    max_operation_calls: 1
  failure:
    default: blocked
    retry:
      max_attempts: 1
      retryable_codes: []
  resume:
    mode: none
    require_matching_definition_and_inputs: true
  claim_ceiling: Interface description only; no proof, scientific validity, runtime qualification, promotion
    or approval.
observability:
  receipts: required
  artifact_digests: sha256
  provenance: required
  events:
  - workflow_started
  - step_failed
  - workflow_completed
