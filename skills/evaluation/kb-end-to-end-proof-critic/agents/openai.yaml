interface:
  display_name: "End-To-End Proof Critic"
  short_description: "Judge whether the current artifacts support a plausible full proof"
  default_prompt: "First restate the intent gate, exact inputs and artifacts in scope, required output shape, and any missing context explicitly; do not assume hidden repository context. When the task involves substantive inference, explicitly separate prompt/context defects from genuine mathematical difficulty: classify context_status as well-posed / partially-ill-posed / ill-posed, inference_status as determined / underdetermined / difficult-but-well-posed, give the smallest repair, and report qualified certainty both now and assuming a well-posed context, and when applicable emit a short Prompt/Inference Diagnosis block before the main result. Audit the current macro-proof, proof-cycle, and InformalMathLib artifacts, apply the end-to-end critic panel, include proof-debt accounting and revisit penalties, determine whether a plausible solution to the main conjecture has been reached, and explain why another cycle is or is not justified."


