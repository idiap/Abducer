schema: abducer.failure_archaeology_premortem_todos.v1
created_at: "2026-07-21"
implementation_status:
  status: implemented
  completed_at: "2026-07-21"
purpose: >
  Ensure failed major discovery-cycle sets become deep physics and mathematical
  learning events, and ensure future hypotheses are premortemed with declarative
  failure heuristics before ordinary proof-search investment.
source_artifacts:
  failure_archaeology_skill: skills/evaluation/failure-archaeology-explainer/SKILL.md
  failed_hypothesis_skill: skills/evaluation/failed-hypothesis-anticipator/SKILL.md
  builder: agentic/scripts/build_cycle_failure_archaeology.py
  validator: agentic/scripts/validate_cycle_failure_archaeology.py
  schema: agentic/spec/cycle_failure_archaeology.schema.json
  latest_ym_packet: agentic/reports/failure_archaeology/targets/yang-mills-existence-and-mass-gap-target/latest.json
todos:
  - id: FAP-001
    type: planning_todo
    phase: failure-archaeology-contract
    owner: agentic/spec
    priority: critical
    risk_class: shallow_failure_postmortem
    title: Define the cycle failure archaeology packet
    intent: >
      Make every failed major cycle set explain the physics and mathematics of
      the difficulty, the actual failure mechanism, and why the failure was not
      anticipated.
    use_skills:
      - failure-archaeology-explainer
      - failed-hypothesis-anticipator
    required_artifact:
      - agentic/spec/cycle_failure_archaeology.schema.json
      - agentic/scripts/validate_cycle_failure_archaeology.py
    acceptance_criteria:
      - The packet records the cycle set, smallest honest failed hypothesis, hard-problem diagnosis, why_failed, why_not_anticipated, anticipation_heuristics, and route_disposition.
      - The validator rejects packets that lack physics_hardness, mathematical_hardness, representation_hardness, or prompt-level anticipation heuristics.
      - The packet never exposes API key or authorization material.
    blocked_by: []
    evidence:
      - agentic/spec/cycle_failure_archaeology.schema.json
      - agentic/scripts/validate_cycle_failure_archaeology.py
    review_date: "2026-07-21"
    failure_modes:
      - Failure explanation remains a generic narrative without object-level source, target, carrier, or gate.
      - The packet treats all hard failures as bad hypotheses rather than distinguishing hard-but-live proof debt.
      - The packet leaks operational API configuration into reports.
    status: resolved

  - id: FAP-002
    type: workflow_todo
    phase: failure-archaeology-builder
    owner: agentic/scripts
    priority: critical
    risk_class: uninterpreted_failed_cycles
    title: Build deterministic failure archaeology reports for major cycle sets
    intent: >
      Generate target-scoped JSON and Markdown failure archaeology reports from
      real discovery-marathon cycle packets.
    use_skills:
      - failure-archaeology-explainer
      - abducer-failure-signal-cartographer
      - physical-relevance-impact-auditor
    required_artifact:
      - agentic/scripts/cycle_failure_archaeology.py
      - agentic/scripts/build_cycle_failure_archaeology.py
      - agentic/reports/failure_archaeology/targets/yang-mills-existence-and-mass-gap-target/latest.json
      - agentic/reports/failure_archaeology/targets/yang-mills-existence-and-mass-gap-target/latest.md
    acceptance_criteria:
      - The builder groups the last major cycle set or a since-cycle window.
      - The report detects repeated blockers, artifact debt, low publication reward, proxy shifts, finite-to-global gaps, uniformity gaps, and noncommuting limits.
      - The generated YM packet diagnoses the endpoint source table and cutoff-uniform T_tail blocker.
    blocked_by: []
    evidence:
      - agentic/scripts/cycle_failure_archaeology.py
      - agentic/scripts/build_cycle_failure_archaeology.py
      - agentic/reports/discovery_marathon/targets/yang-mills-existence-and-mass-gap-target/latest.json
    review_date: "2026-07-21"
    failure_modes:
      - The builder only counts failures but does not explain why the problem was hard.
      - The builder mistakes operational API failures for research failures.
      - The report points to stale or cross-target artifacts.
    status: resolved

  - id: FAP-003
    type: workflow_todo
    phase: prompt-premortem-integration
    owner: agentic/scripts
    priority: high
    risk_class: anticipatable_failed_hypothesis
    title: Add prompt-level declarative heuristics to future cycles
    intent: >
      Make each future branch name at least one anticipatable failure signature
      and the control action if that signature is confirmed.
    use_skills:
      - failed-hypothesis-anticipator
      - proof-nontriviality-auditor
      - physical-relevance-impact-auditor
    required_artifact:
      - agentic/scripts/run_discovery_marathon.py
      - skills/evaluation/failed-hypothesis-anticipator/SKILL.md
    acceptance_criteria:
      - The branch prompt names failure signatures including artifact_debt, proxy_shift, finite_to_global_gap, uniformity_gap, definitional_transfer, no_falsifier, low_publication_reward, and noncommuting_limits.
      - The branch prompt requires an artifact_sprint, falsifier_sprint, reframe, demote, quarantine, pivot, or stop control action when a signature is confirmed.
      - The prompt requires object-level source, target, carrier, hidden assumption, missing artifact, and earliest decisive test.
    blocked_by: []
    evidence:
      - agentic/scripts/run_discovery_marathon.py
      - skills/evaluation/failed-hypothesis-anticipator/SKILL.md
    review_date: "2026-07-21"
    failure_modes:
      - The premortem becomes another high-level reflection paragraph.
      - The next experiment ignores the anticipated failure signature.
      - The branch continues broad proof search after confirming low reward or missing artifact debt.
    status: resolved

  - id: FAP-004
    type: hook_todo
    phase: workflow-dispatch-integration
    owner: agentic/registries
    priority: high
    risk_class: hidden_uninvoked_failure_skill
    title: Integrate failure archaeology and premortem into skill dispatch
    intent: >
      Make failure archaeology and failed-hypothesis anticipation visible in
      discovery-marathon skill dispatch traces and target-specific skill
      requirements.
    use_skills:
      - failure-archaeology-explainer
      - failed-hypothesis-anticipator
    required_artifact:
      - agentic/registries/discovery_marathon_skill_dispatch.yaml
      - agentic/scripts/discovery_marathon_common.py
      - agentic/scripts/validate_discovery_marathon_skill_dispatch.py
    acceptance_criteria:
      - A failure_archaeology_and_premortem phase exists in the dispatch matrix.
      - Future cycles after the introduction boundary require failure-archaeology-explainer and failed-hypothesis-anticipator.
      - Historical cycles remain valid before the introduction boundary.
    blocked_by: []
    evidence:
      - agentic/registries/discovery_marathon_skill_dispatch.yaml
      - agentic/scripts/discovery_marathon_common.py
      - agentic/scripts/validate_discovery_marathon_skill_dispatch.py
    review_date: "2026-07-21"
    failure_modes:
      - The skills exist but are never invoked in future cycle traces.
      - Historical generated cycles are retroactively invalidated.
      - The phase is hidden from report-facing workflow documentation.
    status: resolved

  - id: FAP-005
    type: report_todo
    phase: report-surface
    owner: agentic/reports
    priority: high
    risk_class: failure_learning_not_visible
    title: Surface failure archaeology in discovery marathon reports
    intent: >
      Let readers see when the latest major cycle set failed, why it failed,
      which anticipation heuristics fired, and where the full packet lives.
    use_skills:
      - failure-archaeology-explainer
      - timeline-contribution-explainer
    required_artifact:
      - agentic/scripts/build_discovery_marathon_report.py
      - agentic/reports/discovery_marathon/targets/yang-mills-existence-and-mass-gap-target/latest.json
      - agentic/reports/discovery_marathon/targets/yang-mills-existence-and-mass-gap-target/latest.md
    acceptance_criteria:
      - The discovery report includes failure_archaeology and failure_archaeology_summary.
      - The Markdown report includes failure detected, cycle set, disposition, detected heuristics, and links to JSON/Markdown packets.
      - The report keeps the full deep diagnostic target-scoped and separate from operational job logs.
    blocked_by: []
    evidence:
      - agentic/scripts/build_discovery_marathon_report.py
      - agentic/reports/failure_archaeology/targets/yang-mills-existence-and-mass-gap-target/latest.json
    review_date: "2026-07-21"
    failure_modes:
      - The report hides failure archaeology in raw JSON only.
      - The report treats operational API failures as mathematical failures.
      - The summary link points to a stale packet.
    status: resolved

  - id: FAP-006
    type: test_todo
    phase: validation
    owner: agentic/scripts
    priority: high
    risk_class: unvalidated_failure_archaeology
    title: Validate the new failure archaeology skills and reports
    intent: >
      Ensure the skills are well-formed, scripts compile, reports validate, and
      TODO cards remain compatible with the repository validator.
    use_skills:
      - skill-creator
      - failure-archaeology-explainer
      - failed-hypothesis-anticipator
    required_artifact:
      - skills/evaluation/failure-archaeology-explainer/SKILL.md
      - skills/evaluation/failed-hypothesis-anticipator/SKILL.md
      - agentic/scripts/validate_cycle_failure_archaeology.py
      - agentic/todos/failure_archaeology_premortem_todos.yaml
    acceptance_criteria:
      - skill-creator quick_validate is attempted; when PyYAML is unavailable in the local interpreter, a fallback frontmatter check verifies both new skills have non-placeholder name and description fields.
      - py_compile passes for the new and changed scripts.
      - validate_cycle_failure_archaeology.py passes on the generated YM packet.
      - validate_todos.py passes across all TODO files.
    blocked_by: []
    evidence:
      - skills/evaluation/failure-archaeology-explainer/SKILL.md
      - skills/evaluation/failed-hypothesis-anticipator/SKILL.md
      - agentic/reports/failure_archaeology/targets/yang-mills-existence-and-mass-gap-target/latest.json
    review_date: "2026-07-21"
    failure_modes:
      - Skill frontmatter remains placeholder text.
      - The generated packet cannot pass structural validation.
      - TODO validation fails because resolved cards are not self-contained.
      - The validation report claims quick_validate passed when the environment lacks PyYAML.
    status: resolved
