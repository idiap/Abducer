extensions:
  abducer.owner:
    path: skills/discovery/kb-entrypoint-pathfinder/SKILL.md
  abducer.native_identity:
    id: evidence_to_proof_route_onramp
  abducer.native_contract:
    id: evidence_to_proof_route_onramp
    version: 1.0.0
    visible_name: Evidence to Proof Route Onramp
    aliases:
    - evidence-to-proof-route-onramp
    - kb-route-onramp
    activation: opt_in
    owner_skill: kb-entrypoint-pathfinder
    target_scope:
    - mathematical
    - p-vs-np
    trigger:
      all_of:
      - source_bundle_present
      any_of:
      - external_mathematical_source
      - missing_or_stale_kb
      - entrypoint_or_proof_route_requested
      none_of:
      - untrusted_source_without_provenance
    input_artifact:
      type: SourceBundle
      schema: agentic/spec/named_workflow_artifacts.schema.json
    steps:
    - id: ingest
      order: 10
      skill: latex-kb-ingest
      mode: required
      when: null
      consumes:
      - SourceBundle
      produces:
      - IngestedKnowledgeBase
      on_failure: stop
    - id: parse_pvsnp
      order: 20
      skill: pvsnp-kb-parser
      mode: conditional
      when: target == 'p-vs-np' and source_format == 'latex'
      consumes:
      - IngestedKnowledgeBase
      produces:
      - ParsedKnowledgeBase
      on_failure: quarantine
    - id: normalize_theorems
      order: 30
      skill: theorem-body-normalizer
      mode: required
      when: null
      consumes:
      - IngestedKnowledgeBase
      - ParsedKnowledgeBase
      produces:
      - NormalizedTheoremCorpus
      on_failure: stop
    - id: ground_conjecture
      order: 40
      skill: kb-main-conjecture-grounder
      mode: required
      when: null
      consumes:
      - NormalizedTheoremCorpus
      produces:
      - GroundedConjecture
      on_failure: stop
    - id: narrate_literature_evolution
      order: 45
      skill: target-literature-evolution-narrator
      mode: conditional
      when: source_bundle_contains_literature_history
      consumes:
      - GroundedConjecture
      - SourceBundle
      produces:
      - TargetLiteratureNarrative
      on_failure: quarantine
    - id: connect_proof
      order: 50
      skill: kb-proof-connector
      mode: required
      when: null
      consumes:
      - GroundedConjecture
      produces:
      - ProofConnectionGraph
      on_failure: quarantine
    - id: evaluate_hypotheses
      order: 60
      skill: kb-hypothesis-evaluator
      mode: conditional
      when: hypotheses_present
      consumes:
      - ProofConnectionGraph
      produces:
      - HypothesisAssessment
      on_failure: quarantine
    - id: audit_hubs
      order: 70
      skill: hub-bias-auditor
      mode: required
      when: null
      consumes:
      - ProofConnectionGraph
      produces:
      - HubBiasAudit
      on_failure: stop
    - id: find_entrypoint
      order: 80
      skill: kb-entrypoint-finder
      mode: required
      when: null
      consumes:
      - ProofConnectionGraph
      - HubBiasAudit
      produces:
      - EntrypointCandidates
      on_failure: stop
    - id: pathfind
      order: 90
      skill: kb-entrypoint-pathfinder
      mode: required
      when: null
      consumes:
      - EntrypointCandidates
      produces:
      - ProofRouteCandidates
      on_failure: stop
    - id: audit_regime_shift
      order: 100
      skill: regime-shift-auditor
      mode: conditional
      when: route_crosses_regime_or_model
      consumes:
      - ProofRouteCandidates
      produces:
      - RegimeShiftAudit
      on_failure: quarantine
    - id: hunt_counterexamples
      order: 110
      skill: counterexample-hunter
      mode: required
      when: null
      consumes:
      - ProofRouteCandidates
      produces:
      - FalsificationPacket
      on_failure: stop
    - id: expert_handoff
      order: 120
      skill: expert-handoff
      mode: required
      when: null
      consumes:
      - ProofRouteCandidates
      - FalsificationPacket
      produces:
      - ExpertRouteDossier
      on_failure: stop
    hooks:
    - hook_id: named-workflow-router
      event: UserPromptSubmit
      phase: activation
      condition: trigger matches
      required_inputs:
      - prompt
      - target
      decision: recommend
      emitted_artifact: WorkflowRecommendation
    - hook_id: workflow-membership-policy
      event: PreSkillUse
      phase: steps
      condition: active workflow and step membership validate
      required_inputs:
      - workflow_id
      - workflow_version
      - target
      - step_id
      - skill
      - conditional_evidence
      decision: block
      emitted_artifact: SkillAuthorization
    - hook_id: typed-output-policy
      event: PostSkillUse
      phase: steps
      condition: declared output and receipt validate
      required_inputs:
      - workflow_id
      - step_id
      - artifact_type
      - epistemic_status
      - receipt
      decision: block
      emitted_artifact: SkillReceipt
    - hook_id: workflow-tool-policy
      event: PreToolUse
      phase: steps
      condition: path safety mutation and budget validate
      required_inputs:
      - workflow_id
      - step_id
      - tool
      - target_path
      - mutation_class
      decision: block
      emitted_artifact: ToolAuthorization
    - hook_id: workflow-exit-policy
      event: Stop
      phase: exit
      condition: exit artifacts and obligations validate
      required_inputs:
      - workflow_id
      - exit_artifacts
      - open_obligations
      decision: block
      emitted_artifact: WorkflowExitReceipt
    exit_gate:
      validator: agentic/scripts/validate_workflow_contracts.py
      consumes: ExpertRouteDossier
      allowed:
      - validated
      - quarantined
      required_artifacts:
      - ExpertRouteDossier
      - FalsificationPacket
      - HubBiasAudit
      open_obligations_policy: allow_declared
    handoffs:
    - when: output_is_theorem_shaped
      workflow: theorem_proof_delivery
      artifact_type: ProofQueueItem
      adapter: expert_dossier_to_proof_queue
    - when: output_requires_conceptual_refinement
      workflow: conceptual_hypothesis_exploration_loop
      artifact_type: ExpertRouteDossier
      adapter: expert_dossier_to_legacy_conceptual_input
    prohibitions:
    - No assertion without provenance and assertion license
    - No route promotion without a falsifier or stop condition
    cost_profile: bounded
  abducer.environment:
    python: pyproject.toml
    lock: uv.lock
    native_controls: .codex/config.toml
    native_controls_optional: true
    control_policy: prism_me/shared/references/codex-control-stack.md
  abducer.execution_boundary:
    status: specification_only
    notes: Source inspection only. Effects above deny native execution until a separately reviewed adapter
      exists.
  abducer.step_interfaces:
    ingest: step_ingest
    parse_pvsnp: step_parse_pvsnp
    normalize_theorems: step_normalize_theorems
    ground_conjecture: step_ground_conjecture
    narrate_literature_evolution: step_narrate_literature_evolution
    connect_proof: step_connect_proof
    evaluate_hypotheses: step_evaluate_hypotheses
    audit_hubs: step_audit_hubs
    find_entrypoint: step_find_entrypoint
    pathfind: step_pathfind
    audit_regime_shift: step_audit_regime_shift
    hunt_counterexamples: step_hunt_counterexamples
    expert_handoff: step_expert_handoff
# REUSE-IgnoreEnd
