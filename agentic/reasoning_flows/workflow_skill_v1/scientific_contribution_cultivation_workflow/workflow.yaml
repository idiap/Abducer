  gaps:
  - No workflow-skill/v1 host adapter is supplied. Native skill/hook/CLI interfaces exist, but payload
    materialization, guard evidence, execution effects and receipt translation are not qualified for this
    format.
  - Native control flow remains opaque; coverage is interface_only, not source-equivalence certification.
  - Named payload schemas validate the common envelope only; nominal artifact payloads and artifact_type
    discriminators are not refined by that schema.
  - Conditional/advisory skips, repeated ReviewFindingSet aggregation, exit obligations and handoff adapters
    are preserved verbatim, not executable v1 dataflow.
extensions:
  abducer.owner:
    path: skills/evaluation/scientific-contribution-detector/SKILL.md
  abducer.native_identity:
    id: scientific_contribution_cultivation
  abducer.native_contract:
    id: scientific_contribution_cultivation
    version: 1.0.0
    visible_name: Scientific Contribution Cultivation
    aliases:
    - scientific-contribution-cultivation
    - contribution-cultivation
    activation: conditional
    owner_skill: scientific-contribution-detector
    target_scope:
    - mathematical
    - scientific
    - manuscript
    trigger:
      all_of:
      - result_atlas_slice_present
      any_of:
      - result_atlas_changed
      - subgoal_handoff_ready
      - contribution_checkpoint
      - paper_readiness_requested
      none_of:
      - unsupported_result
    input_artifact:
      type: ResultAtlasSlice
      schema: agentic/spec/named_workflow_artifacts.schema.json
    steps:
    - id: maintain_atlas
      order: 10
      skill: result-atlas-maintainer
      mode: required
      when: null
      consumes:
      - ResultAtlasSlice
      produces:
      - UpdatedResultAtlas
      on_failure: stop
    - id: manage_subgoal
      order: 20
      skill: contribution-oriented-subgoal-manager
      mode: required
      when: null
      consumes:
      - UpdatedResultAtlas
      produces:
      - ContributionSubgoalPacket
      on_failure: stop
    - id: detect_contribution
      order: 30
      skill: scientific-contribution-detector
      mode: required
      when: null
      consumes:
      - ContributionSubgoalPacket
      produces:
      - ContributionCandidate
      on_failure: stop
    - id: assess_value
      order: 40
      skill: contribution-value-assessor
      mode: required
      when: null
      consumes:
      - ContributionCandidate
      produces:
      - ContributionValueAssessment
      on_failure: stop
    - id: audit_alignment
      order: 50
      skill: main-problem-alignment-auditor
      mode: validator_only
      when: null
      consumes:
      - ContributionValueAssessment
      produces:
      - MainProblemAlignmentAudit
      on_failure: stop
    - id: audit_enablement
      order: 60
      skill: completed-subgoal-enablement-auditor
      mode: required
      when: null
      consumes:
      - ContributionValueAssessment
      produces:
      - EnablementAudit
      on_failure: quarantine
    - id: package_enablement
      order: 70
      skill: subgoal-enablement-handoff-packager
      mode: conditional
      when: enablement_non_empty
      consumes:
      - EnablementAudit
      produces:
      - EnablementHandoff
      on_failure: quarantine
    - id: paper_handoff
      order: 80
      skill: scientific-contribution-paper-handoff
      mode: conditional
      when: contribution_paper_ready
      consumes:
      - ContributionValueAssessment
      - MainProblemAlignmentAudit
      produces:
      - PaperArgumentHandoff
      on_failure: quarantine
    hooks:
    - hook_id: named-workflow-router
      event: UserPromptSubmit
      phase: activation
      condition: contribution trigger matches
      required_inputs:
      - prompt
      - target
      decision: recommend
      emitted_artifact: WorkflowRecommendation
    - hook_id: workflow-membership-policy
      event: PreSkillUse
      phase: steps
      condition: active workflow and step membership validate
      required_inputs:
      - workflow_id
      - workflow_version
      - target
      - step_id
      - skill
      - conditional_evidence
      decision: block
      emitted_artifact: SkillAuthorization
    - hook_id: typed-output-policy
      event: PostSkillUse
      phase: steps
      condition: declared output and receipt validate
      required_inputs:
      - workflow_id
      - step_id
      - artifact_type
      - epistemic_status
      - receipt
      decision: block
      emitted_artifact: SkillReceipt
    - hook_id: workflow-tool-policy
      event: PreToolUse
      phase: steps
      condition: path safety mutation and budget validate
      required_inputs:
      - workflow_id
      - step_id
      - tool
      - target_path
      - mutation_class
      decision: block
      emitted_artifact: ToolAuthorization
    - hook_id: workflow-exit-policy
      event: Stop
      phase: exit
      condition: claim and evidence exit requirements validate
      required_inputs:
      - workflow_id
      - exit_artifacts
      - open_obligations
      decision: block
      emitted_artifact: WorkflowExitReceipt
    exit_gate:
      validator: agentic/scripts/validate_workflow_contracts.py
      consumes: EnablementAudit
      allowed:
      - validated
      - quarantined
      - archived
      required_artifacts:
      - ContributionValueAssessment
      - MainProblemAlignmentAudit
      - EnablementAudit
      open_obligations_policy: allow_declared
    handoffs:
    - when: paper_ready
      workflow: manuscript_result_elaboration
      artifact_type: PaperArgumentHandoff
      adapter: paper_argument_to_draft
    prohibitions:
    - No novelty inflation
    - No support-only result promoted as a main result
    - No paper claim without mechanism evidence
    cost_profile: lightweight
  abducer.environment:
    python: pyproject.toml
    lock: uv.lock
    native_controls: .codex/config.toml
    native_controls_optional: true
    control_policy: prism_me/shared/references/codex-control-stack.md
  abducer.execution_boundary:
    status: specification_only
    notes: Source inspection only. Effects above deny native execution until a separately reviewed adapter
      exists.
  abducer.step_interfaces:
    maintain_atlas: step_maintain_atlas
    manage_subgoal: step_manage_subgoal
    detect_contribution: step_detect_contribution
    assess_value: step_assess_value
    audit_alignment: step_audit_alignment
    audit_enablement: step_audit_enablement
    package_enablement: step_package_enablement
    paper_handoff: step_paper_handoff
# REUSE-IgnoreEnd
