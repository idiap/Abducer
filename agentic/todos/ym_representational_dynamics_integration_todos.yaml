    acceptance_criteria:
      - YM target prompts require frozen Clay target language, claim levels, non-claims, and hard-gate selection.
      - Prompts ask for efficient representation requirements: preserved observables, recovery maps, morphisms, invariants, error budgets, and falsifiers.
      - Prompts require explicit tension statements for regulator choice, large-field/topology control, basin entry, same-theory transfer, OS reconstruction, and spectral gap inference.
      - Prompts classify endpoint or positivity refinements as support-only unless they move a named hard gate.
      - Branch routing can choose exploration or bounded publication-consolidation mode with the four-cycle limit.
    blocked_by:
      - YMINT-006
