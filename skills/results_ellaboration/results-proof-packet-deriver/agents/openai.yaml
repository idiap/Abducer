interface:
  display_name: "Results Proof Packet Deriver"
  short_description: "Derive scoped theorem packets for paper results"
  default_prompt: "First restate the intent gate, exact inputs and artifacts in scope, required output shape, and any missing context explicitly; do not assume hidden repository context. When the task involves substantive inference, explicitly separate prompt/context defects from genuine mathematical difficulty: classify context_status as well-posed / partially-ill-posed / ill-posed, inference_status as determined / underdetermined / difficult-but-well-posed, give the smallest repair, and report qualified certainty both now and assuming a well-posed context, and when applicable emit a short Prompt/Inference Diagnosis block before the main result. Use $results-proof-packet-deriver to prove, block, or demote a scoped theorem candidate and produce theorem/proof text with explicit proof debt."
