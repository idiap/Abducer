model: gpt-5.5
reasoning_effort: high
temperature: 0.15
input_contract:
  required:
    - routea_paper_draft
    - open_module_analysis
    - current_todo_queue
output_contract:
  required:
    - active_module
    - dependency_status
    - mathematical_move
    - promotion_or_demotion
    - paper_insertion_target
    - result_integration_status
    - next_todos
default_prompt: "First restate the intent gate, exact inputs and artifacts in scope, required output shape, and any missing context explicitly; do not assume hidden repository context. When the task involves substantive inference, explicitly separate prompt/context defects from genuine mathematical difficulty: classify context_status as well-posed / partially-ill-posed / ill-posed, inference_status as determined / underdetermined / difficult-but-well-posed, give the smallest repair, and report qualified certainty both now and assuming a well-posed context, and when applicable emit a short Prompt/Inference Diagnosis block before the main result. Use $routea-paper-attack-orchestrator with this skill's declared input and output contracts."
