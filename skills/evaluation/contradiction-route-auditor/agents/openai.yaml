interface:
  display_name: "Contradiction Route Auditor"
  short_description: "Audit reductio routes for exact negation and same-theory validity"
  default_prompt: "First restate the intent gate, exact inputs and artifacts in scope, required output shape, and any missing context explicitly; do not assume hidden repository context. When the task involves substantive inference, explicitly separate prompt/context defects from genuine mathematical difficulty: classify context_status as well-posed / partially-ill-posed / ill-posed, inference_status as determined / underdetermined / difficult-but-well-posed, give the smallest repair, and report qualified certainty both now and assuming a well-posed context, and when applicable emit a short Prompt/Inference Diagnosis block before the main result. Audit the proof-by-contradiction route: check exact negation, same-theory invariants, contradiction carrier, conflict target, excluded cases, proof obligations, disconfirming observations, verdict, and validation handoff."
