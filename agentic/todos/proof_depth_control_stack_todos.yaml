  - id: PDC-011
    type: workflow_todo
    phase: declarative-learning-extraction
    owner: skills/evaluation
    priority: critical
    risk_class: narrative-only-learning
    title: Create proof-inference-learning-extractor
    intent: >
      Convert each proof cycle's mathematical output into declarative
      inference-level learning facts that can be accumulated and reused by
      later cycles.
    use_skills:
      - skill-creator
      - theorem-body-normalizer
      - entailment-gap-auditor
      - proof-nontriviality-auditor
      - proof-transfer-substance-auditor
    required_artifact:
      - skills/evaluation/proof-inference-learning-extractor/SKILL.md
      - skills/evaluation/proof-inference-learning-extractor/agents/openai.yaml
      - agentic/spec/proof_inference_learning_event.schema.json
    acceptance_criteria:
      - The skill emits one or more learning events with source_cycle_id, premises_used, attempted_inference, observed_result, learned_constraint, scope_condition, invalidated_generalization, and future_routing_effect.
      - The skill rejects summaries that only say the branch made progress, sharpened understanding, or needs more work.
      - The skill records negative learning as first-class output: failed transfers, missing objects, false analogies, blocked normalizations, and demoted local calculations.
      - The skill records definitional transfer collapse as a reusable learned rule: if the target property is defined through the bridge, future cycles must supply independent target semantics before promotion.
      - In the Yang-Mills calibration case, the skill records the rule that endpoint calculations are support-only until geometric collar, same-theory normalization, and coefficient gates are discharged.
      - In the P vs NP calibration case, the skill can record a rule that a carrier argument is support-only until uniformity, reduction preservation, or barrier-specificity facts are supplied.
    blocked_by:
      - PDC-001
      - PDC-004
    evidence:
      - docs/plans-and-reviews/proof-depth-control-stack-plan.md
      - agentic/reports/discovery_marathon/targets/yang-mills-existence-and-mass-gap-target/latest.json
      - skills/evaluation/entailment-gap-auditor/SKILL.md
    review_date: "2026-07-20"
    failure_modes:
      - The skill emits high-level learning prose instead of declarative inference facts.
      - The skill records action items as learning evidence; an action is not an inference.
      - The skill loses scope conditions, causing a local lesson to be overgeneralized.
      - The skill records a definitional-collapse diagnosis as vague criticism rather than an inference rule with a repair condition.
    status: resolved

