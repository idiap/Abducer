      - tests/fixtures/discovery_marathon/pvsnp_negative_tactic_valid.json
      - tests/fixtures/discovery_marathon/pvsnp_negative_tactic_invalid.json
    acceptance_criteria:
      - The validator accepts a valid black-box-substitution no-go packet with beta, q, target class, theorem conclusion, and escape conditions.
      - It rejects a packet that only says relativization, natural proofs, or algebrization without route-specific hypotheses and conclusion.
      - It rejects proof-by-contradiction packets with non-exact negation or missing conflict target.
      - It is wired into agentic_check.py or the relevant marathon validation path.
    blocked_by:
