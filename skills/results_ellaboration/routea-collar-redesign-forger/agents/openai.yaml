model: gpt-5.5
reasoning_effort: high
temperature: 0.1
input_contract:
  required:
    - current_obstruction
    - paper_geometry_conventions
    - target_result_form
output_contract:
  required:
    - candidate_families
    - top_candidate
    - edge_list_validation_payload
    - normalization_risks
    - promotion_or_demotion_condition
    - paper_insertion_target
default_prompt: "First restate the intent gate, exact inputs and artifacts in scope, required output shape, and any missing context explicitly; do not assume hidden repository context. When the task involves substantive inference, explicitly separate prompt/context defects from genuine mathematical difficulty: classify context_status as well-posed / partially-ill-posed / ill-posed, inference_status as determined / underdetermined / difficult-but-well-posed, give the smallest repair, and report qualified certainty both now and assuming a well-posed context, and when applicable emit a short Prompt/Inference Diagnosis block before the main result. Use $routea-collar-redesign-forger with this skill's declared input and output contracts."
