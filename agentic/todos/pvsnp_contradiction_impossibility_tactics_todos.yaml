    owner: agentic/registries/discovery_marathon_skill_dispatch.yaml
    priority: high
    risk_class: workflow_integration
    title: Hook negative-tactic selection into the contradiction and branch-selection phases.
    intent: >
      Ensure the selector is invoked when P vs NP branches are selected and
      again before contradiction/falsifier generation. The first invocation
      prevents low-value route continuation; the second invocation chooses the
      right negative tactic and handoff.
    use_skills:
      - pvsnp-negative-tactic-selector
      - long-horizon-route-portfolio-manager
      - next-experiment-queue-ranker
      - pvsnp-impossibility-theorem-forger
    required_artifact:
      - agentic/registries/discovery_marathon_skill_dispatch.yaml
    acceptance_criteria:
      - The branch_selection phase lists pvsnp-negative-tactic-selector as a conditional P vs NP skill.
      - The contradiction_and_falsifier_generation phase lists pvsnp-negative-tactic-selector before pvsnp-impossibility-theorem-forger.
      - The required output for contradiction_and_falsifier_generation mentions tactic selection, exact negation, route-family no-go, escape conditions, and learning from failure.
      - Skill-dispatch validation records whether the selector ran or why it was skipped.
    blocked_by:
