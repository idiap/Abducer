interface:
  display_name: "KB Framework State Formalizer"
  short_description: "Generate a concise LaTeX formalization of the current framework"
  default_prompt: "First restate the intent gate, exact inputs and artifacts in scope, required output shape, and any missing context explicitly; do not assume hidden repository context. When the task involves substantive inference, explicitly separate prompt/context defects from genuine mathematical difficulty: classify context_status as well-posed / partially-ill-posed / ill-posed, inference_status as determined / underdetermined / difficult-but-well-posed, give the smallest repair, and report qualified certainty both now and assuming a well-posed context, and when applicable emit a short Prompt/Inference Diagnosis block before the main result. Formalize the current Abducer reasoning framework as a concise LaTeX system description with typed state, stage operators, orchestration composition, and logging semantics."



