schema_version: workflow-skill/v1
namespace: abducer
id: theorem_proof_delivery_workflow
version: 1.0.0
kind: workflow
description: Draft interface projection of theorem_proof_delivery; native execution and authority remain
  unchanged.
aliases:
- theorem_proof_delivery
- theorem-proof-delivery
- proof-delivery
lifecycle: draft
activation:
