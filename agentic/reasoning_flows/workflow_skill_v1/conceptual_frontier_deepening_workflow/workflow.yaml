      reason: Native skill exists at skills/discovery/theory-atlas-defect-compiler/SKILL.md; no typed
        v1 adapter. Source guards, role and failure remain in native_contract.
  step_derive_central_routes:
    inputs:
      BlindAdjudication:
        type: BlindAdjudication
    outputs:
