    execution:
      mode: specification_only
      reason: Native skill exists at skills/evaluation/kb-hypothesis-evaluator/SKILL.md; no typed v1 adapter.
        Source guards, role and failure remain in native_contract.
  step_audit_hubs:
    inputs:
      ProofConnectionGraph:
        type: ProofConnectionGraph
    outputs:
      HubBiasAudit:
        type: HubBiasAudit
    execution:
      mode: specification_only
      reason: Native skill exists at skills/evaluation/hub-bias-auditor/SKILL.md; no typed v1 adapter.
        Source guards, role and failure remain in native_contract.
  step_find_entrypoint:
    inputs:
      ProofConnectionGraph:
        type: ProofConnectionGraph
      HubBiasAudit:
        type: HubBiasAudit
    outputs:
      EntrypointCandidates:
        type: EntrypointCandidates
    execution:
      mode: specification_only
      reason: Native skill exists at skills/discovery/kb-entrypoint-finder/SKILL.md; no typed v1 adapter.
        Source guards, role and failure remain in native_contract.
  step_pathfind:
    inputs:
      EntrypointCandidates:
        type: EntrypointCandidates
    outputs:
      ProofRouteCandidates:
        type: ProofRouteCandidates
    execution:
      mode: specification_only
      reason: Native skill exists at skills/discovery/kb-entrypoint-pathfinder/SKILL.md; no typed v1 adapter.
        Source guards, role and failure remain in native_contract.
  step_audit_regime_shift:
    inputs:
      ProofRouteCandidates:
        type: ProofRouteCandidates
    outputs:
      RegimeShiftAudit:
        type: RegimeShiftAudit
    execution:
      mode: specification_only
      reason: Native skill exists at skills/evaluation/regime-shift-auditor/SKILL.md; no typed v1 adapter.
        Source guards, role and failure remain in native_contract.
  step_hunt_counterexamples:
    inputs:
      ProofRouteCandidates:
        type: ProofRouteCandidates
    outputs:
      FalsificationPacket:
        type: FalsificationPacket
    execution:
      mode: specification_only
      reason: Native skill exists at skills/evaluation/counterexample-hunter/SKILL.md; no typed v1 adapter.
        Source guards, role and failure remain in native_contract.
  step_expert_handoff:
    inputs:
      ProofRouteCandidates:
        type: ProofRouteCandidates
      FalsificationPacket:
        type: FalsificationPacket
    outputs:
      ExpertRouteDossier:
        type: ExpertRouteDossier
    execution:
      mode: specification_only
      reason: Native skill exists at skills/reporting/expert-handoff/SKILL.md; no typed v1 adapter. Source
        guards, role and failure remain in native_contract.
flow:
  kind: sequence
  steps:
  - id: native
    kind: call
    operation: native_workflow
    description: Opaque native workflow boundary; internal ordering, guards and handoffs are retained
      in abducer.native_contract.
    arguments:
      request:
        ref: inputs.request
    on_failure: blocked
policy:
  effects:
    filesystem:
      read:
      - native_sources
      - inputs
      write: []
    network: []
    external_write: []
  authority:
    allowed:
    - describe_native_interface
    forbidden:
    - execute_scientific_workflow
    - approve
    - prove
    - publish
    - promote
  limits:
    wall_time_seconds: 1800
    max_operation_calls: 1
  failure:
    default: blocked
    retry:
      max_attempts: 1
      retryable_codes: []
  resume:
    mode: none
    require_matching_definition_and_inputs: true
  claim_ceiling: Interface description only; no proof, scientific validity, runtime qualification, promotion
    or approval.
observability:
  receipts: required
  artifact_digests: sha256
  provenance: required
  events:
  - workflow_started
  - step_failed
  - workflow_completed
