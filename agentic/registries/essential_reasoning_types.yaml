{
  "schema_version": "1.0.0",
  "status": "initial_draft",
  "scope": {
    "mapping_kind": "curated_exemplars",
    "complete_skill_coverage": false,
    "canonical_mapping_direction": "skill_mappings",
    "multi_type_realization_default": "opaque_unordered",
    "principle": "Reasoning types describe epistemic warrants; skills are concrete materializations and may instantiate more than one type.",
    "excluded_as_essential_types": [
      "generative_reasoning",
      "workflow_composition",
      "dependency_closure",
      "deterministic_validation",
      "reporting",
      "ingestion"
    ]
  },
  "reasoning_types": [
    {
      "id": "deductive_entailment",
      "family": "core_inference",
      "definition": "Derive a conclusion or obligation licensed by typed premises, definitions, and valid rules.",
      "input_state": "premises_with_scope_and_provenance",
      "output_state": "entailed_given_premises",
      "warrant": "Valid inference rules plus conserved premise scope and provenance.",
      "claim_ceiling": "entailed_given_premises",
      "failure_modes": ["hidden premise", "invalid inference", "quantifier drift", "regime drift"],
      "exemplar_skills": ["kb-deduce", "lemma-chain-proof-builder", "pvsnp-proof-derivation-builder", "formal-claim-producer", "entailment-gap-auditor"]
    },
    {
      "id": "abductive_hypothesis_formation",
      "family": "core_inference",
      "definition": "Generate and rank conjectural explanations, missing premises, or bridge objects for an observation or gap.",
      "input_state": "observations_gaps_and_constraints",
      "output_state": "candidate_explanation",
      "warrant": "Coverage, coherence, parsimony, discriminability, and explicit alternatives.",
      "claim_ceiling": "candidate_explanation",
      "failure_modes": ["affirming the consequent", "hypothesis monoculture", "coherence promoted as truth"],
      "exemplar_skills": ["kb-abduce", "kb-gap-abstraction-conjecturer", "abducer-mediation-candidate-generator", "proof-bridge-object-forger", "kb-hypothesis-evaluator"]
    },
    {
      "id": "inductive_generalization",
      "family": "core_inference",
      "definition": "Infer a scoped regularity or schema from multiple cases, routes, or experimental outcomes.",
      "input_state": "case_set_with_sampling_scope",
      "output_state": "provisional_generalization",
      "warrant": "Recurrence, representativeness, stability under variation, and stated boundary conditions.",
      "claim_ceiling": "provisional_generalization",
      "failure_modes": ["hasty generalization", "selection bias", "unstated exceptions", "finite-to-asymptotic promotion"],
      "exemplar_skills": ["kb-induce", "proof-inference-learning-extractor", "reflective-theory-synthesizer", "scale-asymptotic-reasoner"]
    },
    {
      "id": "structural_analogy_transfer",
      "family": "core_inference",
      "definition": "Transport a candidate property, method, or conjecture through an explicit source-target correspondence.",
      "input_state": "source_target_and_correspondence",
      "output_state": "candidate_transfer",
      "warrant": "Preservation of relevant relations, invariants, side conditions, and domain identity.",
      "claim_ceiling": "candidate_transfer",
      "failure_modes": ["surface analogy", "category mismatch", "regime mismatch", "lost side condition"],
      "exemplar_skills": ["proof-bridge-object-forger", "proof-same-domain-transfer-certifier", "bridge-object-equivalence-checker", "visual-analogy-preservation-auditor", "gedanken-transfer-guard"]
    },
    {
      "id": "contrastive_counterfactual_reasoning",
      "family": "core_inference",
      "definition": "Compare a baseline with a controlled alternative to identify dependence, sensitivity, or discriminating consequences.",
      "input_state": "baseline_intervention_and_fixed_invariants",
      "output_state": "contrast_supported",
      "warrant": "A well-defined contrast with controlled changes and explicit invariants.",
      "claim_ceiling": "contrast_supported",
      "failure_modes": ["impossible antecedent", "uncontrolled simultaneous changes", "causal overclaim"],
      "exemplar_skills": ["counterfactual-route-prober", "gedanken-counterfactual-variant-builder", "monotonicity-sensitivity-prober", "qualitative-variable-isolator"]
    },
    {
      "id": "model_based_reasoning",
      "family": "core_inference",
      "definition": "Use an explicit idealized, finite, symbolic, numerical, or toy model to probe behavior or mechanism.",
      "input_state": "theory_model_and_idealization_map",
      "output_state": "model_supported",
      "warrant": "Reproducibility, robustness, error control, and an explicit idealization-to-target map.",
      "claim_ceiling": "model_supported",
      "failure_modes": ["model-target conflation", "numerical artifact", "unlicensed extrapolation"],
      "exemplar_skills": ["qualitative-toy-model-builder", "dynamic-symbolic-simulation-experimenter", "pvsnp-gedanken-complexity-lab", "physics-regime-map-builder"]
    },
    {
      "id": "critical_refutational_testing",
      "family": "epistemic_control",
      "definition": "Search for counterexamples, contradictions, missing premises, or other defeaters of a candidate claim.",
      "input_state": "claim_assumptions_and_search_scope",
      "output_state": "refuted_or_not_refuted_within_scope",
      "warrant": "A valid defeating witness, or a bounded and fully reported search scope.",
      "claim_ceiling": "not_refuted_within_scope",
      "failure_modes": ["absence of counterexample treated as proof", "weak adversary", "suppressed failed search"],
      "exemplar_skills": ["counterexample-hunter", "kb-hypothesis-refutation-loop", "qualitative-physics-falsifier", "contradiction-route-auditor", "premise-completeness-prober", "entailment-gap-auditor"]
    },
    {
      "id": "evidential_status_calibration",
      "family": "epistemic_control",
      "definition": "Assign, conserve, demote, or promote epistemic status using declared evidence and promotion rules.",
      "input_state": "claims_provenance_tests_and_open_obligations",
      "output_state": "calibrated_epistemic_status",
      "warrant": "Traceable evidence, explicit criteria, claim ceilings, and unresolved-obligation accounting.",
      "claim_ceiling": "creates_no_substantive_claim",
      "failure_modes": ["plausibility treated as validation", "coherence treated as entailment", "workflow success treated as truth"],
      "exemplar_skills": ["epistemic-status-ledger", "kb-coherence-evaluator", "kb-hypothesis-evaluator", "proof-quality-gatekeeper", "paper-contribution-readiness-judge", "ym-audit-frontier"]
    }
  ],
