  - id: PDC-013
    type: workflow_todo
    phase: exploratory-critical-mass
    owner: skills/evaluation
    priority: critical
    risk_class: endless-exploration
    title: Create proof-exploration-critical-mass-assessor
    intent: >
      Decide when exploratory cycles have produced enough declarative learning
      to justify locking into a bounded proof-strategy cycle set for a
      meaningful publication subgoal.
    use_skills:
      - skill-creator
      - proof-learning-ledger-maintainer
      - proof-conceptual-quality-heuristic-rater
      - proof-transfer-substance-auditor
      - paper-contribution-readiness-judge
      - scientific-contribution-detector
      - completed-subgoal-enablement-auditor
    required_artifact:
      - skills/evaluation/proof-exploration-critical-mass-assessor/SKILL.md
      - skills/evaluation/proof-exploration-critical-mass-assessor/agents/openai.yaml
      - agentic/spec/proof_exploration_critical_mass.schema.json
    acceptance_criteria:
      - The skill returns exploration_continue, lock_in_ready, premature_lockin, or forced_demote with explicit reasons.
      - The skill requires a smallest honest publication subgoal, repeated pressure on a named hard gate, at least one candidate object or falsifier, and enough negative learning to rule out shallow variants.
      - The skill requires evidence of conceptual depth plus explanatory or unification power; purely local or routine algebra cannot trigger lock-in without a publication-quality explanation of why it matters.
      - The skill refuses lock_in_ready for a publication subgoal whose principal theorem is a transfer theorem that fails transfer-substance audit.
      - The skill requires a bounded cycle budget, stop condition, non-claims, and target-scoped learning evidence before lock_in_ready.
      - In the Yang-Mills calibration case, the skill can lock in to a finite geometric-collar theorem, obstruction certificate, same-theory normalization result, or source-collision finite paper, without implying a mass-gap proof.
      - In the P vs NP calibration case, the skill can lock in to a bounded no-go theorem, transfer obstruction certificate, or carrier-uniformity lemma, without implying P vs NP is solved.
    blocked_by:
      - PDC-008
      - PDC-012
      - PDC-017
    evidence:
      - docs/plans-and-reviews/proof-depth-control-stack-plan.md
      - docs/research-methods/result-subgoal-atlas.md
      - skills/evaluation/paper-contribution-readiness-judge/SKILL.md
      - skills/evaluation/scientific-contribution-detector/SKILL.md
    review_date: "2026-07-20"
    failure_modes:
      - The skill locks in because the route feels promising but lacks a publishable subgoal statement.
      - The skill locks in on an object with low explanatory and unification value.
      - The skill locks in on a near-definitional principal theorem because it has clean formal packaging.
      - The skill keeps exploration open even after a bounded publishable object is available.
      - The skill treats the main-problem goal as the only valid publication unit.
    status: resolved

