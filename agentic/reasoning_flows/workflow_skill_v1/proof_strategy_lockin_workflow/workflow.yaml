    source_skill: skills/orchestration/proof-strategy-lockin-orchestrator/SKILL.md
    source_text: "---\nname: proof-strategy-lockin-orchestrator\ndescription: Freeze and run bounded proof-strategy\
      \ cycles for a publication-worthy subgoal, then release the workflow back to conceptual exploration.\
      \ Use after critical mass is reached.\n---\n\n# Proof Strategy Lock-In Orchestrator\n\nConvert exploratory\
      \ critical mass into a bounded completion cycle.\n\n## Critical Conceptual Depth\n\nLock-in is justified\
      \ only when the subgoal carries a sharp conceptual claim:\nit proves a meaningful object exists,\
      \ certifies transfer, explains an\nobstruction, unifies a family, or draws a boundary that changes\
      \ the route's\nunderstanding. The orchestration should protect that core claim from\nfragmenting\
      \ into unrelated tasks.\n\n## Value Signal\n\nState the publication value before the cycle begins\
      \ and re-evaluate it at the\nend. The final state must say how the subgoal changes understanding,\
      \ why it is\nnovel enough at its scope, and whether the completed result is coherent rather\nthan\
      \ a bundle of disconnected artifacts.\n\n## Guardrails\n\n- Do not lock in without a frozen subgoal,\
      \ non-claims, hard gates, cycle\n  budget, stop conditions, and return-to-exploration trigger.\n\
      - Do not allow broad branch hopping while lock-in is active.\n- Do not allow nested publication-consolidation.\
      \ The default limit is four\n  completion cycles with recursion depth one; side lemmas that do not\
      \ fit the\n  budget become blocked handoffs or return to exploration.\n- Keep the local subgoal\
      \ and the larger target problem visible in every\n  consolidation cycle. For Yang-Mills, distinguish\
      \ finite Route A results from\n  the full OS/Wightman continuum construction and mass-gap obligation.\n\
      - If the subgoal is a transfer theorem, freeze anti-definitionality tests,\n  required failure cases,\
      \ consequence delta, and prior-art delta.\n\n## Epistemic Discipline\n\n- Cite evidence paths, learning-ledger\
      \ events, KB ids, validators, and explicit\n  unknowns.\n- Label final state as publication_ready_subgoal,\
      \ precise_demotion,\n  blocked_named_lemma, no_publication_result, released_to_exploration, or\n\
      \  quarantined.\n- Preserve main-problem non-claims even when a subgoal is publication-ready.\n\n\
      ## Codex Exec Protocol\n\nFollow `docs/reference/codex-exec-skill-protocol.md` when running validators,\
      \ report\nbuilders, manuscript integration, or deterministic artifact checks. Inspect\nthe produced\
      \ artifacts and include executed commands in the validation\nhandoff.\n\n## Output Contract\n\n\
      Return:\n\n- `subgoal_statement`\n- `non_claims`\n- `locked_hard_gates`\n- `allowed_cycle_types`\n\
      - `cycle_budget`\n- `publication_consolidation_control`\n- `main_problem_balance`\n- `recursion_guard`\n\
      - `stop_conditions`\n- `publication_target`\n- `anti_definitionality_tests`\n- `return_to_exploration_trigger`\n\
      - `final_state`\n- `learning_events_to_write`\n- `evidence`\n- `validation_handoff`\n\n## Failure/Demotion\n\
      \nDemote lock-in that completes a technically correct but conceptually inert\nsubgoal, especially\
      \ a definition-built transfer theorem. Quarantine lock-in\nplans that suppress needed conceptual\
      \ exploration or blur the main-problem\nboundary.\n"
