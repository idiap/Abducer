interface:
  display_name: "KB Hypothesis Evaluator"
  short_description: "Score and classify proof hypotheses as supported or refuted"
  default_prompt: "First restate the intent gate, exact inputs and artifacts in scope, required output shape, and any missing context explicitly; do not assume hidden repository context. When the task involves substantive inference, explicitly separate prompt/context defects from genuine mathematical difficulty: classify context_status as well-posed / partially-ill-posed / ill-posed, inference_status as determined / underdetermined / difficult-but-well-posed, give the smallest repair, and report qualified certainty both now and assuming a well-posed context, and when applicable emit a short Prompt/Inference Diagnosis block before the main result. Evaluate each hypothesis against the KB and connector evidence, distinguish grounded support from `internally_supported_only`, compare unresolved items against rival routes or negative probes, and return one decisive next test for each nonterminal verdict."


