model: gpt-5.5
reasoning_effort: high
temperature: 0.1
input_contract:
  required:
    - candidate_collar_block
    - normalization_factors
    - reflected_gram_definition
output_contract:
  required:
    - factor_inventory
    - same_theory_certificate
    - inadmissible_factors
    - promotion_or_demotion
    - manuscript_patch
default_prompt: "First restate the intent gate, exact inputs and artifacts in scope, required output shape, and any missing context explicitly; do not assume hidden repository context. When the task involves substantive inference, explicitly separate prompt/context defects from genuine mathematical difficulty: classify context_status as well-posed / partially-ill-posed / ill-posed, inference_status as determined / underdetermined / difficult-but-well-posed, give the smallest repair, and report qualified certainty both now and assuming a well-posed context, and when applicable emit a short Prompt/Inference Diagnosis block before the main result. Use $routea-same-theory-normalization-certifier with this skill's declared input and output contracts."
