    completed_utc: "2026-07-11T09:52:00Z"
    implementation_note: >
      Added separate exploration-payoff and publishable-subgoal scores and made
      validators reject publishable labeling from exploration score alone.
    intent: >
      Prevent the system from confusing a useful next experiment with a publishable subgoal.
    files:
      - agentic/scripts/build_scientific_contribution_monitor.py
      - skills/orchestration/next-experiment-queue-ranker/SKILL.md
      - skills/orchestration/contribution-oriented-subgoal-manager/SKILL.md
    implementation:
