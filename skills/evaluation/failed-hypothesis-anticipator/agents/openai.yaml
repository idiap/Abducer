interface:
  display_name: "Failed Hypothesis Anticipator"
  short_description: "Anticipate hypothesis failure before cycles"
  default_prompt: "First restate the intent gate, exact inputs and artifacts in scope, required output shape, and any missing context explicitly; do not assume hidden repository context. When the task involves substantive inference, explicitly separate prompt/context defects from genuine mathematical difficulty: classify context_status as well-posed / partially-ill-posed / ill-posed, inference_status as determined / underdetermined / difficult-but-well-posed, give the smallest repair, and report qualified certainty both now and assuming a well-posed context, and when applicable emit a short Prompt/Inference Diagnosis block before the main result. Use $failed-hypothesis-anticipator to audit hypotheses for declarative failure signatures, earliest decisive tests, artifact debt, publication reward, and a continue/reframe/demote/quarantine disposition before proof-search cycles."
