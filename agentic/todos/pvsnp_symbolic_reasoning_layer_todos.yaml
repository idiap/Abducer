      - agentic/registries/skill_registry.yaml
      - agentic/registries/skill_quality_registry.yaml
      - agentic/reports/skill_depth/latest.json
    acceptance_criteria:
      - docs/reference/skills.md links to the skill, agent config, and transfer-audit script.
      - Skill depth validation reports zero critical findings.
      - Skill taxonomy projections include 135 skills and expose the symbolic auditor.
    blocked_by:
      - pvsnp-symbolic-001
      - pvsnp-symbolic-002
      - pvsnp-symbolic-003
    evidence:
      - docs/reference/skills.md
      - registry/skill_projections/abducer_skill_projections.json
      - agentic/registries/skill_registry.yaml
      - agentic/registries/skill_quality_registry.yaml
      - agentic/reports/skill_depth/latest.json
    review_date: "2026-07-11"
    failure_modes:
      - The skill can be invoked only by knowing the filesystem path.
