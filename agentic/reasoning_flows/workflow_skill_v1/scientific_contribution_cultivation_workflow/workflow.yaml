      reason: Native skill exists at skills/evaluation/main-problem-alignment-auditor/SKILL.md; no typed
        v1 adapter. Source guards, role and failure remain in native_contract.
  step_audit_enablement:
    inputs:
      ContributionValueAssessment:
        type: ContributionValueAssessment
    outputs:
