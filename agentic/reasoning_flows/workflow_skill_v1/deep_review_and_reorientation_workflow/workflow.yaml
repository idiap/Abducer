  gaps:
  - No workflow-skill/v1 host adapter is supplied. Native skill/hook/CLI interfaces exist, but payload
    materialization, guard evidence, execution effects and receipt translation are not qualified for this
    format.
  - Native control flow remains opaque; coverage is interface_only, not source-equivalence certification.
  - Named payload schemas validate the common envelope only; nominal artifact payloads and artifact_type
    discriminators are not refined by that schema.
  - Conditional/advisory skips, repeated ReviewFindingSet aggregation, exit obligations and handoff adapters
    are preserved verbatim, not executable v1 dataflow.
extensions:
  abducer.owner:
    path: skills/review/review-reasoner/SKILL.md
  abducer.native_identity:
    id: deep_review_and_reorientation
  abducer.native_contract:
    id: deep_review_and_reorientation
    version: 1.0.0
    visible_name: Deep Review and Reorientation
    aliases:
    - deep-review-and-reorientation
    - deep-review
    activation: conditional
    owner_skill: review-reasoner
    target_scope:
    - mathematical
    - scientific
    - workflow
    - release
    trigger:
      all_of:
      - run_evidence_bundle_present
      any_of:
      - repeated_blockage
      - contradictory_evidence
      - low_explanatory_power
      - major_release_gate
      - deep_review_requested
      none_of:
      - proof_acceptance_requested
    input_artifact:
      type: RunEvidenceBundle
      schema: agentic/spec/named_workflow_artifacts.schema.json
    steps:
    - id: formalize_framework_state
      order: 10
      skill: kb-framework-state-formalizer
      mode: required
      when: null
      consumes:
      - RunEvidenceBundle
      produces:
      - FrameworkState
      on_failure: stop
    - id: review_discovery_science
      order: 20
      skill: review-reasoner-discovery-scientist
      mode: advisory
      when: null
      consumes:
      - FrameworkState
      produces:
      - ReviewFindingSet
      on_failure: quarantine
    - id: review_concept_logic
      order: 30
      skill: review-reasoner-concept-logician
      mode: advisory
      when: null
      consumes:
      - FrameworkState
      produces:
      - ReviewFindingSet
      on_failure: quarantine
    - id: review_epistemology
      order: 40
      skill: review-reasoner-epistemologist
      mode: advisory
      when: null
      consumes:
      - FrameworkState
      produces:
      - ReviewFindingSet
      on_failure: quarantine
    - id: review_fields
      order: 50
      skill: review-reasoner-fields-medalist
      mode: advisory
      when: null
      consumes:
      - FrameworkState
      produces:
      - ReviewFindingSet
      on_failure: quarantine
    - id: review_radical_design
      order: 60
      skill: review-reasoner-radical-designer
      mode: advisory
      when: null
      consumes:
      - FrameworkState
      produces:
      - ReviewFindingSet
      on_failure: quarantine
    - id: synthesize_meta_review
      order: 70
      skill: meta
      mode: required
      when: null
      consumes:
      - ReviewFindingSet
      produces:
      - MetaReview
      on_failure: stop
    - id: govern_repairs
      order: 80
      skill: looper-workflow-contract-governor
      mode: validator_only
      when: null
      consumes:
      - MetaReview
      produces:
      - GovernedRepairQueue
      on_failure: stop
    hooks:
    - hook_id: named-workflow-router
      event: UserPromptSubmit
      phase: activation
      condition: deep-review trigger matches
      required_inputs:
      - prompt
      - target
      decision: recommend
      emitted_artifact: WorkflowRecommendation
    - hook_id: workflow-membership-policy
      event: PreSkillUse
      phase: steps
      condition: active workflow and step membership validate
      required_inputs:
      - workflow_id
      - workflow_version
      - target
      - step_id
      - skill
      - conditional_evidence
      decision: block
      emitted_artifact: SkillAuthorization
    - hook_id: typed-output-policy
      event: PostSkillUse
      phase: steps
      condition: declared output and receipt validate
      required_inputs:
      - workflow_id
      - step_id
      - artifact_type
      - epistemic_status
      - receipt
      decision: block
      emitted_artifact: SkillReceipt
    - hook_id: workflow-tool-policy
      event: PreToolUse
      phase: steps
      condition: path safety mutation and budget validate
      required_inputs:
      - workflow_id
      - step_id
      - tool
      - target_path
      - mutation_class
      decision: block
      emitted_artifact: ToolAuthorization
    - hook_id: workflow-exit-policy
      event: Stop
      phase: exit
      condition: repair queue and review evidence validate
      required_inputs:
      - workflow_id
      - exit_artifacts
      - open_obligations
      decision: block
      emitted_artifact: WorkflowExitReceipt
    exit_gate:
      validator: agentic/scripts/validate_workflow_contracts.py
      consumes: GovernedRepairQueue
      allowed:
      - validated
      - archived
      required_artifacts:
      - FrameworkState
      - MetaReview
      - GovernedRepairQueue
      open_obligations_policy: allow_declared
    handoffs:
    - when: repair_workflow_assigned
      workflow: target_navigation_loop
      artifact_type: GovernedRepairQueue
      adapter: governed_repair_queue_to_legacy_control_input
    - when: conceptual_reorientation_required
      workflow: conceptual_hypothesis_exploration_loop
      artifact_type: GovernedRepairQueue
      adapter: governed_repair_queue_to_legacy_control_input
    prohibitions:
    - No proof acceptance authority
    - No epistemic upgrade authority
    - No release authority
    cost_profile: bounded
  abducer.environment:
    python: pyproject.toml
    lock: uv.lock
    native_controls: .codex/config.toml
    native_controls_optional: true
    control_policy: prism_me/shared/references/codex-control-stack.md
  abducer.execution_boundary:
    status: specification_only
    notes: Source inspection only. Effects above deny native execution until a separately reviewed adapter
      exists.
  abducer.step_interfaces:
    formalize_framework_state: step_formalize_framework_state
    review_discovery_science: step_review_discovery_science
    review_concept_logic: step_review_concept_logic
    review_epistemology: step_review_epistemology
    review_fields: step_review_fields
    review_radical_design: step_review_radical_design
    synthesize_meta_review: step_synthesize_meta_review
    govern_repairs: step_govern_repairs
# REUSE-IgnoreEnd
