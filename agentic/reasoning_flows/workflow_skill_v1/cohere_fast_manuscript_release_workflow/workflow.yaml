schema_version: workflow-skill/v1
namespace: abducer
id: cohere_fast_manuscript_release_workflow
version: 1.0.0
kind: workflow
description: Draft interface projection of cohere_fast/manuscript-release; native execution and authority
  remain unchanged.
aliases:
- cohere_fast/manuscript-release
lifecycle: draft
activation:
  mode: explicit
  prerequisites: []
types:
  AuditPacket:
    schema:
      type: object
      description: Native stage type AuditPacket is declared in the registry but has no exact schema.
    representation: value
  ReleasePacket:
    schema:
      type: object
      description: Native stage type ReleasePacket is declared in the registry but has no exact schema.
    representation: value
inputs:
  request:
    type: AuditPacket
outputs:
  result:
    type: ReleasePacket
    value:
      ref: steps.native.outputs.result
operations:
  native_workflow:
    inputs:
      request:
        type: AuditPacket
    outputs:
      result:
        type: ReleasePacket
    execution:
      mode: specification_only
      reason: No workflow-skill/v1 host adapter is supplied. Native skill/hook/CLI interfaces exist, but
        payload materialization, guard evidence, execution effects and receipt translation are not qualified
        for this format.
flow:
  kind: sequence
  steps:
  - id: native
    kind: call
    operation: native_workflow
    description: Opaque native workflow boundary; internal ordering, guards and handoffs are retained
      in abducer.native_contract.
    arguments:
      request:
        ref: inputs.request
    on_failure: blocked
policy:
  effects:
    filesystem:
      read:
      - native_sources
      - inputs
      write: []
    network: []
    external_write: []
  authority:
    allowed:
    - describe_native_interface
    forbidden:
    - execute_scientific_workflow
    - approve
    - prove
    - publish
    - promote
  limits:
    wall_time_seconds: 1800
    max_operation_calls: 1
  failure:
    default: blocked
    retry:
      max_attempts: 1
      retryable_codes: []
  resume:
    mode: none
    require_matching_definition_and_inputs: true
  claim_ceiling: Interface description only; no proof, scientific validity, runtime qualification, promotion
    or approval.
observability:
  receipts: required
  artifact_digests: sha256
  provenance: required
  events:
  - workflow_started
  - step_failed
  - workflow_completed
provenance:
  coverage: interface_only
  sources:
