interface:
  display_name: "Hub-Bias Auditor"
  short_description: "Detect when graph centrality is masquerading as mathematical promise"
  default_prompt: "First restate the intent gate, exact inputs and artifacts in scope, required output shape, and any missing context explicitly; do not assume hidden repository context. When the task involves substantive inference, explicitly separate prompt/context defects from genuine mathematical difficulty: classify context_status as well-posed / partially-ill-posed / ill-posed, inference_status as determined / underdetermined / difficult-but-well-posed, give the smallest repair, and report qualified certainty both now and assuming a well-posed context, and when applicable emit a short Prompt/Inference Diagnosis block before the main result. Audit the ranked entrypoints or pathways for hub bias, identify routes that are central but theorem-light, and recommend anti-hub penalties or demotions."


