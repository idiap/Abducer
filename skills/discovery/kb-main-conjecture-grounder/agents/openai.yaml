interface:
  display_name: "Main Conjecture Grounder"
  short_description: "Ground current routes in the central theorem or conjecture"
  default_prompt: "First restate the intent gate, exact inputs and artifacts in scope, required output shape, and any missing context explicitly; do not assume hidden repository context. When the task involves substantive inference, explicitly separate prompt/context defects from genuine mathematical difficulty: classify context_status as well-posed / partially-ill-posed / ill-posed, inference_status as determined / underdetermined / difficult-but-well-posed, give the smallest repair, and report qualified certainty both now and assuming a well-posed context, and when applicable emit a short Prompt/Inference Diagnosis block before the main result. Ground the current artifact set in the main conjecture, identify the relevant KB statements, state the implication chain from the leading route to the central claim, and explain the unresolved macro-proof frontier in mathematical narrative form."


