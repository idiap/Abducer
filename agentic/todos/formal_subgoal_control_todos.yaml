    "acceptance_criteria": [
      "The contract can represent persistence, adaptation, backtracking, pivoting, quarantine, and stop without domain-specific hard-coding.",
      "The decision criteria explicitly distinguish difficult-but-live proof debt from repeated low-information failure.",
      "Every decision requires a target-object link, a blocker or success condition, and a next workflow action.",
      "The contract forbids silent continuation after repeated identical blockers."
    ],
