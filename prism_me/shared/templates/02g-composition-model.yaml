# Optional Prism-core-shaped serialization of `WorkflowCompositionPolicySpec`.
#
# Use this file when a request needs an explicit composition shape that goes
# beyond the current distributed slice-plan vocabulary. The policy fields match
# the current rover workflow composition schema directly so the artifact can be
# read as a normalized policy object rather than a loose mirror.

metadata:
  request_slug: "<request-slug>"
  composition_id: "<composition-id>"
  core_schema: "WorkflowCompositionPolicySpec"
  optional: true
  status: "draft"
  last_updated: ""
  core_concept: "Formal composition for skills and subskills."
  intent: "Make sequence, branching, refinement, arbitration, aggregation, and contradiction handling explicit using the current workflow policy shape."

composition_policy:
  kind: "sequence"
  condition: null
  branch_targets: []
  max_iterations: 1
  exit_when: null
  iteration_input: null
  delegate_to: []
  aggregation_sources: []
  aggregation_mode: null
  contradiction_resolution: null
  judge_role: null
  notes: []

notes: ""
