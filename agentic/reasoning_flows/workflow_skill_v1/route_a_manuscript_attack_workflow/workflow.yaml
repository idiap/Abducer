    digest: sha256:4126bf32665ae5b9718ed1f4bb71fb6383e53e085439dc85a9c9187720656999
  - path: skills/results_ellaboration/routea-symbolic-cas-auditor/SKILL.md
    digest: sha256:eeab83070bd29bcc922f22c48df20c8ee8f646c643f601fb1f1cf2889dafe925
  - path: skills/results_ellaboration/routea-paper-result-integrator/SKILL.md
    digest: sha256:58f7d9e22da28055a10ba7f5f262ef2331dab89886799671d1f79961294b02b6
  - path: skills/results_ellaboration/routea-second-wave-manuscript-integrator/SKILL.md
    digest: sha256:398be645c0df8c03ac25db30b668ae713ba7c4033323fcdd09cdb41c8e617cfb
  - path: agentic/registries/skill_registry.yaml
