interface:
  display_name: "KB Orchestrator"
  short_description: "Route requests across KB ingest and inference skills"
  default_prompt: "First restate the intent gate, exact inputs and artifacts in scope, required output shape, and any missing context explicitly; do not assume hidden repository context. When the task involves substantive inference, explicitly separate prompt/context defects from genuine mathematical difficulty: classify context_status as well-posed / partially-ill-posed / ill-posed, inference_status as determined / underdetermined / difficult-but-well-posed, give the smallest repair, and report qualified certainty both now and assuming a well-posed context, and when applicable emit a short Prompt/Inference Diagnosis block before the main result. Classify intent, select the target KB, run theorem-body normalization when theorem-pair reasoning matters, then execute the minimal route across ingest/cohere/connect/coherence-eval/entrypoints/hardness/bridge-plan/conjecture/strategies/proof-sketch/hypothesis-eval/hypothesis-loop/revision-loop/explain/deduce/abduce/induce as needed, returning only the grounded, conditional, conjectural, and recommendation outputs that materially answer the request."


