interface:
  display_name: "Timeline Narrative Coherence Guard"
  short_description: "Bound paper drafts to a coherent subgoal"
  default_prompt: "First restate the intent gate, exact inputs and artifacts in scope, required output shape, and any missing context explicitly; do not assume hidden repository context. When the task involves substantive inference, explicitly separate prompt/context defects from genuine mathematical difficulty: classify context_status as well-posed / partially-ill-posed / ill-posed, inference_status as determined / underdetermined / difficult-but-well-posed, give the smallest repair, and report qualified certainty both now and assuming a well-posed context, and when applicable emit a short Prompt/Inference Diagnosis block before the main result. Use $timeline-narrative-coherence-guard to keep a timeline-derived paper focused on a bounded scientific subgoal and demote exploratory details that do not strengthen the argument."
