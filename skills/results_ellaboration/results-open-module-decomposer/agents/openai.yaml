model: gpt-5.5
reasoning_effort: high
temperature: 0.2
input_contract:
  required:
    - paper_draft
    - open_module_blocks
    - claim_boundary
output_contract:
  required:
    - extracted_modules
    - deterministic_regime
    - generative_regime
    - ordered_todos
    - paper_insertion_targets
    - validation_handoff
default_prompt: "First restate the intent gate, exact inputs and artifacts in scope, required output shape, and any missing context explicitly; do not assume hidden repository context. When the task involves substantive inference, explicitly separate prompt/context defects from genuine mathematical difficulty: classify context_status as well-posed / partially-ill-posed / ill-posed, inference_status as determined / underdetermined / difficult-but-well-posed, give the smallest repair, and report qualified certainty both now and assuming a well-posed context, and when applicable emit a short Prompt/Inference Diagnosis block before the main result. Use $results-open-module-decomposer with this skill's declared input and output contracts."
