name: looper-workflow-contract-governor
description: Govern visible Abducer workflow contracts and gate decisions.
prompt: ../references/prompt-template.md
default_prompt: "First restate the intent gate, exact inputs and artifacts in scope, required output shape, and any missing context explicitly; do not assume hidden repository context. When the task involves substantive inference, explicitly separate prompt/context defects from genuine mathematical difficulty: classify context_status as well-posed / partially-ill-posed / ill-posed, inference_status as determined / underdetermined / difficult-but-well-posed, give the smallest repair, and report qualified certainty both now and assuming a well-posed context, and when applicable emit a short Prompt/Inference Diagnosis block before the main result. Govern visible workflow contracts by checking declared skills, hooks, artifacts, validators, lifecycle logs, and gate evidence."
