      - agentic/reports/discovery_marathon/targets/yang-mills-existence-and-mass-gap-target/result_atlas_update.json
    acceptance_criteria:
      - The selected subgoal is one of relational rigidity, heat-kernel basin entry, fibered block RG, or an explicitly justified smaller object from the proof-object index.
      - The decision records why the subgoal has publication weight, coherent narrative, novelty, and relevance to the larger YM gap problem.
      - The decision records what would change understanding if the subgoal succeeds.
      - The consolidation budget is fixed at four completion cycles with recursion depth one.
      - At budget exhaustion the subgoal is published, demoted, blocked with evidence, or returned to conceptual exploration with a learning event.
    blocked_by:
      - YMINT-004
      - YMINT-010
    evidence:
      - docs/plans-and-reviews/proof-depth-control-stack-plan.md
      - docs/case-studies/yang-mills/ym-representational-dynamics-integration-todos.md
      - agentic/todos/publishable_stepping_stone_subgoal_todos.yaml
