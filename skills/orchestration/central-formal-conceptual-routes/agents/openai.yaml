interface:
  display_name: "Central Formal Conceptual Routes"
  short_description: "Use Category and HoTT for physics-facing discovery"
  default_prompt: "First restate the intent gate, exact inputs and artifacts in scope, required output shape, and any missing context explicitly; do not assume hidden repository context. When the task involves substantive inference, explicitly separate prompt/context defects from genuine mathematical difficulty: classify context_status as well-posed / partially-ill-posed / ill-posed, inference_status as determined / underdetermined / difficult-but-well-posed, give the smallest repair, and report qualified certainty both now and assuming a well-posed context, and when applicable emit a short Prompt/Inference Diagnosis block before the main result. Use $central-formal-conceptual-routes to run matched Category, HoTT, both-order, and capable nonformal conceptual authors over one committed theory core, then return a plural candidate set through exact physics handbacks without granting formalism, proof, experiment, or theory-selection authority."
