schema_version: workflow-skill/v1
namespace: abducer
id: manuscript_result_elaboration_workflow
version: 1.0.0
kind: workflow
description: Draft interface projection of manuscript_result_elaboration; native execution and authority
  remain unchanged.
aliases:
- manuscript_result_elaboration
- manuscript-result-elaboration
- results-elaboration
lifecycle: draft
activation:
  mode: explicit
  prerequisites: []
types:
  ElaborationPlan:
    schema: ../../../../agentic/spec/named_workflow_artifacts.schema.json
    representation: value
  ExpansionValidation:
    schema: ../../../../agentic/spec/named_workflow_artifacts.schema.json
    representation: value
  ExtensionNeeds:
    schema: ../../../../agentic/spec/named_workflow_artifacts.schema.json
    representation: value
  ExtensionStrategy:
    schema: ../../../../agentic/spec/named_workflow_artifacts.schema.json
    representation: value
  FiniteObjectDefinition:
    schema: ../../../../agentic/spec/named_workflow_artifacts.schema.json
    representation: value
  IntegratedPaperDraft:
    schema: ../../../../agentic/spec/named_workflow_artifacts.schema.json
    representation: value
  OpenModulePlan:
    schema: ../../../../agentic/spec/named_workflow_artifacts.schema.json
    representation: value
  PaperDraft:
    schema: ../../../../agentic/spec/named_workflow_artifacts.schema.json
    representation: value
  PaperReadinessDecision:
    schema: ../../../../agentic/spec/named_workflow_artifacts.schema.json
    representation: value
  PriorArtBoundaryAudit:
    schema: ../../../../agentic/spec/named_workflow_artifacts.schema.json
    representation: value
  RefinedResultCandidates:
    schema: ../../../../agentic/spec/named_workflow_artifacts.schema.json
    representation: value
  ResultsContext:
    schema: ../../../../agentic/spec/named_workflow_artifacts.schema.json
    representation: value
  ResultsProofPacket:
    schema: ../../../../agentic/spec/named_workflow_artifacts.schema.json
    representation: value
  TheoremScopeDecision:
    schema: ../../../../agentic/spec/named_workflow_artifacts.schema.json
    representation: value
inputs:
  request:
    type: PaperDraft
outputs:
  result:
    type: PaperReadinessDecision
    value:
      ref: steps.native.outputs.result
operations:
  native_workflow:
    inputs:
      request:
        type: PaperDraft
    outputs:
      result:
        type: PaperReadinessDecision
    execution:
      mode: specification_only
      reason: No workflow-skill/v1 host adapter is supplied. Native skill/hook/CLI interfaces exist, but
        payload materialization, guard evidence, execution effects and receipt translation are not qualified
        for this format.
  step_orchestrate_elaboration:
    inputs:
      PaperDraft:
        type: PaperDraft
    outputs:
      ElaborationPlan:
        type: ElaborationPlan
    execution:
      mode: specification_only
      reason: Native skill exists at skills/results_ellaboration/results-elaboration-workflow-orchestrator/SKILL.md;
        no typed v1 adapter. Source guards, role and failure remain in native_contract.
  step_interpret_context:
    inputs:
      ElaborationPlan:
        type: ElaborationPlan
    outputs:
      ResultsContext:
        type: ResultsContext
    execution:
      mode: specification_only
      reason: Native skill exists at skills/results_ellaboration/results-context-interpreter/SKILL.md;
        no typed v1 adapter. Source guards, role and failure remain in native_contract.
  step_extract_extensions:
    inputs:
      ResultsContext:
        type: ResultsContext
    outputs:
      ExtensionNeeds:
        type: ExtensionNeeds
    execution:
      mode: specification_only
      reason: Native skill exists at skills/results_ellaboration/results-extension-need-extractor/SKILL.md;
        no typed v1 adapter. Source guards, role and failure remain in native_contract.
  step_decompose_modules:
    inputs:
      ResultsContext:
        type: ResultsContext
    outputs:
      OpenModulePlan:
        type: OpenModulePlan
    execution:
      mode: specification_only
      reason: Native skill exists at skills/results_ellaboration/results-open-module-decomposer/SKILL.md;
        no typed v1 adapter. Source guards, role and failure remain in native_contract.
  step_plan_strategy:
    inputs:
      ExtensionNeeds:
        type: ExtensionNeeds
      OpenModulePlan:
        type: OpenModulePlan
    outputs:
      ExtensionStrategy:
        type: ExtensionStrategy
    execution:
      mode: specification_only
      reason: Native skill exists at skills/results_ellaboration/results-extension-strategy-planner/SKILL.md;
        no typed v1 adapter. Source guards, role and failure remain in native_contract.
  step_self_refine:
    inputs:
      ExtensionStrategy:
        type: ExtensionStrategy
    outputs:
      RefinedResultCandidates:
        type: RefinedResultCandidates
    execution:
      mode: specification_only
      reason: Native skill exists at skills/results_ellaboration/results-critical-self-refiner/SKILL.md;
        no typed v1 adapter. Source guards, role and failure remain in native_contract.
  step_certify_scope:
    inputs:
      RefinedResultCandidates:
        type: RefinedResultCandidates
    outputs:
      TheoremScopeDecision:
        type: TheoremScopeDecision
    execution:
      mode: specification_only
      reason: Native skill exists at skills/results_ellaboration/results-theorem-scope-certifier/SKILL.md;
        no typed v1 adapter. Source guards, role and failure remain in native_contract.
  step_formalize_finite_object:
    inputs:
      RefinedResultCandidates:
        type: RefinedResultCandidates
    outputs:
      FiniteObjectDefinition:
        type: FiniteObjectDefinition
    execution:
      mode: specification_only
      reason: Native skill exists at skills/results_ellaboration/results-finite-object-formalizer/SKILL.md;
        no typed v1 adapter. Source guards, role and failure remain in native_contract.
  step_derive_proof_packet:
    inputs:
      RefinedResultCandidates:
        type: RefinedResultCandidates
    outputs:
      ResultsProofPacket:
        type: ResultsProofPacket
    execution:
      mode: specification_only
      reason: Native skill exists at skills/results_ellaboration/results-proof-packet-deriver/SKILL.md;
        no typed v1 adapter. Source guards, role and failure remain in native_contract.
  step_audit_prior_art:
    inputs:
      RefinedResultCandidates:
        type: RefinedResultCandidates
    outputs:
      PriorArtBoundaryAudit:
        type: PriorArtBoundaryAudit
    execution:
      mode: specification_only
      reason: Native skill exists at skills/results_ellaboration/results-prior-art-disqualifier-auditor/SKILL.md;
        no typed v1 adapter. Source guards, role and failure remain in native_contract.
  step_integrate_narrative:
    inputs:
      RefinedResultCandidates:
        type: RefinedResultCandidates
      PriorArtBoundaryAudit:
        type: PriorArtBoundaryAudit
    outputs:
      IntegratedPaperDraft:
        type: IntegratedPaperDraft
    execution:
      mode: specification_only
      reason: Native skill exists at skills/results_ellaboration/results-narrative-integrator/SKILL.md;
        no typed v1 adapter. Source guards, role and failure remain in native_contract.
  step_validate_expansion:
    inputs:
      IntegratedPaperDraft:
        type: IntegratedPaperDraft
    outputs:
      ExpansionValidation:
        type: ExpansionValidation
    execution:
      mode: specification_only
      reason: Native skill exists at skills/results_ellaboration/results-expansion-validator/SKILL.md;
        no typed v1 adapter. Source guards, role and failure remain in native_contract.
  step_gate_readiness:
    inputs:
      IntegratedPaperDraft:
        type: IntegratedPaperDraft
      ExpansionValidation:
        type: ExpansionValidation
    outputs:
      PaperReadinessDecision:
        type: PaperReadinessDecision
    execution:
      mode: specification_only
      reason: Native skill exists at skills/results_ellaboration/results-paper-readiness-gatekeeper/SKILL.md;
        no typed v1 adapter. Source guards, role and failure remain in native_contract.
flow:
  kind: sequence
  steps:
  - id: native
    kind: call
    operation: native_workflow
    description: Opaque native workflow boundary; internal ordering, guards and handoffs are retained
      in abducer.native_contract.
    arguments:
      request:
        ref: inputs.request
    on_failure: blocked
policy:
  effects:
    filesystem:
      read:
      - native_sources
      - inputs
      write: []
    network: []
    external_write: []
  authority:
    allowed:
    - describe_native_interface
    forbidden:
    - execute_scientific_workflow
    - approve
    - prove
    - publish
    - promote
  limits:
    wall_time_seconds: 1800
    max_operation_calls: 1
  failure:
    default: blocked
    retry:
      max_attempts: 1
      retryable_codes: []
  resume:
    mode: none
    require_matching_definition_and_inputs: true
  claim_ceiling: Interface description only; no proof, scientific validity, runtime qualification, promotion
    or approval.
observability:
  receipts: required
  artifact_digests: sha256
  provenance: required
  events:
  - workflow_started
  - step_failed
  - workflow_completed
provenance:
  coverage: interface_only
  sources:
