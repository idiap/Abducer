interface:
  display_name: "Gedanken Variant Builder"
  short_description: "Build counterfactual variants that test which mechanism drives an imagined observation"
  default_prompt: "First restate the intent gate, exact inputs and artifacts in scope, required output shape, and any missing context explicitly; do not assume hidden repository context. When the task involves substantive inference, explicitly separate prompt/context defects from genuine mathematical difficulty: classify context_status as well-posed / partially-ill-posed / ill-posed, inference_status as determined / underdetermined / difficult-but-well-posed, give the smallest repair, and report qualified certainty both now and assuming a well-posed context, and when applicable emit a short Prompt/Inference Diagnosis block before the main result. Use $gedanken-counterfactual-variant-builder to vary one condition at a time, predict observation changes, and update a Gedanken experiment packet with diagnostic variants."
