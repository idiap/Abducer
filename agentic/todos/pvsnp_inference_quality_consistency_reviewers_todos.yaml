reflection:
  purpose: >
    Add a P vs NP-specific inference quality and consistency-review layer that
    sits between creative branch generation and report/paper claims. The
    workflow already has useful skills for pressure localization, symbolic
    auditing, negative tactics, and end-to-end proof criticism, but it still
    needs a controller that treats every nontrivial complexity-theoretic
    inference as a typed mathematical object with source statement, target
    statement, inference rule, model, quantifiers, side conditions, barrier
    status, proof status, and reviewer verdict.
  core_principle: >
    A P vs NP claim is not allowed to advance because it sounds plausible or
    aligns with a promising route. It advances only when the inference preserves
    the stated source and target objects, reduction direction, complexity class
    boundary, uniformity/advice regime, quantifier strength, theorem
    applicability, and proof obligations. When the claim is theorem-shaped, the
    loop must either derive it, localize the missing lemma, or demote it to a
    conjectural pressure note.
  quality_bar: >
    The quality layer must be generative where mathematical interpretation is
    needed and deterministic where structural invariants can be validated. It
    should derive proofs or proof skeletons when necessary, but it must also
    reject overclaims: changed models, reversed reductions, hidden advice,
    all-exponent claims from fixed-exponent evidence, generic barrier labels,
    and paper-level novelty claims unsupported by theorem-shaped content.
  correctness_dimensions:
    - Exact source and target statement typing, including language/problem, class, circuit model, proof system, oracle status, and promise/domain constraints.
    - Reduction and transfer correctness: direction, type, length map, parameter propagation, padding/projection effects, and completeness assumptions.
    - Quantifier correctness: all lengths versus infinitely often, all exponents versus one exponent, uniform versus nonuniform, algorithm versus family, and advice-free versus advice-bearing claims.
    - Barrier correctness: relativization, algebrization, natural-proofs, black-boxness, diagonalization, and proof-complexity barriers must be branch-specific rather than used as generic labels.
    - Derivation correctness: theorem-shaped claims must expose definitions, assumptions, lemmas, proof steps, missing obligations, and counterexample classes.
    - Epistemic correctness: distinguish proof, conditional theorem, proof obligation, heuristic pressure, falsifier, no-go theorem, and paper-ready contribution.
todos:
  - id: pvsnp-iq-001
    type: workflow_todo
    phase: inference-quality-control
    owner: skills/orchestration
    priority: critical
    risk_class: pvsnp_inference_overclaim
    title: Create the P vs NP inference quality controller skill
    intent: >
      Build `pvsnp-inference-quality-controller` as the central gate that
      converts every serious P vs NP branch claim into an auditable inference
      packet before it can promote, enter the proof queue, or appear in a
      paper-facing narrative.
    use_skills:
      - pvsnp-conceptual-pressure-localizer
      - pvsnp-symbolic-complexity-auditor
      - entailment-gap-auditor
      - epistemic-status-ledger
    required_artifact:
      - skills/orchestration/pvsnp-inference-quality-controller/SKILL.md
      - skills/orchestration/pvsnp-inference-quality-controller/agents/openai.yaml
    acceptance_criteria:
      - The skill requires source statement, target statement, inference rule, model context, quantifier context, parameter map, theorem citation or proof obligation, barrier status, and decision.
      - The skill decides one of `accept_for_derivation`, `needs_repair`, `review_only`, `quarantine`, or `reject_overclaim`.
      - The skill explicitly routes theorem-shaped claims to proof derivation rather than allowing narrative restatement.
      - The skill names the next validator, reviewer, or proof obligation controlling the branch.
    blocked_by: []
    evidence:
      - Existing P vs NP skills audit pieces of the problem but do not yet impose a unified inference packet.
    review_date: "2026-07-11"
    failure_modes:
      - The controller becomes a generic checklist and fails to reason in P vs NP objects.
      - The controller allows claims to pass without reduction direction, quantifier regime, or uniformity/advice status.
    status: resolved

  - id: pvsnp-iq-002
    type: workflow_todo
    phase: proof-derivation
    owner: skills/reasoning
    priority: critical
    risk_class: underived_theorem_claim
    title: Create the P vs NP proof derivation builder skill
    intent: >
      Build `pvsnp-proof-derivation-builder` for cases where the loop claims a
      theorem, lemma, transfer inequality, contradiction, or no-go statement.
      The skill must derive the result as far as possible and precisely locate
      remaining proof debt.
    use_skills:
      - kb-proof-sketcher
      - kb-proof-connector
      - pvsnp-symbolic-complexity-auditor
      - theorem-body-normalizer
    required_artifact:
      - skills/reasoning/pvsnp-proof-derivation-builder/SKILL.md
      - skills/reasoning/pvsnp-proof-derivation-builder/agents/openai.yaml
    acceptance_criteria:
      - Output contains theorem statement, definitions, hypotheses, lemma chain, proof steps, where each assumption is used, and exact blocked step if incomplete.
      - Derivations preserve circuit model, proof system, oracle status, promise restrictions, and length parameters.
      - Failed derivations produce a named proof obligation and counterexample search target rather than prose confidence.
      - The skill distinguishes rigorous proof, conditional theorem, proof sketch, heuristic argument, and invalid derivation.
    blocked_by:
      - pvsnp-iq-001
    evidence:
      - The current workflow can generate proof sketches but needs a stronger derivation-specific layer before paper-level claims.
    review_date: "2026-07-11"
    failure_modes:
      - The skill returns a plausible narrative without deriving definitions-to-conclusion.
      - The skill hides an equivalent-to-P-vs-NP premise inside a local lemma.
    status: resolved

  - id: pvsnp-iq-003
    type: workflow_todo
    phase: consistency-review
    owner: skills/evaluation
    priority: critical
    risk_class: reduction_transfer_error
    title: Add a reduction and transfer consistency reviewer
    intent: >
      Create `pvsnp-reduction-consistency-reviewer` to audit reduction
      direction, reduction type, completeness assumptions, promise/domain
      conditions, length maps, parameter propagation, padding/projection
      effects, and target-class preservation.
    use_skills:
      - pvsnp-symbolic-complexity-auditor
      - bridge-object-equivalence-checker
      - entailment-gap-auditor
    required_artifact:
      - skills/evaluation/pvsnp-reduction-consistency-reviewer/SKILL.md
      - skills/evaluation/pvsnp-reduction-consistency-reviewer/agents/openai.yaml
    acceptance_criteria:
      - Reviewer rejects reversed implications such as treating source-carrier hardness as direct SAT hardness without a proved transfer.
      - Reviewer records many-one, Turing, oracle, projection, padding, black-box-substitution, and nonblackbox transfer distinctions.
      - Reviewer computes or requests parameter inequalities when transfer exponents determine whether the branch can preserve all-exponent strength.
    blocked_by:
      - pvsnp-iq-001
    evidence:
      - P vs NP branches repeatedly depend on transfer inequalities and source-to-target preservation.
    review_date: "2026-07-11"
    failure_modes:
      - Reviewer only says "reduction needed" without naming direction, model, and parameter map.
      - Reviewer ignores promise restrictions or sparse-valid-length effects.
    status: resolved

  - id: pvsnp-iq-004
    type: workflow_todo
    phase: consistency-review
    owner: skills/evaluation
    priority: critical
    risk_class: quantifier_uniformity_error
    title: Add a quantifier and uniformity consistency reviewer
    intent: >
      Create `pvsnp-quantifier-uniformity-reviewer` to stop branches from
      silently changing all-exponent claims into fixed-exponent claims, all
      lengths into infinitely-often claims, uniform algorithms into circuit
      families, or advice-free reasoning into advice-bearing reasoning.
    use_skills:
      - pvsnp-symbolic-complexity-auditor
      - epistemic-status-ledger
      - entailment-gap-auditor
    required_artifact:
      - skills/evaluation/pvsnp-quantifier-uniformity-reviewer/SKILL.md
      - skills/evaluation/pvsnp-quantifier-uniformity-reviewer/agents/openai.yaml
    acceptance_criteria:
      - Reviewer emits a quantifier table covering length set, exponent range, uniformity, advice, randomness, oracle status, and circuit-family versus algorithmic form.
      - Reviewer rejects promotion when the conclusion has stronger quantifiers than the premises.
      - Reviewer identifies the minimum extra lemma needed to repair quantifier loss.
    blocked_by:
      - pvsnp-iq-001
    evidence:
      - P vs NP work is especially vulnerable to all-exponent, nonuniformity, and advice leakage errors.
    review_date: "2026-07-11"
    failure_modes:
      - Reviewer gives generic caveats instead of a concrete quantifier mismatch.
      - Reviewer treats P/poly, P, NP, coNP, PH, and restricted circuit models as interchangeable.
    status: resolved

  - id: pvsnp-iq-005
    type: workflow_todo
    phase: consistency-review
    owner: skills/evaluation
    priority: high
    risk_class: generic_barrier_labeling
    title: Add a barrier specificity reviewer
    intent: >
      Create `pvsnp-barrier-specificity-reviewer` to determine whether a branch
      is relativizing, algebrizing, natural, black-box, diagonalizing,
      proof-complexity-specific, or outside known barrier templates, with
      escape conditions stated branch-by-branch.
    use_skills:
      - pvsnp-negative-tactic-selector
      - pvsnp-impossibility-theorem-forger
      - pvsnp-conceptual-pressure-localizer
    required_artifact:
      - skills/evaluation/pvsnp-barrier-specificity-reviewer/SKILL.md
      - skills/evaluation/pvsnp-barrier-specificity-reviewer/agents/openai.yaml
    acceptance_criteria:
      - Barrier diagnoses name the exact property of the branch that triggers the barrier.
      - Outputs state escape conditions such as nonblackbox use, non-largeness, nonconstructivity, nonrelativizing step, or advice-free carrier certificate.
      - Reviewer rejects barrier labels that are used as pessimistic slogans or as proofs against the target itself.
    blocked_by:
      - pvsnp-iq-001
    evidence:
      - Existing negative-tactic policy calls for route-specific barriers, but a dedicated reviewer is needed for consistency.
    review_date: "2026-07-11"
    failure_modes:
      - Barrier status is copied from literature without checking the branch's actual inference mechanism.
      - Reviewer suppresses high-reward nonblackbox or non-natural escape routes prematurely.
    status: resolved

  - id: pvsnp-iq-006
    type: workflow_todo
    phase: consistency-review
    owner: skills/evaluation
    priority: high
    risk_class: proof_complexity_transfer_error
    title: Add a proof-complexity transfer reviewer
    intent: >
      Create `pvsnp-proof-complexity-transfer-reviewer` for claims that proof
      lower bounds, proof-system simulations, algebraic proof systems, or
      tautology families imply language or circuit lower bounds.
    use_skills:
      - pvsnp-symbolic-complexity-auditor
      - pvsnp-reduction-consistency-reviewer
      - pvsnp-proof-derivation-builder
    required_artifact:
      - skills/evaluation/pvsnp-proof-complexity-transfer-reviewer/SKILL.md
      - skills/evaluation/pvsnp-proof-complexity-transfer-reviewer/agents/openai.yaml
    acceptance_criteria:
      - Reviewer names the proof system, tautology family, semantic target, circuit class, and simulation/transfer theorem.
      - Reviewer separates proof-length lower bound, automatability lower bound, language hardness, and circuit lower bound.
      - Reviewer checks shortcut models such as Gaussian elimination, algebraic certificates, semantic bypasses, and recognition overhead.
    blocked_by:
      - pvsnp-iq-002
      - pvsnp-iq-003
    evidence:
      - Proof-complexity branches need specialized consistency checks beyond generic entailment auditing.
    review_date: "2026-07-11"
    failure_modes:
      - Reviewer treats proof lower bounds as direct NP circuit lower bounds.
      - Reviewer fails to identify where the semantic bridge is unproved.
