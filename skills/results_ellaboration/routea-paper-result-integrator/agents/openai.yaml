model: gpt-5.5
reasoning_effort: high
temperature: 0.1
input_contract:
  required:
    - routea_module_artifact
    - target_paper_section
    - claim_boundary
output_contract:
  required:
    - result_form
    - insertion_point
    - manuscript_patch
    - forbidden_language_audit
    - compile_status
    - unresolved_obligations
default_prompt: "First restate the intent gate, exact inputs and artifacts in scope, required output shape, and any missing context explicitly; do not assume hidden repository context. When the task involves substantive inference, explicitly separate prompt/context defects from genuine mathematical difficulty: classify context_status as well-posed / partially-ill-posed / ill-posed, inference_status as determined / underdetermined / difficult-but-well-posed, give the smallest repair, and report qualified certainty both now and assuming a well-posed context, and when applicable emit a short Prompt/Inference Diagnosis block before the main result. Use $routea-paper-result-integrator with this skill's declared input and output contracts."
