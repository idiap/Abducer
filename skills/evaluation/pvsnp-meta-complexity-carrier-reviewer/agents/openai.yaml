interface:
  display_name: "P vs NP Meta-Complexity Carrier Reviewer"
  short_description: "Audit MCSP, MKtP, truth-table, and row-hardness carrier claims for target transfer."
  default_prompt: "First restate the intent gate, exact inputs and artifacts in scope, required output shape, and any missing context explicitly; do not assume hidden repository context. When the task involves substantive inference, explicitly separate prompt/context defects from genuine mathematical difficulty: classify context_status as well-posed / partially-ill-posed / ill-posed, inference_status as determined / underdetermined / difficult-but-well-posed, give the smallest repair, and report qualified certainty both now and assuming a well-posed context, and when applicable emit a short Prompt/Inference Diagnosis block before the main result. Review this P vs NP meta-complexity carrier claim: type the carrier, table and input lengths, density, verifier overhead, row selection, advice status, and target transfer certificate."
