  gaps:
  - No workflow-skill/v1 host adapter is supplied. Native skill/hook/CLI interfaces exist, but payload
    materialization, guard evidence, execution effects and receipt translation are not qualified for this
    format.
  - Native control flow remains opaque; coverage is interface_only, not source-equivalence certification.
  - Named payload schemas validate the common envelope only; nominal artifact payloads and artifact_type
    discriminators are not refined by that schema.
  - Conditional/advisory skips, repeated ReviewFindingSet aggregation, exit obligations and handoff adapters
    are preserved verbatim, not executable v1 dataflow.
extensions:
  abducer.owner:
    path: skills/results_ellaboration/results-elaboration-workflow-orchestrator/SKILL.md
  abducer.native_identity:
    id: manuscript_result_elaboration
  abducer.native_contract:
    id: manuscript_result_elaboration
    version: 1.0.0
    visible_name: Manuscript Result Elaboration
    aliases:
    - manuscript-result-elaboration
    - results-elaboration
    activation: opt_in
    owner_skill: results-elaboration-workflow-orchestrator
    target_scope:
    - manuscript
    trigger:
      all_of:
      - paper_draft_present
      any_of:
      - expansion_markers
      - open_modules
      - result_elaboration_requested
      none_of:
      - discovery_marathon_requested
    input_artifact:
      type: PaperDraft
      schema: agentic/spec/named_workflow_artifacts.schema.json
    steps:
    - id: orchestrate_elaboration
      order: 10
      skill: results-elaboration-workflow-orchestrator
      mode: required
      when: null
      consumes:
      - PaperDraft
      produces:
      - ElaborationPlan
      on_failure: stop
    - id: interpret_context
      order: 20
      skill: results-context-interpreter
      mode: required
      when: null
      consumes:
      - ElaborationPlan
      produces:
      - ResultsContext
      on_failure: stop
    - id: extract_extensions
      order: 30
      skill: results-extension-need-extractor
      mode: conditional
      when: expansion_markers
      consumes:
      - ResultsContext
      produces:
      - ExtensionNeeds
      on_failure: quarantine
    - id: decompose_modules
      order: 40
      skill: results-open-module-decomposer
      mode: conditional
      when: open_modules
      consumes:
      - ResultsContext
      produces:
      - OpenModulePlan
      on_failure: quarantine
    - id: plan_strategy
      order: 50
      skill: results-extension-strategy-planner
      mode: required
      when: null
      consumes:
      - ExtensionNeeds
      - OpenModulePlan
      produces:
      - ExtensionStrategy
      on_failure: stop
    - id: self_refine
      order: 60
      skill: results-critical-self-refiner
      mode: required
      when: null
      consumes:
      - ExtensionStrategy
      produces:
      - RefinedResultCandidates
      on_failure: stop
    - id: certify_scope
      order: 70
      skill: results-theorem-scope-certifier
      mode: validator_only
      when: null
      consumes:
      - RefinedResultCandidates
      produces:
      - TheoremScopeDecision
      on_failure: stop
    - id: formalize_finite_object
      order: 80
      skill: results-finite-object-formalizer
      mode: conditional
      when: finite_object_required
      consumes:
      - RefinedResultCandidates
      produces:
      - FiniteObjectDefinition
      on_failure: quarantine
    - id: derive_proof_packet
      order: 90
      skill: results-proof-packet-deriver
      mode: conditional
      when: proof_class_work
      consumes:
      - RefinedResultCandidates
      produces:
      - ResultsProofPacket
      on_failure: quarantine
    - id: audit_prior_art
      order: 100
      skill: results-prior-art-disqualifier-auditor
      mode: validator_only
      when: null
      consumes:
      - RefinedResultCandidates
      produces:
      - PriorArtBoundaryAudit
      on_failure: stop
    - id: integrate_narrative
      order: 110
      skill: results-narrative-integrator
      mode: required
      when: null
      consumes:
      - RefinedResultCandidates
      - PriorArtBoundaryAudit
      produces:
      - IntegratedPaperDraft
      on_failure: stop
    - id: validate_expansion
      order: 120
      skill: results-expansion-validator
      mode: validator_only
      when: null
      consumes:
      - IntegratedPaperDraft
      produces:
      - ExpansionValidation
      on_failure: stop
    - id: gate_readiness
      order: 130
      skill: results-paper-readiness-gatekeeper
      mode: validator_only
      when: null
      consumes:
      - IntegratedPaperDraft
      - ExpansionValidation
      produces:
      - PaperReadinessDecision
      on_failure: stop
    hooks:
    - hook_id: named-workflow-router
      event: UserPromptSubmit
      phase: activation
      condition: manuscript trigger matches
      required_inputs:
      - prompt
      - target
      decision: recommend
      emitted_artifact: WorkflowRecommendation
    - hook_id: workflow-membership-policy
      event: PreSkillUse
      phase: steps
      condition: active workflow and step membership validate
      required_inputs:
      - workflow_id
      - workflow_version
      - target
      - step_id
      - skill
      - conditional_evidence
      - profile
      decision: block
      emitted_artifact: SkillAuthorization
    - hook_id: typed-output-policy
      event: PostSkillUse
      phase: steps
      condition: declared output and receipt validate
      required_inputs:
      - workflow_id
      - step_id
      - artifact_type
      - epistemic_status
      - receipt
      decision: block
      emitted_artifact: SkillReceipt
    - hook_id: workflow-tool-policy
      event: PreToolUse
      phase: steps
      condition: path safety mutation and budget validate
      required_inputs:
      - workflow_id
      - step_id
      - tool
      - target_path
      - mutation_class
      decision: block
      emitted_artifact: ToolAuthorization
    - hook_id: workflow-exit-policy
      event: Stop
      phase: exit
      condition: marker coverage and readiness validate
      required_inputs:
      - workflow_id
      - exit_artifacts
      - open_obligations
      decision: block
      emitted_artifact: WorkflowExitReceipt
    exit_gate:
      validator: agentic/scripts/validate_workflow_contracts.py
      consumes: PaperReadinessDecision
      allowed:
      - validated
      - quarantined
      - rejected
      required_artifacts:
      - IntegratedPaperDraft
      - ExpansionValidation
      - PaperReadinessDecision
      open_obligations_policy: allow_declared
    handoffs:
    - when: new_theorem_requires_proof
      workflow: theorem_proof_delivery
      artifact_type: ProofQueueItem
      adapter: paper_readiness_to_proof_queue
    prohibitions:
    - No discovery marathon invocation
    - No conflation of finite asymptotic and continuum claims
    - No unresolved marker silently removed
    cost_profile: bounded
    profiles:
    - id: route_a
      version: 1.0.0
      visible_name: Route A Manuscript Attack
      aliases:
      - route-a
      - routea
      activation: opt_in
      target_scope:
      - manuscript:route-a
      steps:
      - id: routea_attack
        order: 10
        skill: routea-paper-attack-orchestrator
        mode: required
        when: null
        consumes:
        - PaperDraft
        produces:
        - RouteAAttackPlan
        on_failure: stop
      - id: routea_open_points
        order: 20
        skill: routea-open-point-orchestrator
        mode: required
        when: null
        consumes:
        - RouteAAttackPlan
        produces:
        - RouteAOpenPointPlan
        on_failure: stop
      - id: routea_symbolic_audit
        order: 30
        skill: routea-symbolic-cas-auditor
        mode: conditional
        when: exact_algebra_required
        consumes:
        - ResultCandidatePacket
        produces:
        - SymbolicCASAudit
        on_failure: quarantine
      - id: routea_integrate_result
        order: 40
        skill: routea-paper-result-integrator
        mode: required
        when: null
        consumes:
        - ResultCandidatePacket
        produces:
        - RouteAIntegratedResult
        on_failure: stop
      - id: routea_second_wave
        order: 50
        skill: routea-second-wave-manuscript-integrator
        mode: required
        when: null
        consumes:
        - RouteAIntegratedResult
        produces:
        - IntegratedPaperDraft
        on_failure: stop
      specialist_skills:
      - routea-geometric-collar-builder
      - routea-same-theory-normalization-certifier
      - routea-geometric-coefficient-extractor
      - routea-finite-margin-evaluator
      - routea-margin-endpoint-certifier
      - routea-endpoint-error-budget-certifier
      - routea-endpoint-local-integral-calculator
      - routea-same-theory-factorization-hunter
      - routea-collar-redesign-forger
      - routea-continuum-gap-gatekeeper
      specialist_output: ResultCandidatePacket
      specialist_after: routea_open_points
      validation_tail_start: certify_scope
      validation_tail_adapter:
        from: ResultCandidatePacket
        to: RefinedResultCandidates
  abducer.environment:
    python: pyproject.toml
    lock: uv.lock
    native_controls: .codex/config.toml
    native_controls_optional: true
    control_policy: prism_me/shared/references/codex-control-stack.md
  abducer.execution_boundary:
    status: specification_only
    notes: Source inspection only. Effects above deny native execution until a separately reviewed adapter
      exists.
  abducer.step_interfaces:
    orchestrate_elaboration: step_orchestrate_elaboration
    interpret_context: step_interpret_context
    extract_extensions: step_extract_extensions
    decompose_modules: step_decompose_modules
    plan_strategy: step_plan_strategy
    self_refine: step_self_refine
    certify_scope: step_certify_scope
    formalize_finite_object: step_formalize_finite_object
    derive_proof_packet: step_derive_proof_packet
    audit_prior_art: step_audit_prior_art
    integrate_narrative: step_integrate_narrative
    validate_expansion: step_validate_expansion
    gate_readiness: step_gate_readiness
# REUSE-IgnoreEnd
