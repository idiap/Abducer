interface:
  display_name: "Dimensional Symmetry Constraint Checker"
  short_description: "Reject qualitative claims that violate dimensions, symmetry, positivity, or invariance"
  default_prompt: "First restate the intent gate, exact inputs and artifacts in scope, required output shape, and any missing context explicitly; do not assume hidden repository context. When the task involves substantive inference, explicitly separate prompt/context defects from genuine mathematical difficulty: classify context_status as well-posed / partially-ill-posed / ill-posed, inference_status as determined / underdetermined / difficult-but-well-posed, give the smallest repair, and report qualified certainty both now and assuming a well-posed context, and when applicable emit a short Prompt/Inference Diagnosis block before the main result. Use $dimensional-symmetry-constraint-checker to test a relation against dimensions, symmetry, conservation, positivity, boundedness, verdict, failure modes, and validation handoff."
