        {"id":"narrate_literature_evolution","order":45,"skill":"target-literature-evolution-narrator","mode":"conditional","when":"source_bundle_contains_literature_history","consumes":["GroundedConjecture","SourceBundle"],"produces":["TargetLiteratureNarrative"],"on_failure":"quarantine"},
        {"id":"connect_proof","order":50,"skill":"kb-proof-connector","mode":"required","when":null,"consumes":["GroundedConjecture"],"produces":["ProofConnectionGraph"],"on_failure":"quarantine"},
        {"id":"evaluate_hypotheses","order":60,"skill":"kb-hypothesis-evaluator","mode":"conditional","when":"hypotheses_present","consumes":["ProofConnectionGraph"],"produces":["HypothesisAssessment"],"on_failure":"quarantine"},
        {"id":"audit_hubs","order":70,"skill":"hub-bias-auditor","mode":"required","when":null,"consumes":["ProofConnectionGraph"],"produces":["HubBiasAudit"],"on_failure":"stop"},
        {"id":"find_entrypoint","order":80,"skill":"kb-entrypoint-finder","mode":"required","when":null,"consumes":["ProofConnectionGraph","HubBiasAudit"],"produces":["EntrypointCandidates"],"on_failure":"stop"},
        {"id":"pathfind","order":90,"skill":"kb-entrypoint-pathfinder","mode":"required","when":null,"consumes":["EntrypointCandidates"],"produces":["ProofRouteCandidates"],"on_failure":"stop"},
        {"id":"audit_regime_shift","order":100,"skill":"regime-shift-auditor","mode":"conditional","when":"route_crosses_regime_or_model","consumes":["ProofRouteCandidates"],"produces":["RegimeShiftAudit"],"on_failure":"quarantine"},
        {"id":"hunt_counterexamples","order":110,"skill":"counterexample-hunter","mode":"required","when":null,"consumes":["ProofRouteCandidates"],"produces":["FalsificationPacket"],"on_failure":"stop"},
        {"id":"expert_handoff","order":120,"skill":"expert-handoff","mode":"required","when":null,"consumes":["ProofRouteCandidates","FalsificationPacket"],"produces":["ExpertRouteDossier"],"on_failure":"stop"}
      ],
      "hooks": [
        {"hook_id":"named-workflow-router","event":"UserPromptSubmit","phase":"activation","condition":"trigger matches","required_inputs":["prompt","target"],"decision":"recommend","emitted_artifact":"WorkflowRecommendation"},
        {"hook_id":"workflow-membership-policy","event":"PreSkillUse","phase":"steps","condition":"active workflow and step membership validate","required_inputs":["workflow_id","workflow_version","target","step_id","skill","conditional_evidence"],"decision":"block","emitted_artifact":"SkillAuthorization"},
        {"hook_id":"typed-output-policy","event":"PostSkillUse","phase":"steps","condition":"declared output and receipt validate","required_inputs":["workflow_id","step_id","artifact_type","epistemic_status","receipt"],"decision":"block","emitted_artifact":"SkillReceipt"},
        {"hook_id":"workflow-tool-policy","event":"PreToolUse","phase":"steps","condition":"path safety mutation and budget validate","required_inputs":["workflow_id","step_id","tool","target_path","mutation_class"],"decision":"block","emitted_artifact":"ToolAuthorization"},
