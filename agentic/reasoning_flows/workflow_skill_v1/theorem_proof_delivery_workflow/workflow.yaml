  gaps:
  - No workflow-skill/v1 host adapter is supplied. Native skill/hook/CLI interfaces exist, but payload
    materialization, guard evidence, execution effects and receipt translation are not qualified for this
    format.
  - Native control flow remains opaque; coverage is interface_only, not source-equivalence certification.
  - Named payload schemas validate the common envelope only; nominal artifact payloads and artifact_type
    discriminators are not refined by that schema.
  - Conditional/advisory skips, repeated ReviewFindingSet aggregation, exit obligations and handoff adapters
    are preserved verbatim, not executable v1 dataflow.
extensions:
  abducer.owner:
    path: skills/proof_delivery/proof-delivery-workflow-orchestrator/SKILL.md
  abducer.native_identity:
    id: theorem_proof_delivery
  abducer.native_contract:
    id: theorem_proof_delivery
    version: 1.0.0
    visible_name: Theorem Proof Delivery
    aliases:
    - theorem-proof-delivery
    - proof-delivery
    activation: conditional
    owner_skill: proof-delivery-workflow-orchestrator
    target_scope:
    - mathematical
    - p-vs-np
    trigger:
      all_of:
      - source_bound
      - target_bound
      - exact_theorem_statement
      any_of:
      - proof_queue_item_ready
      none_of:
      - ambiguous_quantifiers
      - unresolved_definition
    input_artifact:
      type: ProofQueueItem
      schema: agentic/spec/named_workflow_artifacts.schema.json
    steps:
    - id: orchestrate_delivery
      order: 10
      skill: proof-delivery-workflow-orchestrator
      mode: required
      when: null
      consumes:
      - ProofQueueItem
      produces:
      - ProofDeliveryPlan
      on_failure: stop
    - id: formalize_obligations
      order: 20
      skill: proof-obligation-formalizer
      mode: required
      when: null
      consumes:
      - ProofDeliveryPlan
      produces:
      - FormalProofObligations
      on_failure: stop
    - id: build_lemma_chain
      order: 30
      skill: lemma-chain-proof-builder
      mode: required
      when: null
      consumes:
      - FormalProofObligations
      produces:
      - LemmaChain
      on_failure: quarantine
    - id: split_gap_or_countermodel
      order: 40
      skill: proof-gap-countermodel-splitter
      mode: conditional
      when: lemma_blocked_or_false
      consumes:
      - LemmaChain
      produces:
      - ProofGapDecision
      on_failure: stop
    - id: control_pvsnp_inference
      order: 50
      skill: pvsnp-inference-quality-controller
      mode: conditional
      when: target == 'p-vs-np'
      consumes:
      - LemmaChain
      produces:
      - InferenceQualityDecision
      on_failure: stop
    - id: gate_proof
      order: 60
      skill: proof-quality-gatekeeper
      mode: validator_only
      when: null
      consumes:
      - LemmaChain
      produces:
      - ProofGateDecision
      on_failure: stop
    hooks:
    - hook_id: named-workflow-router
      event: UserPromptSubmit
      phase: activation
      condition: exact theorem trigger matches
      required_inputs:
      - prompt
      - target
      decision: recommend
      emitted_artifact: WorkflowRecommendation
    - hook_id: workflow-membership-policy
      event: PreSkillUse
      phase: steps
      condition: active workflow and step membership validate
      required_inputs:
      - workflow_id
      - workflow_version
      - target
      - step_id
      - skill
      - conditional_evidence
      decision: block
      emitted_artifact: SkillAuthorization
    - hook_id: typed-output-policy
      event: PostSkillUse
      phase: steps
      condition: declared output and receipt validate
      required_inputs:
      - workflow_id
      - step_id
      - artifact_type
      - epistemic_status
      - receipt
      decision: block
      emitted_artifact: SkillReceipt
    - hook_id: workflow-tool-policy
      event: PreToolUse
      phase: steps
      condition: path safety mutation and budget validate
      required_inputs:
      - workflow_id
      - step_id
      - tool
      - target_path
      - mutation_class
      decision: block
      emitted_artifact: ToolAuthorization
    - hook_id: workflow-exit-policy
      event: Stop
      phase: exit
      condition: proof gate and obligations validate
      required_inputs:
      - workflow_id
      - exit_artifacts
      - open_obligations
      decision: block
      emitted_artifact: WorkflowExitReceipt
    exit_gate:
      validator: agentic/scripts/validate_workflow_contracts.py
      consumes: ProofGateDecision
      allowed:
      - validated
      - quarantined
      - rejected
      required_artifacts:
      - ProofGateDecision
      - FormalProofObligations
      open_obligations_policy: allow_declared
    handoffs:
    - when: proof_accepted
      workflow: scientific_contribution_cultivation
      artifact_type: ResultAtlasSlice
      adapter: proof_gate_to_result_atlas_slice
    - when: failure_certificate_issued
      workflow: conceptual_hypothesis_exploration_loop
      artifact_type: ProofFailureCertificate
      adapter: proof_gap_to_failure_certificate
    prohibitions:
    - No circular lemma chains
    - No silent gap closure
    - No proof claim beyond the exact statement
    cost_profile: bounded
  abducer.environment:
    python: pyproject.toml
    lock: uv.lock
    native_controls: .codex/config.toml
    native_controls_optional: true
    control_policy: prism_me/shared/references/codex-control-stack.md
  abducer.execution_boundary:
    status: specification_only
    notes: Source inspection only. Effects above deny native execution until a separately reviewed adapter
      exists.
  abducer.step_interfaces:
    orchestrate_delivery: step_orchestrate_delivery
    formalize_obligations: step_formalize_obligations
    build_lemma_chain: step_build_lemma_chain
    split_gap_or_countermodel: step_split_gap_or_countermodel
    control_pvsnp_inference: step_control_pvsnp_inference
    gate_proof: step_gate_proof
