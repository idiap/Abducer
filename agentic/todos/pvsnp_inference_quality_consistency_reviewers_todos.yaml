    type: workflow_todo
    phase: consistency-review
    owner: skills/evaluation
    priority: high
    risk_class: meta_complexity_carrier_error
    title: Add a meta-complexity carrier reviewer
    intent: >
      Create `pvsnp-meta-complexity-carrier-reviewer` for MCSP, MKtP, truth
      table, row-hardness, and Kolmogorov-style branches, where the main risk
      is confusing aggregate or advice-selected hardness with target-language
