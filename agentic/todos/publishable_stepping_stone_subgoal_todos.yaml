    completed_utc: "2026-07-11T09:52:00Z"
    implementation_note: >
      Added `validate_publishable_stepping_stone_fixtures.py` and wired it into
      `agentic_check.py` to cover overpromotion and proper-promotion cases.
    intent: >
      Create deterministic fixtures that prevent future regressions.
    files:
      - tests/
      - agentic/scripts/validate_scientific_contribution_monitor.py
    implementation:
      - "Fixture A: high-scoring but prior-art-unknown quantitative obstruction; expected maturity `near_stepping_stone`, not publishable."
      - "Fixture B: route-specific no-go with theorem statement, proof sketch, prior-art boundary, and disqualifiers; expected maturity `publishable_handoff_ready`."
      - "Fixture C: interesting branch exploration with no claim statement; expected maturity `contribution_shaped` or lower."
      - "Fixture D: workflow-only improvement; expected not to count as scientific contribution unless it has external method value."
    validation:
      - "Run repository test command once pytest or equivalent runner is available."
      - "Also run a lightweight script-level validator so this does not depend only on pytest availability."

success_criteria:
