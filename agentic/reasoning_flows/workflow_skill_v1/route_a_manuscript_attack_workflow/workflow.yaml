schema_version: workflow-skill/v1
namespace: abducer
id: route_a_manuscript_attack_workflow
version: 1.0.0
kind: workflow
description: Draft interface projection of route_a; native execution and authority remain unchanged.
aliases:
- route_a
- route-a
- routea
lifecycle: draft
activation:
  mode: explicit
  prerequisites: []
types:
  IntegratedPaperDraft:
    schema: ../../../../agentic/spec/named_workflow_artifacts.schema.json
    representation: value
  PaperDraft:
    schema: ../../../../agentic/spec/named_workflow_artifacts.schema.json
    representation: value
  PaperReadinessDecision:
    schema: ../../../../agentic/spec/named_workflow_artifacts.schema.json
    representation: value
  ResultCandidatePacket:
    schema: ../../../../agentic/spec/named_workflow_artifacts.schema.json
    representation: value
  RouteAAttackPlan:
    schema: ../../../../agentic/spec/named_workflow_artifacts.schema.json
    representation: value
  RouteAIntegratedResult:
    schema: ../../../../agentic/spec/named_workflow_artifacts.schema.json
    representation: value
  RouteAOpenPointPlan:
    schema: ../../../../agentic/spec/named_workflow_artifacts.schema.json
    representation: value
  SymbolicCASAudit:
    schema: ../../../../agentic/spec/named_workflow_artifacts.schema.json
    representation: value
inputs:
  request:
    type: PaperDraft
outputs:
  result:
    type: PaperReadinessDecision
    value:
      ref: steps.native.outputs.result
operations:
  native_workflow:
    inputs:
      request:
        type: PaperDraft
    outputs:
      result:
        type: PaperReadinessDecision
    execution:
      mode: specification_only
      reason: No workflow-skill/v1 host adapter is supplied. Native skill/hook/CLI interfaces exist, but
        payload materialization, guard evidence, execution effects and receipt translation are not qualified
        for this format.
  step_routea_attack:
    inputs:
      PaperDraft:
        type: PaperDraft
    outputs:
      RouteAAttackPlan:
        type: RouteAAttackPlan
    execution:
      mode: specification_only
      reason: Native skill exists at skills/results_ellaboration/routea-paper-attack-orchestrator/SKILL.md;
        no typed v1 adapter. Source guards, role and failure remain in native_contract.
  step_routea_open_points:
    inputs:
      RouteAAttackPlan:
        type: RouteAAttackPlan
    outputs:
      RouteAOpenPointPlan:
        type: RouteAOpenPointPlan
    execution:
      mode: specification_only
      reason: Native skill exists at skills/results_ellaboration/routea-open-point-orchestrator/SKILL.md;
        no typed v1 adapter. Source guards, role and failure remain in native_contract.
  step_routea_symbolic_audit:
    inputs:
      ResultCandidatePacket:
        type: ResultCandidatePacket
    outputs:
      SymbolicCASAudit:
        type: SymbolicCASAudit
    execution:
      mode: specification_only
      reason: Native skill exists at skills/results_ellaboration/routea-symbolic-cas-auditor/SKILL.md;
        no typed v1 adapter. Source guards, role and failure remain in native_contract.
  step_routea_integrate_result:
    inputs:
      ResultCandidatePacket:
        type: ResultCandidatePacket
    outputs:
      RouteAIntegratedResult:
        type: RouteAIntegratedResult
    execution:
      mode: specification_only
      reason: Native skill exists at skills/results_ellaboration/routea-paper-result-integrator/SKILL.md;
        no typed v1 adapter. Source guards, role and failure remain in native_contract.
  step_routea_second_wave:
    inputs:
      RouteAIntegratedResult:
        type: RouteAIntegratedResult
    outputs:
      IntegratedPaperDraft:
        type: IntegratedPaperDraft
    execution:
      mode: specification_only
      reason: Native skill exists at skills/results_ellaboration/routea-second-wave-manuscript-integrator/SKILL.md;
        no typed v1 adapter. Source guards, role and failure remain in native_contract.
flow:
  kind: sequence
  steps:
  - id: native
    kind: call
    operation: native_workflow
    description: Opaque native workflow boundary; internal ordering, guards and handoffs are retained
      in abducer.native_contract.
    arguments:
      request:
        ref: inputs.request
    on_failure: blocked
policy:
  effects:
    filesystem:
      read:
      - native_sources
      - inputs
      write: []
    network: []
    external_write: []
  authority:
    allowed:
    - describe_native_interface
    forbidden:
    - execute_scientific_workflow
    - approve
    - prove
    - publish
    - promote
  limits:
    wall_time_seconds: 1800
    max_operation_calls: 1
  failure:
    default: blocked
    retry:
      max_attempts: 1
      retryable_codes: []
  resume:
    mode: none
    require_matching_definition_and_inputs: true
  claim_ceiling: Interface description only; no proof, scientific validity, runtime qualification, promotion
    or approval.
observability:
  receipts: required
  artifact_digests: sha256
  provenance: required
  events:
  - workflow_started
  - step_failed
  - workflow_completed
provenance:
  coverage: interface_only
  sources:
  - path: agentic/registries/named_workflow_contracts.yaml
    digest: sha256:a467750a969715f742cc330f21fef37f4004b76924650fd9a027c47af9447d77
