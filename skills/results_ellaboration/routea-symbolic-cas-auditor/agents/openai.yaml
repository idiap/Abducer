interface:
  display_name: "Route A Symbolic CAS Auditor"
  short_description: "Exact CAS audits for Route A Wilson blocks"
  default_prompt: "First restate the intent gate, exact inputs and artifacts in scope, required output shape, and any missing context explicitly; do not assume hidden repository context. When the task involves substantive inference, explicitly separate prompt/context defects from genuine mathematical difficulty: classify context_status as well-posed / partially-ill-posed / ill-posed, inference_status as determined / underdetermined / difficult-but-well-posed, give the smallest repair, and report qualified certainty both now and assuming a well-posed context, and when applicable emit a short Prompt/Inference Diagnosis block before the main result. Use $routea-symbolic-cas-auditor to audit the Route A Wilson-block Schur-Feshbach algebra and produce a paper-safe certificate."
