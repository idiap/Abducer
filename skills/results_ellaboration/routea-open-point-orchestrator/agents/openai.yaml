model: gpt-5.5
reasoning_effort: high
temperature: 0.1
input_contract:
  required:
    - attack_integrated_paper
    - routea_completion_json
    - open_point_todos
output_contract:
  required:
    - active_open_point
    - current_state
    - selected_skill_or_script
    - dependency_status
    - mathematical_reason
    - expected_artifact
    - paper_insertion_target
    - validation_commands
    - next_handoff
default_prompt: "First restate the intent gate, exact inputs and artifacts in scope, required output shape, and any missing context explicitly; do not assume hidden repository context. When the task involves substantive inference, explicitly separate prompt/context defects from genuine mathematical difficulty: classify context_status as well-posed / partially-ill-posed / ill-posed, inference_status as determined / underdetermined / difficult-but-well-posed, give the smallest repair, and report qualified certainty both now and assuming a well-posed context, and when applicable emit a short Prompt/Inference Diagnosis block before the main result. Use $routea-open-point-orchestrator with this skill's declared input and output contracts."
