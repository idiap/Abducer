# Optional Prism-core-shaped serialization of `SkillContractProfileSpec`.
#
# Use this file when a request needs a single, explicit contract profile for a
# skill. The template follows the current Prism core field names directly so it
# can be read as a normalized instance rather than a parallel dialect.

metadata:
  request_slug: "<request-slug>"
  skill_id: "<skill-id>"
  profile_id: "<skill-id>-contract-profile"
  core_schema: "SkillContractProfileSpec"
  optional: true
  status: "draft"
  last_updated: ""
  core_concept: "Explicit contract typing for one skill."
  intent: "Make evidence, claims, uncertainty, provenance, and validation rules machine-readable using the current core schema shape."

contract_profile:
  input_evidence_types:
    - port_id: ""
      semantic_types: []
      evidence_role: "primary"
      required: true
      description: ""
  output_contract:
    port_id: "analysis_artifact"
    schema_ref: null
    required_fields: []
    description: ""
  preconditions: []
  assumptions: []
  claim_policy:
    admissible_claim_types: []
    prohibited_claim_types: []
    claim_justification_required: true
  confidence_policy:
    required: true
    representation: "scalar"
    scale: "0-1"
    confidence_field: "confidence"
    require_uncertainty_explanation: true
    max_confidence_without_corroboration: null
    allow_absent_when_deterministic: false
  provenance_policy:
    emit_mode: "artifact"
    required_fields: []
    preserve_input_refs: true
    citation_field: null
    evidence_field: null
  validators:
    - check_id: ""
      kind: "schema"
      applies_to: []
      required: true
      notes: ""
  evaluators:
    - check_id: ""
      kind: "generative-eval"
      applies_to: []
      required: false
      notes: ""
  upstream_dependencies: []
  downstream_dependencies: []

notes: ""
