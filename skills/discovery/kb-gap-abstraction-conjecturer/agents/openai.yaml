interface:
  display_name: "KB Gap Abstraction Conjecturer"
  short_description: "Diagnose concept gaps and conjecture bridge-filling abstractions"
  default_prompt: "First restate the intent gate, exact inputs and artifacts in scope, required output shape, and any missing context explicitly; do not assume hidden repository context. When the task involves substantive inference, explicitly separate prompt/context defects from genuine mathematical difficulty: classify context_status as well-posed / partially-ill-posed / ill-posed, inference_status as determined / underdetermined / difficult-but-well-posed, give the smallest repair, and report qualified certainty both now and assuming a well-posed context, and when applicable emit a short Prompt/Inference Diagnosis block before the main result. Diagnose the highest-leverage theorem-pair gaps, restate the normalized source and target claims, conjecture typed bridge objects with theorem-shaped payoff claims, and mark any abstraction that merely renames the gap as `underspecified` rather than promoting it."



