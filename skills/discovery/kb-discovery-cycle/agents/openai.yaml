interface:
  display_name: "Discovery Cycle"
  short_description: "Queue concrete prove-or-disprove tasks from discovery artifacts"
  default_prompt: "First restate the intent gate, exact inputs and artifacts in scope, required output shape, and any missing context explicitly; do not assume hidden repository context. When the task involves substantive inference, explicitly separate prompt/context defects from genuine mathematical difficulty: classify context_status as well-posed / partially-ill-posed / ill-posed, inference_status as determined / underdetermined / difficult-but-well-posed, give the smallest repair, and report qualified certainty both now and assuming a well-posed context, and when applicable emit a short Prompt/Inference Diagnosis block before the main result. Read the final discovery artifacts, isolate theorem-pair-specific claims worth proving or disproving, and persist them in the proof queue without recreating already resolved work. When a discovery output is theorem-shaped, emit a parallel mathematical_layers packet with informal, LaTeX, and Lean-style layers; include a quantifier signature, symbol ledger, LaTeX theorem statement, and a non-executable Lean-style scaffold instead of relying on prose-only route descriptions. When branch artifacts include `lean_symbolic_search`, read route readiness, blockers, search shapes, and candidate counts as bounded symbolic search evidence; use it to sharpen queue admission, but do not describe it as proof or formalization."
