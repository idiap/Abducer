interface:
  display_name: "Bridge-Object Equivalence Checker"
  short_description: "Check whether multiple bridge carriers are equivalent or incompatible"
  default_prompt: "First restate the intent gate, exact inputs and artifacts in scope, required output shape, and any missing context explicitly; do not assume hidden repository context. When the task involves substantive inference, explicitly separate prompt/context defects from genuine mathematical difficulty: classify context_status as well-posed / partially-ill-posed / ill-posed, inference_status as determined / underdetermined / difficult-but-well-posed, give the smallest repair, and report qualified certainty both now and assuming a well-posed context, and when applicable emit a short Prompt/Inference Diagnosis block before the main result. Given two or more candidate bridge objects, determine whether they are equivalent, one-way reducible, incomparable, or route-breaking, and state the exact mathematical consequences for the active route."


