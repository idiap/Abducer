name: Naturals
domain: mathematical_concept
role: Counting numbers with addition and partial subtraction pressure.
signature:
  sorts: [Nat]
  operations:
    zero: Nat
    succ: Nat -> Nat
    add: Nat x Nat -> Nat
    sub: Nat x Nat -> Nat?
axioms_or_constraints:
  - PeanoAxioms
tasks:
  - name: closed_subtraction
    kind: construct
    goal: "forall a b: Nat, exists c: Nat, c = a - b"
    required_status: closed
    priority: critical
preservation:
  - addition_laws
  - order_laws
examples:
  - "0 + 1 = 1"
  - "2 + 3 = 5"
counterexamples:
  - "3 - 5 not in Nat"
allowed_operators:
  - GroupCompletion
