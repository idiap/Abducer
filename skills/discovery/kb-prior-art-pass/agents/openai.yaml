interface:
  display_name: "Prior-Art Pass"
  short_description: "Import decisive external theorem references into InformalMathLib and explain what they change"
  default_prompt: "First restate the intent gate, exact inputs and artifacts in scope, required output shape, and any missing context explicitly; do not assume hidden repository context. When the task involves substantive inference, explicitly separate prompt/context defects from genuine mathematical difficulty: classify context_status as well-posed / partially-ill-posed / ill-posed, inference_status as determined / underdetermined / difficult-but-well-posed, give the smallest repair, and report qualified certainty both now and assuming a well-posed context, and when applicable emit a short Prompt/Inference Diagnosis block before the main result. Run a targeted prior-art pass over the named missing lemmas or blocked routes, import only decisive external theorem-level references into InformalMathLib, and explain exactly what each imported reference changes in the current proof state."


