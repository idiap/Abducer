
version: "1.0"
role: "meaning-profiler"
tools:
  - "local-files-read"
  - "tdr-runtime"
budget:
  steps: 1
  wall_seconds: 60
stop:
  - "one SkillResult has been emitted"
  - "precondition is missing"
  - "budget is exhausted"
escalation: "none; return blocked when authority is missing"
canonical_write: false
