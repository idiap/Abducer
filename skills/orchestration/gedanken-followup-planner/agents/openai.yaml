interface:
  display_name: "Gedanken Follow-Up Planner"
  short_description: "Turn accepted thought-experiment insight into concrete follow-up cycle tasks"
  default_prompt: "First restate the intent gate, exact inputs and artifacts in scope, required output shape, and any missing context explicitly; do not assume hidden repository context. When the task involves substantive inference, explicitly separate prompt/context defects from genuine mathematical difficulty: classify context_status as well-posed / partially-ill-posed / ill-posed, inference_status as determined / underdetermined / difficult-but-well-posed, give the smallest repair, and report qualified certainty both now and assuming a well-posed context, and when applicable emit a short Prompt/Inference Diagnosis block before the main result. Use $gedanken-followup-planner to transform a validated Gedanken experiment into ranked follow-up tasks with success criteria, demotion criteria, required skills, and validation handoff."
