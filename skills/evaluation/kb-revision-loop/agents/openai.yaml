interface:
  display_name: "KB Revision Loop"
  short_description: "Generate ontology and representation repairs after loop stagnation"
  default_prompt: "First restate the intent gate, exact inputs and artifacts in scope, required output shape, and any missing context explicitly; do not assume hidden repository context. When the task involves substantive inference, explicitly separate prompt/context defects from genuine mathematical difficulty: classify context_status as well-posed / partially-ill-posed / ill-posed, inference_status as determined / underdetermined / difficult-but-well-posed, give the smallest repair, and report qualified certainty both now and assuming a well-posed context, and when applicable emit a short Prompt/Inference Diagnosis block before the main result. Given loop/coherence/hardness artifacts, synthesize priority concept-splitting, definition-repair, regime-switch, and re-encoding programs with success criteria."


