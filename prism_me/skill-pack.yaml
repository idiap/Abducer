version: 1
pack_id: prism-me
name: "Prism ME"
description: "Portable Prism-aligned skill pack for spec-driven agentic development in external repositories."
default_workspace_root: ".prism"
principles:
  - "Typed boundaries before prompt prose."
  - "Lifecycle stages are explicit and ordered."
  - "Primary outputs are durable artifacts; reasoning logs are sidecars."
  - "Preserve provenance and runtime boundaries for future Prism import."
  - "Map dependencies in Prism terms: uv bundles, runtime dependencies, reference KBs, backend profiles, and workspace mounts."
  - "Use a root to-do.md file as the live control surface for plan, active steps, and delivery status."
  - "Verification gates release claims."
  - "Systematic multi-persona review becomes due after every 50 committed edit or write code-generation cycles, remains available on demand, and is retained at the final release gate."
  - "Touched Python and Markdown files should be extensively annotated for core concept, intent, role, and usage."
  - "External code and skills should be harmonized through explicit source scoping, capability extraction, and Prism-shaped adapter planning."
  - "Testing should be systematic and extensive, combining deterministic tests with Codex-style generative validation and failure-to-regression loops."
artifacts:
  - artifact_id: "skill-coverage-checklist"
    path: ".prism/{request_slug}/00-skill-coverage-checklist.md"
    producer_skill: "prism-spec-orchestrator"
    required: true
  - artifact_id: "spec-packet"
    path: ".prism/{request_slug}/01-spec.md"
    producer_skill: "prism-spec-intake"
    required: true
  - artifact_id: "agent-contract"
