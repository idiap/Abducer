interface:
  display_name: "Discovery Governor"
  short_description: "Control discovery depth, identify major subresults, and score conjecture value"
  default_prompt: "First restate the intent gate, exact inputs and artifacts in scope, required output shape, and any missing context explicitly; do not assume hidden repository context. When the task involves substantive inference, explicitly separate prompt/context defects from genuine mathematical difficulty: classify context_status as well-posed / partially-ill-posed / ill-posed, inference_status as determined / underdetermined / difficult-but-well-posed, give the smallest repair, and report qualified certainty both now and assuming a well-posed context, and when applicable emit a short Prompt/Inference Diagnosis block before the main result. Audit the current discovery frontier, diagnose depth-first drift, decide which routes should be deepened or lateralized, identify which partial results already qualify as major contributions, and score the value of active conjectures using the epistemic rubric. Use `lean_symbolic_search` readiness modes and search-shape evidence when available to distinguish routes that need better typing from routes that have become genuinely symbolic-search-ready."

