schema_version: '1.0'
unsupported: reject
dimensions:
  integrity: [unchecked, digest_verified, invalid]
  epistemic: [exploratory, candidate, sourced, independently_supported, falsified, retracted, superseded]
  claim_level: [C0, C1, C2, C3, C4, C5, C6]
  workflow: [pending, running, blocked, quarantined, complete]
mappings:
  draft: {epistemic: exploratory, requires: []}
  conjectural: {epistemic: candidate, requires: []}
  sourced: {epistemic: sourced, requires: [resolved_primary_locator]}
  validated: {epistemic: candidate, requires: [authorized_independent_validation], maximum_without_evidence: candidate}
  falsified: {epistemic: falsified, sticky_negative: true}
  retracted: {epistemic: retracted, sticky_negative: true}
  superseded: {epistemic: superseded, sticky_negative: true}
rules:
  - A digest may change only integrity status.
  - C0-C6 measures domain claim scope and never implies proof status.
  - Workflow completion never raises epistemic status.
  - Negative status is retained in every successor trace and artifact.
