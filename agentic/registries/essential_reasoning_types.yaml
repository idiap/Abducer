  "reasoning_styles": [
    {
      "id": "abductive_discovery",
      "definition": "Form candidate explanations and expose them to consequence tracing and defeaters.",
      "composition": ["abductive_hypothesis_formation", "deductive_entailment", "contrastive_counterfactual_reasoning", "critical_refutational_testing", "evidential_status_calibration"],
      "required_guards": ["alternatives remain visible", "no candidate is promoted directly to established"]
    },
    {
      "id": "proof_search",
      "definition": "Propose a proof route, derive its consequences, and audit premises and transfer steps.",
      "composition": ["abductive_hypothesis_formation", "structural_analogy_transfer", "deductive_entailment", "critical_refutational_testing", "evidential_status_calibration"],
      "required_guards": ["premise provenance conserved", "transfer side conditions explicit"]
    },
    {
      "id": "theory_abstraction",
      "definition": "Generalize across cases and structures, synthesize a candidate account, and derive discriminating predictions.",
      "composition": ["inductive_generalization", "structural_analogy_transfer", "abductive_hypothesis_formation", "deductive_entailment", "critical_refutational_testing"],
      "required_guards": ["generalization base reported", "exceptions and boundary conditions retained"]
    },
    {
      "id": "model_mediated_inquiry",
      "definition": "Use bounded models and controlled contrasts to probe mechanisms without promoting model evidence beyond scope.",
      "composition": ["model_based_reasoning", "contrastive_counterfactual_reasoning", "inductive_generalization", "evidential_status_calibration"],
      "required_guards": ["idealization map explicit", "model-supported does not imply theorem or target fact"]
    }
  ]
