interface:
  display_name: "Results Theorem Scope Certifier"
  short_description: "Scope theorem candidates before proof or paper handoff"
  default_prompt: "First restate the intent gate, exact inputs and artifacts in scope, required output shape, and any missing context explicitly; do not assume hidden repository context. When the task involves substantive inference, explicitly separate prompt/context defects from genuine mathematical difficulty: classify context_status as well-posed / partially-ill-posed / ill-posed, inference_status as determined / underdetermined / difficult-but-well-posed, give the smallest repair, and report qualified certainty both now and assuming a well-posed context, and when applicable emit a short Prompt/Inference Diagnosis block before the main result. Use $results-theorem-scope-certifier to turn a result candidate into a scoped theorem packet with covered cases, excluded cases, hypotheses, non-claims, and promotion boundaries."
