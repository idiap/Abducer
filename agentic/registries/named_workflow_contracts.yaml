      ],
      "exit_gate": {"validator":"agentic/scripts/validate_workflow_contracts.py","consumes":"ExpertRouteDossier","allowed":["validated","quarantined"],"required_artifacts":["ExpertRouteDossier","FalsificationPacket","HubBiasAudit"],"open_obligations_policy":"allow_declared"},
      "handoffs": [{"when":"output_is_theorem_shaped","workflow":"theorem_proof_delivery","artifact_type":"ProofQueueItem","adapter":"expert_dossier_to_proof_queue"},{"when":"output_requires_conceptual_refinement","workflow":"conceptual_hypothesis_exploration_loop","artifact_type":"ExpertRouteDossier","adapter":"expert_dossier_to_legacy_conceptual_input"}],
      "prohibitions": ["No assertion without provenance and assertion license", "No route promotion without a falsifier or stop condition"], "cost_profile": "bounded"
    },
