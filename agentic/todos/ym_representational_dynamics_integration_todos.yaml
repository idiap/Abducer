    owner: agentic/reports/results_ellaboration
    priority: high
    risk_class: infinite-publication-recursion
    title: Select one bounded YM subgoal for publication consolidation or demotion
    intent: >
      Use the imported package to choose a meaningful local subgoal, complete it
      within a fixed cycle budget, or demote it with an explicit blocked lemma
      before returning to broader conceptual exploration.
    use_skills:
      - publishable-stepping-stone-subgoal-selector
      - ym-audit-frontier
      - proof-nontriviality-auditor
      - good-enough-paper-relevance-marker
    required_artifact:
