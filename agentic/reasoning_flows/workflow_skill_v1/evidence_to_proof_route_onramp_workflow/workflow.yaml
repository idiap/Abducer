        type: ProofConnectionGraph
    execution:
      mode: specification_only
      reason: Native skill exists at skills/discovery/kb-proof-connector/SKILL.md; no typed v1 adapter.
        Source guards, role and failure remain in native_contract.
  step_evaluate_hypotheses:
    inputs:
      ProofConnectionGraph:
        type: ProofConnectionGraph
    outputs:
