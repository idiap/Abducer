version: 1
title: Publishable stepping-stone subgoal detection
created_utc: "2026-07-11T09:07:00Z"
status: completed
created_at: "2026-07-11"
implementation_status:
  status: completed
  completed_at: "2026-07-11"
source_artifacts:
  monitor: agentic/reports/scientific_contribution_monitor/latest.json
  report: agentic/reports/discovery_marathon/full_timeline.html
  latex_sections: agentic/reports/timeline_latex_sections/latest.json
  fixture_validator: agentic/scripts/validate_publishable_stepping_stone_fixtures.py
context:
  problem: >
    Long-horizon discovery runs need a reliable mechanism for recognizing when a branch is close
    to a "big deal" subgoal: a publishable stepping-stone result that matters independently even
    though the main target remains open.
  current_limitation: >
    The existing scientific contribution monitor detects contribution-shaped outputs and high
    reward directions, but it can over-promote candidates because the scoring model does not
    sharply distinguish interesting route learning from a paper-level stepping-stone package.
    For example, a repeated quantitative obstruction can score as "good_enough_to_handoff" before
    prior-art boundaries, theorem statements, proof obligations, and validation artifacts are
    separated.
  design_principle: >
    A big-deal subgoal is not just a high-scoring branch. It is a bounded scientific object with
    a smallest honest claim, a clear audience, a known novelty boundary, an explicit proof or
    disproof burden, and a finite path to a paper note, lemma packet, negative-result note,
    benchmark/probe note, or conceptual-method note.

criteria:
  publishable_stepping_stone_definition:
    description: >
      A subgoal qualifies as a publishable stepping stone when it could be written as a scoped
      contribution whose value does not depend on solving the main problem.
    must_have:
      - "Named mathematical object: theorem, lemma, obstruction, falsifier, transfer inequality, carrier, benchmark/probe, or conceptual mechanism."
      - "Smallest honest claim that avoids overclaiming the main target."
      - "Explicit assumptions, validity regime, definitions, and model boundaries."
      - "Evidence basis: derivation, computation, counterexample, symbolic check, source-backed comparison, or falsifier."
      - "Novelty boundary against known literature or a concrete prior-art search obligation."
      - "Main-problem relevance: explains which bottleneck, route family, transfer obligation, or impossibility pressure it changes."
      - "Finite certification path with validators, proof obligations, prior-art tasks, and packaging artifacts."
      - "Overclaim boundary: what the result does not prove and what would be needed to connect it to the main target."
    must_not_have:
      - "Only a queue-management or workflow-improvement claim without external scientific content."
      - "A proxy lower bound or proxy theory that silently replaces the target."
      - "A contribution claim whose source assumption is already equivalent to the main theorem."
      - "An unbounded next step such as 'explore more' or 'continue the route' without a decisive test."
      - "Novelty asserted without prior-art boundary or rediscovery risk analysis."

  maturity_levels:
    contribution_shaped:
      meaning: >
        The branch has an independently meaningful object or obstruction, but it is not yet a
        publishable stepping stone.
      required_evidence:
        - "Object named."
        - "Smallest honest claim drafted."
        - "At least one target-relevance argument."
      forbidden_promotion:
        - "Do not hand off to paper until validation and prior-art gates are separated."
    near_stepping_stone:
      meaning: >
        The branch is close to a publishable sub-problem result; one or two bounded tasks could
        make it paper-note ready.
      required_evidence:
        - "Proof or calculation skeleton exists."
        - "Main disqualifiers are known."
        - "Prior-art search target is explicit."
        - "Validation task is finite and local."
      routing:
        - "Do not run broad marathon exploration; run bounded certification or paper-argument tasks."
    publishable_handoff_ready:
      meaning: >
        The candidate should stop consuming discovery budget and move to validation, prior-art,
        and manuscript packaging.
      required_evidence:
        - "Theorem/claim statement can be written in paper style."
        - "Evidence table or derivation supports the claim."
        - "Known limitations and non-claims are explicit."
        - "Prior-art boundary has been checked or is represented as a finite citation task."
        - "A paper skeleton can be produced without pipeline jargon."

todos:
  - id: PSS-001
    title: Add a three-state stepping-stone classifier
    status: resolved
    priority: critical
    result_artifact: agentic/reports/scientific_contribution_monitor/latest.json
    use_skills:
      - scientific-contribution-detector
      - contribution-oriented-subgoal-manager
    acceptance_criteria:
      - "Candidates expose contribution_shaped, near_stepping_stone, or publishable_handoff_ready maturity."
      - "good_enough_to_handoff is only assigned to publishable_handoff_ready candidates."
    failure_modes:
      - "A high-scoring branch is promoted to paper handoff without stepping-stone maturity."
    completed_utc: "2026-07-11T09:52:00Z"
    implementation_note: >
      Implemented `stepping_stone_maturity`, backward-compatible statuses,
      missing-to-publishable fields, paper-note shape, certification blockers,
      and separate monitor metrics.
    intent: >
      Replace the binary-ish "good_enough_to_handoff" promotion with a three-state classifier:
      contribution_shaped, near_stepping_stone, and publishable_handoff_ready.
    files:
      - agentic/scripts/build_scientific_contribution_monitor.py
      - agentic/scripts/validate_scientific_contribution_monitor.py
      - skills/evaluation/scientific-contribution-detector/SKILL.md
      - skills/evaluation/paper-contribution-readiness-judge/SKILL.md
    implementation:
      - "Add `stepping_stone_maturity` to each candidate."
      - "Keep existing `status` for backward compatibility, but make `good_enough_to_handoff` require publishable_handoff_ready maturity."
      - "Add fields `missing_to_publishable`, `paper_note_shape`, and `certification_blockers`."
      - "Ensure monitor metrics separately count contribution-shaped candidates and publishable handoff candidates."
    validation:
      - "Run `python agentic/scripts/build_scientific_contribution_monitor.py`."
      - "Run `python agentic/scripts/validate_scientific_contribution_monitor.py`."
      - "Check that repeated P vs NP quantitative-obstruction candidates are not automatically publishable unless prior-art and proof-shape gates are met."

