interface:
  display_name: "KB Proof Connector"
  short_description: "Find high-impact proof intervention points in a KB"
  default_prompt: "First restate the intent gate, exact inputs and artifacts in scope, required output shape, and any missing context explicitly; do not assume hidden repository context. When the task involves substantive inference, explicitly separate prompt/context defects from genuine mathematical difficulty: classify context_status as well-posed / partially-ill-posed / ill-posed, inference_status as determined / underdetermined / difficult-but-well-posed, give the smallest repair, and report qualified certainty both now and assuming a well-posed context, and when applicable emit a short Prompt/Inference Diagnosis block before the main result. Analyze this KB as a relational proof graph, separate graph leverage from mathematical leverage, penalize theorem-empty hubs, propose only links with a theorem-pair-specific claim, record false-positive central links, and output an abductive loop plan."


