interface:
  display_name: "Reflective Conceptual Discovery"
  short_description: "Drive theory-first reflective concept discovery"
  default_prompt: "First restate the intent gate, exact inputs and artifacts in scope, required output shape, and any missing context explicitly; do not assume hidden repository context. When the task involves substantive inference, explicitly separate prompt/context defects from genuine mathematical difficulty: classify context_status as well-posed / partially-ill-posed / ill-posed, inference_status as determined / underdetermined / difficult-but-well-posed, give the smallest repair, and report qualified certainty both now and assuming a well-posed context, and when applicable emit a short Prompt/Inference Diagnosis block before the main result. Use $reflective-conceptual-discovery to develop and blindly compare plural theory systems, invoking Category Theory or HoTT only with exact target and physics handbacks."
