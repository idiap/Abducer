[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "higher-abductive-theory-discovery"
version = "0.1.0"
description = "A relevance-guided, category-aware agentic reasoner for theory discovery"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Theory Discovery Project"}]
dependencies = []

[project.scripts]
tdr = "tdr.api.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

