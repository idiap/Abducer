    title: Convert the acceptance critique into a theorem-by-theorem objection ledger.
    intent: >
      Parse the acceptance assessment into concrete objection cards grouped by
      theorem, lemma, and paper section. Each card must say what is wrong or
      missing, which claim it blocks, and what artifact would close it.
    use_skills:
      - pvsnp-inference-quality-controller
      - pvsnp-proof-derivation-builder
      - scientific-contribution-detector
      - entailment-gap-auditor
    required_artifact:
