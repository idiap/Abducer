interface:
  display_name: "KB Proof Sketcher"
  short_description: "Outline structured proof sketches for prioritized conjectures"
  default_prompt: "First restate the intent gate, exact inputs and artifacts in scope, required output shape, and any missing context explicitly; do not assume hidden repository context. When the task involves substantive inference, explicitly separate prompt/context defects from genuine mathematical difficulty: classify context_status as well-posed / partially-ill-posed / ill-posed, inference_status as determined / underdetermined / difficult-but-well-posed, give the smallest repair, and report qualified certainty both now and assuming a well-posed context, and when applicable emit a short Prompt/Inference Diagnosis block before the main result. Run proof-sketch mode over the KB artifacts, assess each top conjectured bridge object with both a constructive proof route and an impossibility-style route, decide whether the negative route is constructive-first, parallel, or negative-first under an explicit epistemic heuristic, then emit explicit obligations, lemma outlines, barrier checkpoints, counterfactual probes, abort conditions, and a structured negative program containing the negated claim, contradiction target, forbidden outcome, theorem-shaped impossibility claim, and the heuristic rationale."



