version: 1
title: Good-enough paper relevance markers
created_at: "2026-07-11"
implementation_status:
  status: completed
  completed_at: "2026-07-11"
source_artifacts:
  monitor: agentic/reports/scientific_contribution_monitor/latest.json
  report: agentic/reports/discovery_marathon/full_timeline.html
  marker_fixture_validator: agentic/scripts/validate_paper_relevance_marker_fixtures.py
context:
  problem: >
    Publishable stepping-stone detection needs clearer markers of why a candidate is relevant to
    establishing a good enough paper, especially in the P vs NP problem space. A high score or
    interesting branch is insufficient unless it improves conceptual depth, novelty, unblocking
    power, applicability, and understanding in target-specific terms.
  p_vs_np_specificity: >
    For P vs NP, paper relevance must be expressed through source carriers/languages, target
    classes, circuit models, transfer inequalities, quantifier regimes, nonuniform/advice leakage,
    barrier status, MCSP/MKtP or proof-complexity interfaces, and exact route-level no-go or bridge
    obligations.
criteria:
  good_enough_paper_relevance:
    dimensions:
      - conceptual_depth
      - conceptual_novelty
      - unblocking_power
      - applicability
      - understanding_gain
    rule: >
      A candidate is good enough for paper shaping only when every marker is at least adequate,
      decisive markers are strong, and hard gates prevent overclaiming. If hard gates remain open,
      the strongest status is strong_relevance_certification_pending, not paper_relevance_ready.
todos:
  - id: GEPR-001
    type: workflow_todo
    phase: scientific-contribution-monitor
    owner: agentic/scripts
    priority: critical
    risk_class: paper_overpromotion_risk
    title: Define target-specific good-enough paper relevance criteria
    intent: >
      Add explicit criteria for conceptual depth, conceptual novelty, unblocking power,
      applicability, and understanding gain, with P vs NP-specific definitions.
    use_skills:
      - paper-contribution-readiness-judge
      - main-problem-alignment-auditor
    required_artifact:
      - agentic/scripts/target_profiles.py
    acceptance_criteria:
      - "P vs NP criteria mention source carriers/languages, target classes, circuit models, transfer inequalities, quantifiers, advice/nonuniformity, and barrier status."
      - "Generic fallback criteria exist for future targets."
    blocked_by: []
    evidence:
      - agentic/scripts/target_profiles.py
    review_date: "2026-07-11"
    failure_modes:
      - "Criteria stay generic and do not constrain P vs NP paper relevance."
    status: resolved

