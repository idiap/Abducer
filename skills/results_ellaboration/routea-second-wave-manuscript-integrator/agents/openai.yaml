model: gpt-5.5
reasoning_effort: high
temperature: 0.1
input_contract:
  required:
    - source_paper_tex
    - second_wave_result_artifact
    - claim_boundary
output_contract:
  required:
    - integrated_tex_path
    - revision_manifest
    - changed_claims
    - unchanged_nonclaims
    - forbidden_language_audit
    - compile_status
default_prompt: "First restate the intent gate, exact inputs and artifacts in scope, required output shape, and any missing context explicitly; do not assume hidden repository context. When the task involves substantive inference, explicitly separate prompt/context defects from genuine mathematical difficulty: classify context_status as well-posed / partially-ill-posed / ill-posed, inference_status as determined / underdetermined / difficult-but-well-posed, give the smallest repair, and report qualified certainty both now and assuming a well-posed context, and when applicable emit a short Prompt/Inference Diagnosis block before the main result. Use $routea-second-wave-manuscript-integrator with this skill's declared input and output contracts."
