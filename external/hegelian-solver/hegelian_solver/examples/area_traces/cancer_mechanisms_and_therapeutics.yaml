area_conceptual_trace:
  area: Evolution of the understanding of cancer mechanisms and emerging therapeutic interventions
  scope_note: >
    Scoped to the conceptual/mechanistic history of oncology research in humans: the shifts
    in what counted as an explanation of "what cancer is" and which therapeutic strategies
    those shifts made conceivable. Not a comprehensive history of every cancer type, every
    drug, or every clinical trial; not a guideline document. Built with
    hegelian-area-concept-trace-builder; targeted web search was used only for the precise
    dates, named discoveries, and approval years below, not for general background.
  key_concepts:
    - concept_id: tissue_level_disease_model
      name: Cancer as a tissue/cellular-growth disease, no general mechanism
      approx_period: 19th century - early 20th century
      summary: >
        Cancer was understood and classified by its tissue of origin and clinical behavior
        (a local, abnormal, uncontrolled tissue growth), not by any shared causal mechanism.
        Rudolf Virchow's "chronic irritation" theory proposed that persistent tissue
        irritation provoked the abnormal growth, but there was no concept of a cancer "gene"
        or shared molecular pathway across tumor types.
      shift_from_previous: null
      informal_evidence:
        - claim: Virchow proposed a chronic-irritation theory of carcinogenesis in the 19th century.
          source_note: general historical consensus in oncology history texts; exact year and
            precise wording not independently checked in this pass.
          confidence: medium
          web_search_used: false
      contested_or_uncertain:
        - Exact dating and the degree to which Virchow's theory anticipated later
          inflammation-and-cancer work versus being a distinct, superseded idea is a
          historiography question not resolved here.

    - concept_id: viral_oncogene_discovery
      name: A virus alone can transmit a tumor (Rous sarcoma virus)
      approx_period: "1911"
      summary: >
        Peyton Rous showed that a cell-free filtrate from a chicken sarcoma could transmit
        the tumor to a healthy bird, establishing that a transmissible agent (later
        identified as a retrovirus) could cause cancer. The finding was largely set aside
        for decades because it didn't fit prevailing ideas about most (especially human)
        cancers, until molecular biology tools matured enough to ask what the viral agent
        was actually doing to the cell.
      shift_from_previous: >
        From "cancer is an intrinsic tissue abnormality" to "an external transmissible agent
        can be sufficient to cause a tumor" — the first concrete causal mechanism, even
        though its generality was unclear for half a century.
      informal_evidence:
        - claim: Rous demonstrated cell-free transmission of a chicken sarcoma in 1911.
          source_note: general consensus, standard textbook/history-of-oncology account; not
            independently re-verified by search in this pass.
          confidence: medium
          web_search_used: false
      contested_or_uncertain: []

    - concept_id: cellular_protooncogene
      name: Cancer genes are corrupted versions of normal growth-control genes
      approx_period: "1976 finding; 1989 Nobel Prize"
      summary: >
        J. Michael Bishop and Harold Varmus showed that the Rous sarcoma virus's
        cancer-causing gene (v-src) was not a unique viral invention but a captured and
        altered copy of a normal cellular gene (c-src) present in healthy animal genomes,
        where it normally helps control cell growth and division. This reframed oncogenes as
        mutated or dysregulated versions of the cell's own machinery, not foreign agents.
      shift_from_previous: >
        From "an external transmissible agent causes cancer" to "cancer arises from
        corruption of the cell's own growth-control genes" — the viral case turned out to be
        a special, informative route into a general cell-intrinsic mechanism.
      informal_evidence:
        - claim: >
            Bishop and Varmus received the 1989 Nobel Prize in Physiology or Medicine "for
            their discovery of the cellular origin of retroviral oncogenes," based on
            identifying cellular proto-oncogene c-src as the source of viral v-src.
          source_note: NobelPrize.org press release/summary for the 1989 prize.
          confidence: high
          web_search_used: true
      contested_or_uncertain: []

    - concept_id: tumor_suppressor_two_hit
      name: Loss of growth-restraining genes is a second route to cancer
      approx_period: "1971 hypothesis; gene cloned in the 1980s"
      summary: >
        Alfred Knudson's statistical analysis of inherited versus sporadic retinoblastoma
        led him to propose the "two-hit hypothesis": both copies of a single gene (later
        identified as RB1) must be inactivated for a tumor to form — one hit inherited and
        one acquired in hereditary cases, both acquired in sporadic cases. This established
        loss-of-function in growth-restraining ("tumor suppressor") genes as a second,
        distinct causal route to cancer alongside oncogene activation.
      shift_from_previous: >
        From "cancer genes are abnormally activated growth-promoters" to "cancer can equally
        arise from the loss of genes that normally restrain growth" — gain-of-function and
        loss-of-function became two complementary causal categories instead of one.
      informal_evidence:
        - claim: Knudson proposed the two-hit hypothesis in 1971 from retinoblastoma incidence data.
          source_note: Wikipedia "Two-hit hypothesis" summary, cross-consistent with the
            Molecular Biology of the Cell retrospective "The two-hit theory hits 50".
          confidence: high
          web_search_used: true
      contested_or_uncertain: []

    - concept_id: multistep_genetic_progression
      name: Cancer as a sequential accumulation of mutations, not a single lesion
      approx_period: "1990 (colorectal model)"
      summary: >
        Eric Fearon and Bert Vogelstein proposed a genetic model in which colorectal cancer
        develops through an ordered sequence of mutations — APC inactivation, then KRAS
        activation, then later TP53 and other pathway changes — driving a normal epithelial
        cell through benign adenoma to malignant carcinoma. This gave oncogenes and tumor
        suppressors a developmental sequence rather than treating each as an isolated lesion.
      shift_from_previous: >
        From "an oncogene or a tumor suppressor loss causes cancer" to "cancer is the
        accumulated, ordered product of multiple such events over time" — turning a list of
        causal gene categories into a stepwise process model.
      informal_evidence:
        - claim: >
            Fearon & Vogelstein, "A genetic model for colorectal tumorigenesis," Cell 61
            (1990): 759-767, proposed the multistep APC -> KRAS -> TP53 progression model
            for colorectal cancer.
          source_note: Cell journal citation and summary, cross-confirmed via Johns Hopkins
            publication record.
          confidence: high
          web_search_used: true
      contested_or_uncertain:
        - The colorectal sequence became a paradigm cited for solid tumors generally; how
          well it generalizes (order and necessity of specific mutations) to most other
          cancer types is a separate, less settled claim not verified here.

    - concept_id: angiogenesis_dependence
      name: Tumors depend on recruiting their own blood supply
      approx_period: "1971 hypothesis; VEGF identified 1980s-90s; first drug approved 2004"
      summary: >
        Judah Folkman proposed that tumors cannot grow beyond a few millimeters without
        recruiting new blood vessels, and that they secrete a diffusible "tumor angiogenesis
        factor" to do so. The factor was later substantially identified with vascular
        endothelial growth factor (VEGF, Napoleone Ferrara's lab), validating the hypothesis
        and motivating an anti-angiogenic drug-development program.
      shift_from_previous: >
        From "cancer mechanism lives entirely inside the tumor cell's genome" to "a tumor's
        growth also depends on its relationship to host tissue (vasculature)" — the first
        major mechanistic move outward from cell-intrinsic genetics to tumor-host interaction.
      informal_evidence:
        - claim: Folkman published the tumor angiogenesis hypothesis in NEJM in 1971, naming a "tumor angiogenesis factor."
          source_note: secondary historical summaries citing the 1971 NEJM paper; not read in primary form in this pass.
          confidence: medium
          web_search_used: true
        - claim: Bevacizumab (Avastin) received its first FDA approval in 2004 for metastatic colorectal cancer, the first clinically approved angiogenesis inhibitor.
          source_note: Bevacizumab history summary cross-consistent across multiple sources found by search.
          confidence: high
          web_search_used: true
      contested_or_uncertain: []

    - concept_id: hallmarks_organizing_framework
      name: A compact organizing framework unifies the by-then-sprawling mechanisms
      approx_period: "2000; updated 2011"
      summary: >
        By 2000 the field had accumulated many distinct mechanistic findings (oncogenes,
        tumor suppressors, apoptosis evasion, angiogenesis, invasion/metastasis) without a
        single organizing structure. Douglas Hanahan and Robert Weinberg's "The Hallmarks of
        Cancer" (Cell, 2000) proposed six shared capabilities that essentially all cancers
        acquire; their 2011 update "Hallmarks of Cancer: The Next Generation" added genome
        instability and tumor-promoting inflammation as enabling characteristics and
        deregulated metabolism and immune evasion as further hallmarks.
      shift_from_previous: >
        From "a growing list of individually discovered mechanisms" to "a small, unifying
        causal structure that organizes the mechanisms and can guide where to look for new
        drug targets" — a framework shift, not a new mechanism by itself.
      informal_evidence:
        - claim: >
            Hanahan & Weinberg published "The Hallmarks of Cancer" in Cell in January 2000
            (six original hallmarks), and "Hallmarks of Cancer: The Next Generation" in Cell
            in 2011 (adding genome instability, inflammation, metabolic reprogramming, and
            immune evasion).
          source_note: Cell journal records and secondary summaries (Wikipedia, PMC
            retrospectives) cross-consistent on both publication years and content.
          confidence: high
          web_search_used: true
      contested_or_uncertain:
        - >
          A further 2022 update ("Hallmarks of Cancer: New Dimensions") reportedly proposes
          additional hallmarks (e.g. non-mutational epigenetic reprogramming, polymorphic
          microbiomes, senescent cells); this trace flags it as an open thread rather than a
          settled addition, since it was not independently verified in this pass.

    - concept_id: molecularly_targeted_therapy
      name: A precise molecular lesion can be targeted directly by a small molecule
      approx_period: "Philadelphia chromosome 1960; BCR-ABL identified 1980s; imatinib approved 2001"
      summary: >
        Chronic myeloid leukemia's characteristic "Philadelphia chromosome" (a cytogenetic
        abnormality) was eventually shown to produce a constitutively active BCR-ABL fusion
        kinase. Imatinib (Gleevec) was designed to inhibit that specific kinase and received
        FDA approval in May 2001 for CML, becoming the first major proof that identifying a
        tumor's specific molecular driver could be turned directly into a targeted, far
        less toxic therapy than conventional chemotherapy.
      shift_from_previous: >
        From "mechanistic understanding explains why cancer happens" to "mechanistic
        understanding of one specific lesion can be turned directly into a therapy targeted
        at that lesion" — the field's first strong validation that the oncogene-mechanism
        research program pays off clinically, not just explanatorily.
      informal_evidence:
        - claim: Imatinib mesylate (Gleevec) received FDA approval on May 10, 2001, for chronic myeloid leukemia.
          source_note: Drugs.com FDA approval history page, cross-consistent with NCI's "How
            Gleevec Transformed Leukemia Treatment" account.
          confidence: high
          web_search_used: true
        - claim: The Philadelphia chromosome was first described in CML in 1960 by Nowell and Hungerford, with the BCR-ABL fusion identified molecularly in the 1980s.
          source_note: general historical consensus in oncology history accounts; not independently re-checked by search in this pass.
          confidence: medium
          web_search_used: false
      contested_or_uncertain: []

    - concept_id: immune_checkpoint_discovery
      name: Cancer also actively evades a host immune system that can recognize it
      approx_period: "CTLA-4 work early-mid 1990s; PD-1 discovered 1992; therapies approved 2011 and 2014; 2018 Nobel Prize"
      summary: >
        James Allison showed that blocking the inhibitory receptor CTLA-4 released an
        antitumor immune response; Tasuku Honjo discovered the PD-1 receptor in 1992 and
        later showed it also inhibits immune responses. Both findings reframed cancer as not
        only a cell-intrinsic genetic disease but also a disease that must actively suppress
        or evade a host immune system that is, in principle, capable of recognizing and
        attacking it. This led to checkpoint-inhibitor drugs: ipilimumab (anti-CTLA-4) and
        pembrolizumab/nivolumab (anti-PD-1), the latter pair approved for advanced melanoma
        in 2014.
      shift_from_previous: >
        From "the relevant causal story is inside the tumor cell (and its vasculature)" to
        "the relevant causal story also includes whether and how the host immune system is
        being held back from acting on the tumor" — adding a second class of actor (the host
        immune system) to the mechanistic picture.
      informal_evidence:
        - claim: >
            Allison and Honjo received the 2018 Nobel Prize in Physiology or Medicine for
            discovering CTLA-4 and PD-1 checkpoint biology respectively; pembrolizumab and
            nivolumab were both approved for advanced melanoma in 2014.
          source_note: NobelPrize.org 2018 press release and advanced information page,
            cross-consistent with OncLive and Cancer Research UK summaries.
          confidence: high
          web_search_used: true
      contested_or_uncertain:
        - Exact priority/sequencing between the CTLA-4 and PD-1 research programs, and which
          specific early papers should be credited as "the" discovery moment, involve
          historiographic nuance not resolved by this pass.

    - concept_id: genomic_landscape_era
      name: Tumors are combinatorially heterogeneous, not single-pathway diseases
      approx_period: "mid-2000s onward (The Cancer Genome Atlas and next-generation sequencing)"
      summary: >
        Large-scale sequencing initiatives (notably The Cancer Genome Atlas, a US
        NIH/NCI-led effort begun in the mid-2000s) and the broader adoption of
        next-generation sequencing revealed that tumors carry far more varied mutational
        landscapes, mutational signatures, and intratumor heterogeneity than the earlier
        small-paradigm-gene picture suggested, motivating clonal-evolution models of cancer
        progression and resistance.
      shift_from_previous: >
        From "a small number of paradigm genes and pathways explain a cancer type" to "each
        tumor (and each region within a tumor) carries a combinatorial, evolving mutational
        landscape" — a move from a tractable causal story to a population-genetics-like,
        evolutionary one.
      informal_evidence:
        - claim: The Cancer Genome Atlas was a large-scale NIH/NCI genomic characterization
            effort begun in the mid-2000s.
          source_note: general consensus in cancer genomics literature; exact launch year and
            programmatic details not independently re-checked by search in this pass.
          confidence: medium
          web_search_used: false
      contested_or_uncertain:
        - Whether intratumor heterogeneity is better described by a branching clonal-evolution
          model or a hierarchical cancer-stem-cell model (or some combination) remains an
          active research question, not a settled fact, and is preserved here as an open
          thread rather than resolved.

    - concept_id: engineered_cell_therapy
      name: Engineer the patient's own immune cells to directly target a tumor antigen
      approx_period: "platform developed 2000s-2010s; first FDA approval August 2017"
      summary: >
        Chimeric antigen receptor (CAR) T-cell therapy genetically engineers a patient's own
        T cells to express a receptor that directly recognizes a tumor surface antigen (e.g.
        CD19 on B-cell malignancies). Tisagenlecleucel (Kymriah) received FDA approval on
        August 30, 2017, for relapsed/refractory pediatric and young-adult B-cell acute
        lymphoblastic leukemia — the first FDA-approved CAR-T therapy and the first
        FDA-approved gene therapy of any kind.
      shift_from_previous: >
        From "find a host immune mechanism and unblock it" or "find a molecular lesion and
        inhibit it with a drug" to "directly engineer a cellular product that combines
        precise molecular targeting (the CAR's antigen-recognition domain) with the host
        immune system's own effector machinery (the T cell)" — a synthesis of the
        molecular-targeting and immune-mechanism lines of understanding into one
        therapeutic platform.
      informal_evidence:
        - claim: >
            Tisagenlecleucel (Kymriah) received FDA approval on August 30, 2017, as the first
            FDA-approved CAR-T cell therapy and the first FDA-approved gene therapy, for
            relapsed/refractory B-cell precursor ALL in patients up to age 25.
          source_note: FDA.gov approval announcement, cross-consistent with Novartis press
            release and AACR Cancer Discovery coverage.
          confidence: high
          web_search_used: true
      contested_or_uncertain: []

  open_threads:
    - >
      Whether the 2022 "Hallmarks of Cancer: New Dimensions" proposed additions (e.g.
      non-mutational epigenetic reprogramming, polymorphic microbiomes, senescent cells) are
      broadly accepted as canon, or are still being assessed by the field, was not resolved
      in this pass.
    - The clonal-evolution versus cancer-stem-cell debate over intratumor heterogeneity is
      live and unresolved; this trace preserves it as a branch rather than picking a side.
    - Mechanisms of acquired resistance to targeted therapy, immunotherapy, and CAR-T (e.g.
      antigen loss, clonal selection under treatment pressure) are an active research area
      this trace only gestures at via "genomic_landscape_era" rather than tracing in detail.
    - >
      Early-era claims (Virchow's chronic-irritation theory, Rous's exact 1911 dating, TCGA's
      precise launch year, the Philadelphia chromosome's 1960 dating) were drafted from
      general historical consensus and were not independently re-verified by targeted search
      in this pass; they are marked confidence medium and web_search_used false above rather
      than presented with false precision.
  recommended_next_step: retrospective_evolution_formalizer
  assumptions:
    - >
      "Evolution of understanding" is read as the conceptual/mechanistic history of oncology
      research (what counted as an explanation, and when), not a comprehensive
      clinical-trial-by-clinical-trial or cancer-type-by-cancer-type history.
    - >
      "Emerging therapeutic interventions" is read as therapies whose existence depended on a
      specific prior mechanistic discovery (a representative, not exhaustive, set), so that
      each entry pairs a shift in mechanistic understanding with what it made
      therapeutically conceivable.
  unknowns:
    - >
      Precise dates and primary-source details for entries marked web_search_used false
      above were not independently verified in this pass.
    - How the field will eventually settle the clonal-evolution/cancer-stem-cell question and
      the 2022 hallmarks-update status are open empirical and sociological questions, not
      knowable from this kind of trace alone.
