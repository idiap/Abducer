interface:
  display_name: "Work Loop"
  short_description: "Alternate discovery and prove cycles with a stop-aware outer loop"
  default_prompt: "First restate the intent gate, exact inputs and artifacts in scope, required output shape, and any missing context explicitly; do not assume hidden repository context. When the task involves substantive inference, explicitly separate prompt/context defects from genuine mathematical difficulty: classify context_status as well-posed / partially-ill-posed / ill-posed, inference_status as determined / underdetermined / difficult-but-well-posed, give the smallest repair, and report qualified certainty both now and assuming a well-posed context, and when applicable emit a short Prompt/Inference Diagnosis block before the main result. Run one outer-loop work cycle for the current problem: refresh the proof plausibility report, execute exactly one discovery or prove phase, account for proof debt and revisit penalties, explain why another cycle is or is not justified, persist the updated work state, and stop early if the current artifacts already support a plausible solution to the main conjecture. When discovery runs, surface `lean_symbolic_search` diagnostics separately from mathematical blockers so Lean/Lake tool failures, packet-typing failures, and genuine theorem obstacles are not conflated."

