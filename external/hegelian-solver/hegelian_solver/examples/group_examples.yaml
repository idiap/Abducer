name: GroupLikeExamples
domain: mathematical_concept
role: Several structures share associative composition, identity, and inverse.
signature:
  operations:
    op: G x G -> G
    identity: G
    inverse: G -> G
axioms_or_constraints:
  - associativity
  - identity_laws
  - inverse_laws
examples:
  - "Integers under addition"
  - "Permutation composition"
  - "Invertible matrices under multiplication"
  - "Polygon symmetries"
tasks:
  - name: cancellation_transfer
    kind: abstract
    goal: "prove cancellation once and transfer to all examples"
preservation:
  - example_specific_operations
