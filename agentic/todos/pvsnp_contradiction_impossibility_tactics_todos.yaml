    phase: negative_tactic_validation
    owner: agentic/scripts/validate_pvsnp_negative_tactics.py
    priority: high
    risk_class: validation_control
    title: Add a validator for P vs NP negative-tactic decisions.
    intent: >
      Validate that contradiction and impossibility decisions are theorem-shaped,
      scoped, target-preserving, and not merely rhetorical. The validator should
      fail on vague barrier labels, missing escape conditions, absent target
      class, or missing symbolic/qualitative audit handoff.
