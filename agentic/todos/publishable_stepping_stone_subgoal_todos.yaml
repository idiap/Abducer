  - "Every publishable candidate has hard gates, prior-art boundary, disqualifier tests, and paper note shape."
  - "The next queue can pause broad exploration when a candidate should move to validation or paper handoff."
  - "The report explains big-deal subgoal status in domain language, not generic workflow metrics."
  - "P vs NP candidates distinguish exact transfer obstructions, route-specific no-gos, MCSP/MKtP certificate bridges, restricted-model gates, and all-exponent quantifier lifts."

