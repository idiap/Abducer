      reason: Native skill exists at skills/reporting/target-literature-evolution-narrator/SKILL.md; no
        typed v1 adapter. Source guards, role and failure remain in native_contract.
  step_connect_proof:
    inputs:
      GroundedConjecture:
        type: GroundedConjecture
