interface:
  display_name: "KB Concept Bridge Planner"
  short_description: "Rank bridge programs between essential KB concepts"
  default_prompt: "First restate the intent gate, exact inputs and artifacts in scope, required output shape, and any missing context explicitly; do not assume hidden repository context. When the task involves substantive inference, explicitly separate prompt/context defects from genuine mathematical difficulty: classify context_status as well-posed / partially-ill-posed / ill-posed, inference_status as determined / underdetermined / difficult-but-well-posed, give the smallest repair, and report qualified certainty both now and assuming a well-posed context, and when applicable emit a short Prompt/Inference Diagnosis block before the main result. Normalize the source and target theorem bodies first, identify the highest-value missing conceptual interfaces, state a theorem-shaped claim for each route, mark any renamed-gap carrier as `underspecified`, then assess both constructive and impossibility-style payoff for the viable bridge programs and rank them with a validation run order."


