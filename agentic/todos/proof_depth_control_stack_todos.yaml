schema: abducer.proof_depth_control_stack_todos.v1
created_at: "2026-07-20"
purpose: >
  Build target-neutral proof-depth skills that prevent locally valid proof
  cycles from orbiting shallow, trivial, or already-known objects while avoiding
  the decisive conceptual pressure.
source_artifacts:
  plan: docs/plans-and-reviews/proof-depth-control-stack-plan.md
  ym_attack_plan: agentic/reports/results_ellaboration/a-finite-schur-feshbach-test-for-reflected-wilson-blocks-an-explicit-four-dimens/routea_paper_attack_plan.md
  ym_current_report: agentic/reports/discovery_marathon/targets/yang-mills-existence-and-mass-gap-target/latest.json
  skill_catalog: docs/reference/skills.md
global_controls:
  transferability_policy: >
    Each skill must be target-neutral in its core contract. Target-specific
    examples may appear only as calibration cases, not as hard-coded logic.
  nontriviality_policy: >
    A cycle is not promoted merely because it has lemmas, equations,
    assumptions, falsifiers, or clean validation. It must move a named hard gate
    or produce a demotion/falsifier that changes the proof state.
  declarative_learning_policy: >
    Conceptual learning must be recorded as inference-level facts, not only as
    strategy prose. Each promoted or support-only cycle must state premises,
    attempted move, learned constraint, scope condition, invalidated
    generalization if any, and the future routing consequence.
  conceptual_quality_policy: >
    Every promoted, support-only, or lock-in-candidate cycle must expose a
    heuristic vector for conceptual depth, explanatory power, unification power,
    mechanism specificity, compression, generativity, transfer reach,
    falsifiability, boundary sharpness, and literature displacement. These
    heuristics can guide search and lock-in, but cannot substitute for proof,
    evidence, or transfer certificates.
  anti_definitionality_policy: >
    A principal theorem, especially a transfer theorem, cannot be promoted if
    its conclusion follows only by expanding definitions, renaming objects, or
    defining the target predicate as the image of the source predicate. Promotion
    requires independently specified source and target objects, a target
    property stated without bridge-specific vocabulary, a nontrivial
    preservation law, stress and failure cases, consequence delta, and prior-art
    delta.
  lockin_balance_policy: >
    Exploration should continue until there is critical mass in the learning
    ledger, then temporarily lock into a bounded proof-strategy cycle set for a
    meaningful publication subgoal. After completion, demotion, or blocked-lemma
    handoff, the workflow must return to conceptual exploration with the new
    learning recorded.
  yang_mills_calibration: >
    The stack must classify endpoint or OS-positivity refinements as shallow
    unless they are downstream from geometric-collar realization,
    same-theory normalization, coefficient extraction, or explicit transfer
    gates.
todos:
  - id: PDC-001
    type: planning_todo
    phase: proof-depth-contract
    owner: docs
    priority: critical
    risk_class: shallow-proof-cycle
    title: Define the reusable proof-depth control contract
    intent: >
      Establish the target-neutral contract that every proof-depth skill will
      share: pressure, hard gate, nontriviality test, transfer audit, outcome,
      and demotion rule.
    use_skills:
      - skill-creator
      - abducer-conceptual-pressure-formalizer
      - kb-discovery-breakthrough-profiler
      - results-critical-self-refiner
    required_artifact:
      - docs/plans-and-reviews/proof-depth-control-stack-plan.md
      - agentic/spec/proof_depth_control.schema.json
    acceptance_criteria:
      - The contract defines pressure_kind, hard_gate, proof_object, target_commitment, proposed_move, depth_delta, conceptual_quality_vector, transfer_substance_audit, transfer_status, declarative_learning_event, demotion_trigger, and release_decision.
      - The contract is domain-neutral and can represent both Yang-Mills geometric-collar pressure and P vs NP carrier-uniformity pressure.
      - The contract explicitly distinguishes cycle validity from mathematical depth.
      - The contract defines conceptual quality dimensions: conceptual_depth, explanatory_power, unification_power, mechanism_specificity, compression, generativity, transfer_reach, falsifiability, boundary_sharpness, and literature_displacement.
      - The contract requires anti-definitionality fields: definition_expansion_test, independent_target_property_test, nontrivial_hypothesis_test, source_variation_test, stress_case, failure_case, consequence_delta, and prior_art_delta.
      - The contract requires inference-level learning fields: premises_used, attempted_inference, learned_constraint, scope_condition, invalidated_generalization, and future_routing_effect.
      - The contract contains a demotion path for locally valid but hard-gate-free work.
    blocked_by: []
    evidence:
      - docs/plans-and-reviews/proof-depth-control-stack-plan.md
      - agentic/reports/results_ellaboration/a-finite-schur-feshbach-test-for-reflected-wilson-blocks-an-explicit-four-dimens/routea_paper_attack_plan.md
      - docs/operations/discovery-marathon-operations.md
    review_date: "2026-07-20"
    failure_modes:
      - The contract becomes a generic quality rubric without hard-gate semantics.
      - The contract hard-codes Yang-Mills terminology and cannot transfer.
      - Conceptual quality becomes a single vibe score rather than dimension-specific evidence.
      - The contract allows a transfer theorem to pass when the target property is built into the bridge definition.
      - The contract records learning as high-level narrative rather than reusable declarative inference facts.
      - The contract lacks explicit demotion or quarantine outcomes.
    status: resolved

  - id: PDC-002
    type: workflow_todo
    phase: pressure-formalization
    owner: skills/evaluation
    priority: critical
    risk_class: hidden-conceptual-tension
    title: Create proof-depth-pressure-formalizer
    intent: >
      Convert a stalled proof route, repeated branch pattern, referee criticism,
      or weak result ensemble into typed conceptual pressure before any new
      proof cycle starts.
    use_skills:
      - skill-creator
      - abducer-conceptual-pressure-formalizer
      - theorem-body-normalizer
      - target-literature-source-curator
    required_artifact:
      - skills/evaluation/proof-depth-pressure-formalizer/SKILL.md
      - skills/evaluation/proof-depth-pressure-formalizer/agents/openai.yaml
      - agentic/spec/proof_depth_pressure_packet.schema.json
    acceptance_criteria:
      - The skill emits pressure packets with source evidence, target commitment, pressure kind, missing object, and decision value.
      - The skill rejects pressure packets that only say the problem is hard or that more work is needed.
      - The skill emits the exact inference question that the pressure packet asks the next cycle to decide.
      - The skill emits definitional_collapse pressure when a principal theorem appears to follow by definition expansion rather than by a preservation argument.
      - The skill maps the Yang-Mills diagnosis to geometric-collar realization and same-theory normalization pressure, not endpoint work alone.
      - The skill can also map a P vs NP loop to carrier, uniformity, barrier, or transfer pressure without changing the skill body.
    blocked_by:
      - PDC-001
    evidence:
      - docs/plans-and-reviews/proof-depth-control-stack-plan.md
      - skills/evaluation/abducer-conceptual-pressure-formalizer/SKILL.md
      - agentic/reports/discovery_marathon/targets/yang-mills-existence-and-mass-gap-target/latest.json
    review_date: "2026-07-20"
    failure_modes:
      - The skill produces mood labels instead of typed proof pressure.
      - The skill states a broad goal but no declarative inference question.
      - The skill fails to recognize referee criticism that a transfer theorem is close to definitional as a hard proof-pressure signal.
      - The skill treats all failures as negative and loses positive discovery signals.
      - The skill does not cite artifacts or explicit unknowns.
    status: resolved

  - id: PDC-003
    type: workflow_todo
    phase: hard-gate-selection
    owner: skills/orchestration
    priority: critical
    risk_class: gate-free-continuation
    title: Create proof-hard-gate-selector
    intent: >
      Force each proof cycle to name the single bottleneck it attacks and
      explain how success or failure changes the target proof state.
    use_skills:
      - skill-creator
      - abducer-obligation-gatekeeper
      - next-experiment-queue-ranker
      - long-horizon-route-portfolio-manager
    required_artifact:
      - skills/orchestration/proof-hard-gate-selector/SKILL.md
      - skills/orchestration/proof-hard-gate-selector/agents/openai.yaml
      - agentic/spec/proof_hard_gate_selection.schema.json
    acceptance_criteria:
      - The skill accepts target-supplied hard gates rather than hard-coding any one problem.
      - The skill returns selected_gate, rejected_gates, gate_movement_test, inference_to_learn, promotion_test, pivot_test, and next_experiment.
      - The skill demotes cycles whose proposed action cannot affect a selected hard gate.
      - The skill rejects next experiments that cannot produce a declarative learning event even if they may produce more exposition or local algebra.
      - The skill selects anti-definitionality audit as the next gate when the main risk is that a transfer theorem encodes its conclusion in its definitions.
      - On Yang-Mills, the skill ranks geometric collar and same-theory normalization above endpoint refinement until their dependencies are discharged.
    blocked_by:
      - PDC-001
      - PDC-002
    evidence:
      - docs/plans-and-reviews/proof-depth-control-stack-plan.md
      - agentic/todos/routea_paper_attack_todos.yaml
      - skills/evaluation/abducer-obligation-gatekeeper/SKILL.md
    review_date: "2026-07-20"
    failure_modes:
      - The skill lets branches continue with vague goals such as improve proof or explore route.
      - The selected gate is not tied to a target commitment or proof obligation.
      - The selected gate does not specify the inference-level fact the next cycle is expected to learn.
      - The skill lets a near-definitional transfer theorem proceed to writing without first requiring independent preservation evidence.
      - The skill ranks easy local work above blocked but decisive gates without explanation.
    status: resolved

  - id: PDC-004
    type: workflow_todo
    phase: nontriviality-audit
    owner: skills/evaluation
    priority: critical
    risk_class: theorem-shaped-triviality
    title: Create proof-nontriviality-auditor
    intent: >
      Decide whether a proof object is load-bearing or merely a locally valid
      restatement, algebraic refinement, validation artifact, or exposition
      improvement.
    use_skills:
      - skill-creator
      - contribution-value-assessor
      - progression-payoff-judge
      - paper-contribution-readiness-judge
    required_artifact:
      - skills/evaluation/proof-nontriviality-auditor/SKILL.md
      - skills/evaluation/proof-nontriviality-auditor/agents/openai.yaml
      - agentic/spec/proof_nontriviality_audit.schema.json
    acceptance_criteria:
      - The skill scores depth by theorem-body change, assumption removal, object construction, invariant discovery, falsifier creation, transfer closure, or literature-boundary shift.
      - The skill marks proof objects as load_bearing, support_only, exposition_only, validation_only, blocked, demoted, or quarantined.
      - The skill requires an explicit learned_inference_delta before classifying a cycle as load_bearing.
      - The skill cites the conceptual_quality_vector and explains which dimensions are genuinely improved versus unchanged.
      - The skill caps nontriviality at support_only when the result is a definitional restatement, notation-preserving translation, or conservative unpacking.
      - The skill explains why a valid lemma can still be strategically shallow.
      - The Yang-Mills endpoint kappa_4 loop is classified as support_only unless tied to validated paths and same-regulator endpoint estimates.
    blocked_by:
      - PDC-001
      - PDC-003
    evidence:
      - docs/plans-and-reviews/proof-depth-control-stack-plan.md
      - skills/evaluation/contribution-value-assessor/SKILL.md
      - skills/evaluation/progression-payoff-judge/SKILL.md
    review_date: "2026-07-20"
    failure_modes:
      - The skill confuses polish with depth.
      - The skill penalizes hard unresolved work simply because it is not complete.
      - The skill accepts a cycle as deep because it sounds strategic but has no learned inference delta.
      - The skill treats explanatory or unification language as evidence without naming the mechanism or cases unified.
      - The skill lets a principal transfer theorem count as load-bearing without a consequence delta beyond definitions.
      - The skill lacks a clear support-only category for useful but non-frontier work.
    status: resolved

  - id: PDC-005
    type: workflow_todo
    phase: bridge-object-design
    owner: skills/reasoning
    priority: high
    risk_class: missing-object-avoidance
    title: Create proof-bridge-object-forger
    intent: >
      Design the missing mathematical object, carrier, representation, invariant,
      interface, or transfer law when the blocked route is not reducible to one
      more lemma.
    use_skills:
      - skill-creator
      - kb-concept-bridge-planner
      - kb-discovery-breakthrough-profiler
      - gedanken-situation-designer
    required_artifact:
      - skills/reasoning/proof-bridge-object-forger/SKILL.md
      - skills/reasoning/proof-bridge-object-forger/agents/openai.yaml
      - agentic/spec/proof_bridge_object_packet.schema.json
    acceptance_criteria:
      - The skill names the missing object and why existing objects cannot play its role.
      - The skill returns construction requirements, preserved invariants, broken invariants, validation obligations, and first falsifier.
      - The skill can propose a YM geometric-collar carrier and a P vs NP transfer carrier using the same output contract.
      - The skill forbids bridge objects whose definition already includes the target theorem's conclusion; those are routed to transfer-substance audit before reuse.
      - The skill rejects analogies that do not produce an inspectable object or theorem-shaped obligation.
    blocked_by:
      - PDC-002
      - PDC-003
    evidence:
      - docs/plans-and-reviews/proof-depth-control-stack-plan.md
      - skills/discovery/kb-concept-bridge-planner/SKILL.md
      - skills/evaluation/kb-discovery-breakthrough-profiler/SKILL.md
    review_date: "2026-07-20"
    failure_modes:
      - The skill invents names without construction requirements.
      - The proposed object solves a different problem or changes the target domain.
      - The proposed bridge object hides the desired conclusion inside a predicate, carrier, or normalization definition.
      - The skill emits broad creative prose with no validation handoff.
    status: resolved

  - id: PDC-006
    type: workflow_todo
    phase: same-domain-transfer
    owner: skills/evaluation
    priority: high
    risk_class: silent-domain-shift
    title: Create proof-same-domain-transfer-certifier
    intent: >
      Generalize the same-theory normalization concern into a reusable check
      that arguments preserve model, category, regulator, representation,
      complexity class, semantic regime, and quantifier discipline.
    use_skills:
      - skill-creator
      - bridge-object-equivalence-checker
      - regime-shift-auditor
      - entailment-gap-auditor
    required_artifact:
      - skills/evaluation/proof-same-domain-transfer-certifier/SKILL.md
      - skills/evaluation/proof-same-domain-transfer-certifier/agents/openai.yaml
      - agentic/spec/proof_same_domain_transfer.schema.json
    acceptance_criteria:
      - The skill lists source object, target object, preserved structure, changed structure, transfer theorem, and missing certificate.
      - The skill distinguishes allowed transformations from domain-changing substitutions.
      - The skill distinguishes same-domain preservation from substantive transfer and marks definition-only transfer as support_only until a preservation law is supplied.
      - The skill requires the target property to be stated independently of the bridge map, normalization, or carrier construction.
      - The skill catches YM entrywise normalization without a positivity-preserving certificate.
      - The skill catches P vs NP proof moves that change uniformity, advice, reduction type, or proof-system carrier.
    blocked_by:
      - PDC-001
    evidence:
      - docs/plans-and-reviews/proof-depth-control-stack-plan.md
      - skills/evaluation/bridge-object-equivalence-checker/SKILL.md
      - skills/evaluation/regime-shift-auditor/SKILL.md
    review_date: "2026-07-20"
    failure_modes:
      - The skill only asks whether terms look similar instead of auditing preserved structure.
      - The skill treats a heuristic bridge as a transfer theorem.
      - The skill treats definitional equivalence as enough for transfer without a stress case or failure case.
      - The skill does not state what certificate would repair the transfer gap.
    status: resolved

  - id: PDC-017
    type: workflow_todo
    phase: transfer-substance-audit
    owner: skills/evaluation
    priority: critical
    risk_class: definitional-transfer-theorem
    title: Create proof-transfer-substance-auditor
    intent: >
      Detect principal transfer theorems that are formally correct but close to
      definitional, then require independent preservation evidence before they
      can support a publication claim.
    use_skills:
      - skill-creator
      - proof-same-domain-transfer-certifier
      - proof-nontriviality-auditor
      - entailment-gap-auditor
      - bridge-object-equivalence-checker
      - results-prior-art-disqualifier-auditor
    required_artifact:
      - skills/evaluation/proof-transfer-substance-auditor/SKILL.md
      - skills/evaluation/proof-transfer-substance-auditor/agents/openai.yaml
      - agentic/spec/proof_transfer_substance_audit.schema.json
    acceptance_criteria:
      - The skill emits definition_expansion_test, independent_source_object_test, independent_target_property_test, nontrivial_hypothesis_test, source_variation_test, stress_case_test, failure_case_test, consequence_delta, prior_art_delta, and verdict.
      - The skill demotes definitional_restatement, notation_preserving_translation, and conservative_unpacking to support_only unless the cycle explicitly claims exposition rather than transfer depth.
      - The skill requires the target property to be stateable without bridge-specific vocabulary and without defining it as the image, pullback, normalization, or encoding of the source property.
      - The skill requires at least one admissible source or target variation where the conclusion can fail unless the substantive transfer hypothesis is added, or records the absence of such a variation as a limitation.
      - The skill requires a nonidentity example or stress regime where the bridge map performs genuine preservation work rather than acting as a relabeling.
      - The skill requires a consequence delta explaining what becomes inferable after the theorem that was not already inferable from the definitions.
      - The skill requires a prior-art delta against known equivalence, embedding, normalization, representation, or transfer theorems.
      - In the Yang-Mills calibration case, the skill catches a same-theory normalization theorem that defines normalized Wilson observables so positivity or transfer follows by construction.
      - In the P vs NP calibration case, the skill catches a carrier-transfer theorem whose lower-bound target property is built into the carrier definition.
    blocked_by:
      - PDC-001
      - PDC-004
      - PDC-006
    evidence:
      - docs/plans-and-reviews/proof-depth-control-stack-plan.md
      - skills/evaluation/entailment-gap-auditor/SKILL.md
      - skills/evaluation/bridge-object-equivalence-checker/SKILL.md
    review_date: "2026-07-20"
    failure_modes:
      - The skill rejects all definitional work even when it is honestly labeled exposition or setup.
      - The skill accepts a theorem because its notation is sophisticated while its conclusion follows by expansion.
      - The skill asks for examples but not failure or stress cases, so the bridge remains untested.
      - The skill ignores prior-art transfer results and therefore overstates novelty.
      - The skill cannot explain what certificate would turn a support-only transfer into a substantive one.
    status: resolved

  - id: PDC-007
    type: workflow_todo
    phase: creative-variant-probing
    owner: skills/reasoning
    priority: high
    risk_class: one-story-proof-search
    title: Create proof-creative-variant-prober
    intent: >
      Generate controlled counterfactuals and toy carriers that reveal which
      assumption, variable, invariant, boundary condition, or regime is doing
      real proof work.
    use_skills:
      - skill-creator
      - gedanken-situation-designer
      - gedanken-counterfactual-variant-builder
      - counterfactual-route-prober
    required_artifact:
      - skills/reasoning/proof-creative-variant-prober/SKILL.md
      - skills/reasoning/proof-creative-variant-prober/agents/openai.yaml
      - agentic/spec/proof_creative_variant_probe.schema.json
    acceptance_criteria:
      - The skill requires a varied variable, held-fixed controls, predicted observation, disconfirming observation, and transfer boundary.
      - The skill demotes variants that are analogies without decision value.
      - The skill includes definitional-collapse probes that weaken or vary the bridge definition to see whether the claimed transfer still has independent content.
      - The skill can probe YM footprint locking by varying collar geometry while holding reflection support fixed.
      - The skill can probe P vs NP carrier transparency by varying visibility or uniformity while holding the reduction target fixed.
    blocked_by:
      - PDC-002
      - PDC-005
    evidence:
      - docs/plans-and-reviews/proof-depth-control-stack-plan.md
      - skills/reasoning/gedanken-situation-designer/SKILL.md
      - skills/reasoning/gedanken-counterfactual-variant-builder/SKILL.md
    review_date: "2026-07-20"
    failure_modes:
      - The skill produces examples that cannot affect route ranking.
      - The variants change too many conditions at once.
      - The skill never varies definitions, so it cannot expose a theorem whose conclusion is definition-built.
      - The skill forgets to state what transfers back to the target proof.
    status: resolved

  - id: PDC-008
    type: workflow_todo
    phase: conceptual-quality-heuristics
    owner: skills/evaluation
    priority: critical
    risk_class: vague-depth-judgment
    title: Create proof-conceptual-quality-heuristic-rater
    intent: >
      Rate conceptual depth, explanatory power, unification power, and adjacent
      discovery-quality dimensions using explicit evidence rather than broad
      claims of insight.
    use_skills:
      - skill-creator
      - review-reasoner-fields-medalist
      - review-reasoner-epistemologist
      - kb-discovery-breakthrough-profiler
      - scientific-contribution-detector
      - proof-transfer-substance-auditor
    required_artifact:
      - skills/evaluation/proof-conceptual-quality-heuristic-rater/SKILL.md
      - skills/evaluation/proof-conceptual-quality-heuristic-rater/agents/openai.yaml
      - agentic/spec/proof_conceptual_quality_vector.schema.json
      - docs/plans-and-reviews/proof-depth-control-stack-plan.md
    acceptance_criteria:
      - The skill emits a vector with conceptual_depth, explanatory_power, unification_power, mechanism_specificity, compression, generativity, transfer_reach, falsifiability, boundary_sharpness, and literature_displacement.
      - Each dimension includes score, evidence, missing_evidence, scope, and demotion_trigger.
      - Explanatory power requires a why-because account naming mechanism, mediator, enabling condition, and defeater.
      - Unification power requires at least two previously separate objects, routes, regimes, or failures and a controlled common principle that does not collapse their distinctions.
      - Explanatory, unification, transfer_reach, and literature_displacement scores are capped when a principal theorem fails the transfer-substance audit.
      - The skill refuses to use heuristic score as proof authority; it can only guide search, lock-in readiness, or publication-subgoal value.
      - The Yang-Mills calibration distinguishes finite source-collision algebra, geometric-collar realization, same-theory normalization, endpoint estimates, and mass-gap transfer as different depth/unification claims.
      - The P vs NP calibration distinguishes carrier transparency, uniformity, barrier specificity, and proof-complexity transfer as different depth/unification claims.
    blocked_by:
      - PDC-001
    evidence:
      - docs/plans-and-reviews/proof-depth-control-stack-plan.md
      - skills/evaluation/scientific-contribution-detector/SKILL.md
      - skills/evaluation/kb-discovery-breakthrough-profiler/SKILL.md
    review_date: "2026-07-20"
    failure_modes:
      - The skill emits a single depth score with no evidence per dimension.
      - The skill rewards elegant prose without a mechanism, invariant, or falsifier.
      - The skill rewards unification that hides object mismatch or transfer failure.
      - The skill assigns high transfer_reach to a theorem whose conclusion is obtained by definition expansion.
      - The skill promotes high heuristic quality as if it were a proof.
    status: resolved

  - id: PDC-009
    type: workflow_todo
    phase: release-gating
    owner: skills/evaluation
    priority: critical
    risk_class: unsupported-promotion
    title: Create proof-depth-release-gate
    intent: >
      Decide whether a cycle, result, or queue item should be promoted,
      retained as support, demoted, quarantined, routed to proof delivery, or
      stopped based on hard-gate movement.
    use_skills:
      - skill-creator
      - proof-quality-gatekeeper
      - kb-discovery-governor
      - results-paper-readiness-gatekeeper
      - proof-conceptual-quality-heuristic-rater
      - proof-transfer-substance-auditor
    required_artifact:
      - skills/evaluation/proof-depth-release-gate/SKILL.md
      - skills/evaluation/proof-depth-release-gate/agents/openai.yaml
      - agentic/spec/proof_depth_release_decision.schema.json
    acceptance_criteria:
      - The skill requires pressure packet, selected hard gate, nontriviality audit, conceptual quality vector, transfer substance audit, same-domain transfer audit, and evidence paths before promotion.
      - The skill outputs promote, support_only, lock_in_candidate, demote, quarantine, proof_delivery, pivot, or stop with explicit reasons.
      - The skill forbids breakthrough language unless a hard gate changed.
      - The skill forbids principal-transfer-theorem promotion when definition_expansion_test or independent_target_property_test fails.
      - The skill recommends lock_in_candidate only when the learning ledger identifies a smallest honest publication subgoal and the conceptual quality vector shows enough depth, explanatory power, or unification power for bounded completion cycles.
      - The skill sends theorem-shaped survivors to proof delivery and paper-shaped survivors to result elaboration.
    blocked_by:
      - PDC-003
      - PDC-004
      - PDC-006
      - PDC-008
      - PDC-017
    evidence:
      - docs/plans-and-reviews/proof-depth-control-stack-plan.md
      - skills/proof_delivery/proof-quality-gatekeeper/SKILL.md
      - skills/evaluation/kb-discovery-governor/SKILL.md
    review_date: "2026-07-20"
    failure_modes:
      - The release gate promotes workflow activity as mathematical progress.
      - The release gate has no support-only path and therefore over-demotes useful calculations.
      - The release gate treats high conceptual quality as proof rather than search or lock-in evidence.
      - The release gate lets a close-to-definitional transfer theorem become the paper's main claim.
      - The release gate keeps exploring after a publication-worthy subgoal has enough critical mass to lock in.
      - The release gate does not identify the next consumer skill or artifact.
    status: resolved

