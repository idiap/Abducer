  abducer.native_contract:
    source_skill: proj_skills/workflow-health-audit-orchestrator/SKILL.md
    source_text: "---\nname: workflow-health-audit-orchestrator\ndescription: Orchestrate periodic project-support\
      \ workflow health reviews. Use when Codex should revisit workflow stacks from time to time and systematically\
      \ check for blind-run leakage, orphaned or underhooked skills, poor prompt control, mocked behavior,\
      \ weak deterministic testing coverage, and improvement opportunities as HTML and JSON.\n---\n\n\
      # Workflow Health Audit Orchestrator\n\nUse this skill to periodically review the health of the\
      \ workflow framework itself.\n\nThis is the orchestrator hook for workflow health auditing:\n\n\
      1. `$workflow-leakage-auditor`\n2. `$workflow-orphan-skill-auditor`\n3. `$workflow-prompt-control-auditor`\n\
      4. `$workflow-mock-behavior-auditor`\n5. `$workflow-test-coverage-auditor`\n6. `$workflow-health-html-reporter`\n\
      \n## Workflow\n\n1. Run the bundled deterministic audit generator from the repository root:\n\n\
      \   ```bash\n   audit_dir=$(mktemp -d)\n   python proj_skills/workflow-health-audit-orchestrator/scripts/generate_workflow_health_audit.py\
      \ --repo . --output \"$audit_dir/workflow_health_audit.html\" --json-output \"$audit_dir/workflow_health_audit.json\"\
      \n   ```\n\n2. Inspect severity counts first, then review the grouped findings.\n3. Treat findings\
      \ as triage inputs. Confirm high-impact changes before editing core workflow behavior.\n4. Publish\
      \ a reviewed report under `docs/generated/` only when it should become a maintained documentation\
      \ artifact; ad hoc audits stay temporary.\n\n## Review Dimensions\n\n- leakage and blind-run boundary\
      \ risk\n- orphaned, uncataloged, or underhooked skills\n- prompt control and output-contract weakness\n\
      - mocked, stubbed, skipped, or placeholder behavior\n- missing or weak deterministic test coverage\n\
      \n## Hook Discipline\n\n- Keep this under `proj_skills/`; it audits project/workflow health rather\
      \ than domain scientific artifact semantics directly.\n- Prefer diagnostic findings and TODO candidates\
      \ over silent workflow edits.\n- Distinguish intentionally post-hoc reference handling from actual\
      \ generation-path leakage.\n- Distinguish legitimate test isolation from mocked behavior that is\
      \ being overclaimed as validation.\n\n## Conceptual Explanatory Core\n\n- Explain which audit dimension\
      \ concentrates the strongest triage signals and why it deserves confirmation.\n- Assign each dimension\
      \ an explicit posture such as repository cross-reference, context-sensitive boundary scan, marker\
      \ scan, or reference heuristic.\n- Keep every health finding at `triage_signal` strength until source\
      \ context or runtime evidence confirms a defect.\n- Give one decision rule: confirm the matched\
      \ context and owning workflow contract before changing core behavior.\n- Use calibration rails suited\
      \ to audit reasoning. Do not reuse the history, topology, or runtime visual grammar.\n"
