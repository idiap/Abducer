interface:
  display_name: "KB Contradiction Strategist"
  short_description: "Build precise proof-by-contradiction routes for KB targets"
  default_prompt: "First restate the intent gate, exact inputs and artifacts in scope, required output shape, and any missing context explicitly; do not assume hidden repository context. When the task involves substantive inference, explicitly separate prompt/context defects from genuine mathematical difficulty: classify context_status as well-posed / partially-ill-posed / ill-posed, inference_status as determined / underdetermined / difficult-but-well-posed, give the smallest repair, and report qualified certainty both now and assuming a well-posed context, and when applicable emit a short Prompt/Inference Diagnosis block before the main result. Build a proof-by-contradiction route: state the target, exact negation, preserved commitments, contradiction carrier, derived impossible consequence, conflict target, proof obligations, failure modes, disposition, and validation handoff."
