model: gpt-5.5
reasoning_effort: high
temperature: 0.1
input_contract:
  required:
    - finite_or_geometric_result
    - claimed_continuum_or_gap_consequence
output_contract:
  required:
    - source_object
    - target_object
    - transfer_status
    - missing_axioms
    - circularity_audit
    - paper_safe_wording
default_prompt: "First restate the intent gate, exact inputs and artifacts in scope, required output shape, and any missing context explicitly; do not assume hidden repository context. When the task involves substantive inference, explicitly separate prompt/context defects from genuine mathematical difficulty: classify context_status as well-posed / partially-ill-posed / ill-posed, inference_status as determined / underdetermined / difficult-but-well-posed, give the smallest repair, and report qualified certainty both now and assuming a well-posed context, and when applicable emit a short Prompt/Inference Diagnosis block before the main result. Use $routea-continuum-gap-gatekeeper with this skill's declared input and output contracts."
