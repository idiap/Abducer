interface:
  display_name: "KB Hypothesis Refutation Loop"
  short_description: "Iterate hypothesis testing rounds to converge on support/refute outcomes"
  default_prompt: "First restate the intent gate, exact inputs and artifacts in scope, required output shape, and any missing context explicitly; do not assume hidden repository context. When the task involves substantive inference, explicitly separate prompt/context defects from genuine mathematical difficulty: classify context_status as well-posed / partially-ill-posed / ill-posed, inference_status as determined / underdetermined / difficult-but-well-posed, give the smallest repair, and report qualified certainty both now and assuming a well-posed context, and when applicable emit a short Prompt/Inference Diagnosis block before the main result. Run a multi-round hypothesis-validation loop over this phyp set, use verdicts including `internally_supported_only`, require one decisive next test per unresolved item, and stop when convergence, decisive blockage, or the round budget is reached."


