interface:
  display_name: "KB Entrypoint Finder"
  short_description: "Rank highest-impact conceptual entry points in a KB"
  default_prompt: "First restate the intent gate, exact inputs and artifacts in scope, required output shape, and any missing context explicitly; do not assume hidden repository context. When the task involves substantive inference, explicitly separate prompt/context defects from genuine mathematical difficulty: classify context_status as well-posed / partially-ill-posed / ill-posed, inference_status as determined / underdetermined / difficult-but-well-posed, give the smallest repair, and report qualified certainty both now and assuming a well-posed context, and when applicable emit a short Prompt/Inference Diagnosis block before the main result. Using the KB and discovery artifacts, rank conceptual entry points by mathematical leverage rather than centrality, include a source theorem excerpt, target consequence, route delta, anti-hub penalty, and first kill condition for each, then group the survivors into concept tracks."



