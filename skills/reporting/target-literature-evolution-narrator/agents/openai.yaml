interface:
  display_name: "Target Literature Evolution Narrator"
  short_description: "Explain the target problem and literature evolution with citations"
  default_prompt: "First restate the intent gate, exact inputs and artifacts in scope, required output shape, and any missing context explicitly; do not assume hidden repository context. When the task involves substantive inference, explicitly separate prompt/context defects from genuine mathematical difficulty: classify context_status as well-posed / partially-ill-posed / ill-posed, inference_status as determined / underdetermined / difficult-but-well-posed, give the smallest repair, and report qualified certainty both now and assuming a well-posed context, and when applicable emit a short Prompt/Inference Diagnosis block before the main result. Use $target-literature-evolution-narrator to write an understandable, cited explanation of the target problem, the conceptual evolution of the literature, what each stage made possible, what remained unresolved, and how this should guide the active discovery workflow."
