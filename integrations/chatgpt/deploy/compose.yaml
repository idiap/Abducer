# A single-host deployment: SQLite and immutable job artifacts share one volume.
x-common: &common
  image: abducer-chatgpt:${ABDUCER_IMAGE_TAG:-local}
  build: .
  init: true
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:size=256m,mode=1777
  volumes:
    - research:/data
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  service:
    <<: *common
    ports:
      - "127.0.0.1:${ABDUCER_PORT:-8000}:8000"
    environment:
      ABDUCER_PUBLIC_URL: ${ABDUCER_PUBLIC_URL:?Set the public HTTPS origin}
      ABDUCER_OIDC_ISSUER: ${ABDUCER_OIDC_ISSUER:?Set the exact OAuth issuer}
      ABDUCER_OIDC_JWKS_URL: ${ABDUCER_OIDC_JWKS_URL:?Set the issuer JWKS URL}
      ABDUCER_REQUIRED_SCOPE: ${ABDUCER_REQUIRED_SCOPE:-abducer}
      ABDUCER_WORKER_ENABLED: ${ABDUCER_WORKER_ENABLED:-false}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    <<: *common
    profiles: [research]
    command: ["python", "-m", "integrations.chatgpt.worker", "--database", "/data/service.sqlite3", "--data-root", "/data", "--source-root", "/app"]
    environment:
      # Preserve the standalone API defaults. ChatGPT handoffs additionally
      # require a configured signed bridge sharing this worker's database.
      ABDUCER_MODEL_PROVIDER: ${ABDUCER_MODEL_PROVIDER:-api}
      ABDUCER_NATIVE_HOOKS_ENABLED: ${ABDUCER_NATIVE_HOOKS_ENABLED:-false}
      ABDUCER_MODEL: ${ABDUCER_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
    depends_on:
      service:
        condition: service_healthy
    mem_limit: 8g
    cpus: 2
    pids_limit: 256

volumes:
  research:
