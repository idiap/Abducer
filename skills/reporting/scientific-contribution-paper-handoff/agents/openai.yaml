interface:
  display_name: "Scientific Contribution Paper Handoff"
  short_description: "Package a certified subgoal as a scoped scientific paper argument"
  default_prompt: "First restate the intent gate, exact inputs and artifacts in scope, required output shape, and any missing context explicitly; do not assume hidden repository context. When the task involves substantive inference, explicitly separate prompt/context defects from genuine mathematical difficulty: classify context_status as well-posed / partially-ill-posed / ill-posed, inference_status as determined / underdetermined / difficult-but-well-posed, give the smallest repair, and report qualified certainty both now and assuming a well-posed context, and when applicable emit a short Prompt/Inference Diagnosis block before the main result. Use $scientific-contribution-paper-handoff to turn a certified or near-certified contribution candidate into a scoped paper handoff with title, smallest honest claim, novelty, explanatory power, implications, evidence table, disqualifiers, limits, and validation handoff."
