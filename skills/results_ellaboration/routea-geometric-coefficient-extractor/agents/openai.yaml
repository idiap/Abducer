model: gpt-5.5
reasoning_effort: high
temperature: 0.1
input_contract:
  required:
    - normalized_collar_block
    - collar_parameter
    - rank_one_limit
output_contract:
  required:
    - H_k
    - K_k
    - remainder_bound
    - reduced_forms
    - proof_status
    - manuscript_patch
default_prompt: "First restate the intent gate, exact inputs and artifacts in scope, required output shape, and any missing context explicitly; do not assume hidden repository context. When the task involves substantive inference, explicitly separate prompt/context defects from genuine mathematical difficulty: classify context_status as well-posed / partially-ill-posed / ill-posed, inference_status as determined / underdetermined / difficult-but-well-posed, give the smallest repair, and report qualified certainty both now and assuming a well-posed context, and when applicable emit a short Prompt/Inference Diagnosis block before the main result. Use $routea-geometric-coefficient-extractor with this skill's declared input and output contracts."
