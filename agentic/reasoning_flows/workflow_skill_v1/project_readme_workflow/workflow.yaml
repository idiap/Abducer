  abducer.native_contract:
    source_skill: proj_skills/project-readme-orchestrator/SKILL.md
    source_text: "---\nname: project-readme-orchestrator\ndescription: Orchestrate a controlled concept-first\
      \ repository README update. Use when creating, substantially rewriting, simplifying, or release-gating\
      \ a project README so its promise, minimal installation path, first use, outputs, trust boundaries,\
      \ and documentation links stay concise and synchronized with executable repository evidence.\n---\n\
      \n# Project README Orchestrator\n\nBuild the README as the project's front door: clear enough to\
      \ run quickly, accurate enough to trust, and shallow enough to lead readers into the documentation\
      \ system.\n\nUse this ordered stack:\n\n1. `$project-readme-concept-builder`\n2. `$project-onboarding-path-verifier`\n\
      \nThe orchestrator assembles the two child packets after those hooks complete; it does not invoke\
      \ itself.\n\n## Workflow\n\n1. Inspect the request and changed repository surfaces. Determine whether\
      \ concept, onboarding, or both require refresh.\n2. Build the concept packet with `$project-readme-concept-builder`.\n\
      3. Build the onboarding packet with `$project-onboarding-path-verifier`.\n4. Assemble the README\
      \ using [README quality contract](references/readme-quality-contract.md).\n5. Keep exhaustive setup,\
      \ integration, artifact, skill, and CI detail in the documents that own it.\n6. Run the deterministic\
      \ README gate:\n\n   ```bash\n   python proj_skills/project-readme-orchestrator/scripts/validate_project_readme.py\
      \ --repo .\n   ```\n\n7. Run documentation, project-skill, and link tests affected by the change.\n\
      8. Inspect the final diff for conceptual order, duplicated guidance, stale paths, and claims stronger\
      \ than their evidence.\n\n## Output Contract\n\nLeave:\n\n- an updated [root project overview](../../README.md)\n\
      - a verified minimal install and first-run path\n- links to canonical deeper documentation\n- an\
      \ updated [project-skill index](../INDEX.md) when the control stack changes\n- deterministic validation\
      \ evidence\n\n## Ownership Boundaries\n\n- Own README quality evidence and feed it into Prism verification\
      \ and handoff gates.\n- Do not duplicate the full install guide, skill catalog, workflow contract,\
      \ integration manuals, artifact schema, or CI matrix.\n- Do not rewrite executable workflow semantics\
      \ to make prose true without explicit authorization.\n- Route framework-architecture changes through\
      \ the repository's meta-framework controls.\n\n## Release Gate\n\nRecommend that Prism block handoff\
      \ when:\n\n- the title and opening promise do not identify the project\n- the conceptual model appears\
      \ after installation detail\n- the first local run requires undocumented credentials\n- a displayed\
      \ command fails parser or execution verification\n- a local Markdown link is broken\n- the README\
      \ overstates validation, fidelity, or signoff\n\nMinor wording preference is not a release blocker.\n"
  abducer.environment:
    python: pyproject.toml
    lock: uv.lock
    native_controls: .codex/config.toml
    native_controls_optional: true
    control_policy: prism_me/shared/references/codex-control-stack.md
  abducer.execution_boundary:
    status: specification_only
    notes: Source inspection only. Effects above deny native execution until a separately reviewed adapter
      exists.
